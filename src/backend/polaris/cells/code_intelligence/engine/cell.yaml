id: code_intelligence.engine
title: Code Intelligence Engine
kind: capability
visibility: public
stateful: false
owner: engineering
purpose: >
  Provide code indexing, context compilation, semantic analysis, and change
  verification capabilities for Director and ChiefEngineer flows.
  This Cell owns the code_intelligence service layer and adapters for accel/
  infrastructure.

current_modules:
  - polaris.cells.code_intelligence.engine.public.contracts
  - polaris.cells.code_intelligence.engine.public.service
  - polaris.infrastructure.code_intelligence.code_intelligence
  - polaris.infrastructure.code_intelligence.code_intelligence_async
  - polaris.infrastructure.code_intelligence.incremental_analyzer

tags:
  - code-analysis
  - semantic-index
  - context-compilation

owned_paths:
  - polaris/cells/code_intelligence/engine/public/**
  - polaris/cells/code_intelligence/engine/internal/**
  - polaris/infrastructure/code_intelligence/**
  - polaris/infrastructure/accel/indexers/**
  - polaris/infrastructure/accel/verify/**

public_contracts:
  modules:
    - polaris.cells.code_intelligence.engine.public.contracts
    - polaris.cells.code_intelligence.engine.public.service
  commands: []
  queries:
    - VerifyAstDependencyQueryV1
  events: []
  results:
    - AstDependencyVerificationResultV1
  errors:
    - CodeIntelligenceEngineErrorV1

depends_on:
  - workspace.integrity
  - kernelone.core
  - policy.workspace_guard

subgraphs: []

state_owners: []

effects_allowed:
  - fs.read:workspace/**
  - process.spawn:code_intelligence/engine/**

verification:
  tests:
    - polaris/cells/code_intelligence/engine/public/tests/test_contracts.py
  gaps:
    - Full indexing migration from infrastructure adapters remains pending.
