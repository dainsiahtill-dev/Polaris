id: chief_engineer.blueprint
title: Chief Engineer Blueprint
kind: capability
visibility: public
stateful: true
owner: engineering
purpose: 'Generate task-level implementation blueprints and dependency analysis for
  Director execution without performing code write operations.

  '
current_modules:
- polaris.cells.chief_engineer.blueprint.public.contracts
- polaris.cells.chief_engineer.blueprint.public.service
- polaris.delivery.http.v2.chief_engineer
tags: []
owned_paths:
- polaris/cells/chief_engineer/blueprint/internal/**
- polaris/cells/chief_engineer/blueprint/public/**
- polaris/cells/chief_engineer/blueprint/tests/**
- polaris/delivery/http/v2/chief_engineer.py
public_contracts:
  modules:
  - polaris.cells.chief_engineer.blueprint.public.contracts
  - polaris.cells.chief_engineer.blueprint.public.service
  commands:
  - GenerateTaskBlueprintCommandV1
  queries:
  - GetBlueprintStatusQueryV1
  events:
  - TaskBlueprintGeneratedEventV1
  results:
  - TaskBlueprintResultV1
  errors:
  - ChiefEngineerBlueprintErrorV1
depends_on:
- context.engine
- llm.control_plane
- policy.permission
- policy.workspace_guard
- finops.budget_guard
- audit.evidence
- runtime.task_market
subgraphs:
- execution_governance_pipeline
state_owners:
- runtime/state/blueprints/*
- runtime/blueprints/*
- runtime/risks/*
- runtime/tech_debt/*
- runtime/adr_log/*
- runtime/tech_radar/*
- runtime/post_mortems/*
effects_allowed:
- fs.read:workspace/**
- fs.write:runtime/state/blueprints/*
- fs.write:runtime/blueprints/*
- fs.write:runtime/risks/*
- fs.write:runtime/tech_debt/*
- fs.write:runtime/adr_log/*
- fs.write:runtime/tech_radar/*
- fs.write:runtime/post_mortems/*
- fs.delete:runtime/blueprints/*
- fs.write:runtime/events/runtime.events.jsonl
- llm.invoke:chief_engineer/*
verification:
  tests:
  - tests/test_chief_engineer_preflight.py
  - polaris/tests/unit/delivery/http/routers/test_v2_chief_engineer_router.py
