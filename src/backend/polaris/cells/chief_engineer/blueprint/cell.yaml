id: chief_engineer.blueprint
title: Chief Engineer Blueprint
kind: capability
visibility: public
stateful: true
owner: engineering
purpose: 'Generate task-level implementation blueprints and dependency analysis for
  Director execution without performing code write operations.

  '
current_modules:
- polaris.cells.chief_engineer.blueprint.public.contracts
- polaris.cells.chief_engineer.blueprint.public.service
- polaris.delivery.http.v2.chief_engineer
tags: []
owned_paths:
- polaris/cells/chief_engineer/blueprint/internal/**
- polaris/cells/chief_engineer/blueprint/public/**
- polaris/cells/chief_engineer/blueprint/tests/**
- polaris/delivery/http/v2/chief_engineer.py
public_contracts:
  modules:
  - polaris.cells.chief_engineer.blueprint.public.contracts
  - polaris.cells.chief_engineer.blueprint.public.service
  commands:
  - BuildChiefEngineerBlueprintPortfolioCommandV1
  - GenerateTaskBlueprintCommandV1
  queries:
  - GetBlueprintStatusQueryV1
  - QueryBlueprintProvenanceV1
  - QueryProjectCompletionContractV1
  - CaptureChiefEngineerPortfolioAuthorityQueryV1
  events:
  - TaskBlueprintGeneratedEventV1
  results:
  - ChiefEngineerBlueprintPortfolioV1
  - ProjectCompletionContractV1
  - ProjectKindAuthorityV1
  - TaskBlueprintResultV1
  - TaskBlueprintProvenanceSnapshotV1
  - VerificationCommandAuthorityV1
  errors:
  - ChiefEngineerBlueprintErrorV1
depends_on:
- orchestration.pm_planning
- context.catalog
- context.engine
- control_plane.run_ledger
- control_plane.verifier_policy
- director.tasking
- llm.control_plane
- policy.permission
- policy.workspace_guard
- finops.budget_guard
- audit.evidence
- roles.runtime
- runtime.artifact_store
- runtime.task_market
- orchestration.workflow_runtime
subgraphs:
- execution_governance_pipeline
state_owners:
- runtime/state/blueprints/*
- runtime/blueprints/*
- runtime/risks/*
- runtime/tech_debt/*
- runtime/adr_log/*
- runtime/tech_radar/*
- runtime/post_mortems/*
effects_allowed:
- fs.read:workspace/**
- fs.write:runtime/state/blueprints/*
- fs.write:runtime/blueprints/*
- fs.write:runtime/risks/*
- fs.write:runtime/tech_debt/*
- fs.write:runtime/adr_log/*
- fs.write:runtime/tech_radar/*
- fs.write:runtime/post_mortems/*
- fs.delete:runtime/blueprints/*
- fs.write:runtime/events/runtime.events.jsonl
- llm.invoke:chief_engineer/*
- process.spawn:git/*
verification:
  tests:
  - tests/test_chief_engineer_preflight.py
  - polaris/tests/unit/delivery/http/routers/test_v2_chief_engineer_router.py
  - polaris/cells/chief_engineer/blueprint/public/tests/test_portfolio_authority_capture.py
  gaps:
  - Blueprint adapter convergence with roles adapters is not complete.
  smoke_commands: []
  test_effects_allowed:
  - path: polaris/cells/chief_engineer/blueprint/public/tests/test_portfolio_authority_capture.py
    effects_allowed:
    - fs.write:private_ce_capture_catalog_fixture
    reason: Synthetic catalog input through real private KFS only; no host authority, provider, process or target repair.
  - path: polaris/cells/chief_engineer/blueprint/tests/test_blueprint_persistence.py
    effects_allowed:
    - fs.write:private_ce_blueprint_fixture
    reason: Writes a deliberately invalid blueprint JSON file inside the disposable persistence directory to prove corrupt-state rejection; no host authority or target repair.
  - path: polaris/cells/chief_engineer/blueprint/tests/test_risks.py
    effects_allowed:
    - fs.write:private_ce_risk_fixture
    reason: Writes synthetic risk records and one deliberately corrupt risk file under the disposable workspace runtime/risks directory to prove read/reject behaviour; no host authority or target repair.
  - path: polaris/cells/chief_engineer/blueprint/tests/test_rollback_guard.py
    effects_allowed:
    - process.spawn:git/rollback_guard_repository
    reason: Runs git init/add/commit inside a disposable tmp_path repository to prove blueprint rollback guard behaviour; the repository is a test fixture and is not the target project.
generated_artifacts: []
