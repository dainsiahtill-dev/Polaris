id: runtime.task_runtime
title: Runtime Task Runtime
kind: workflow
visibility: public
stateful: true
owner: runtime
purpose: 'Provide the single task lifecycle runtime for PM/Director/QA collaboration,
  including canonical taskboard rows, execution-attempt authority, the finalized
  DEO-1 durable fact foundation, and the DEO-2A immutable directed-effect inventory:
  strict sealed/ready parent facts, exact member admission, ready-gated claim/abort,
  and a fresh claim-only hash-bound grant. DEO-2 and DEO-3 are closed and
  complete; durable receipt closure, finite recovery, outcome-bound parent
  close, and terminal admission now belong to this Cell. DEO-4 legacy removal
  and architecture fencing are closed; pre-bench is the only active gate.

  '
