id: runtime.task_runtime
title: Runtime Task Runtime
kind: workflow
visibility: public
stateful: true
owner: runtime
purpose: 'Provide the single task lifecycle runtime for PM/Director/QA collaboration,
  including canonical taskboard rows, execution-attempt authority, and the finalized
  DEO-1 durable fact foundation: guarded aggregate, explicit stream enrollment,
  inactive-write pre-barrier, and read-only parent-operation readiness observation
  with enforcement not_enabled.

  '
current_modules:
- polaris.cells.runtime.task_runtime.public.service
- polaris.cells.runtime.task_runtime.internal.service
- polaris.cells.runtime.task_runtime.internal.execution_session
- polaris.cells.runtime.task_runtime.internal.directed_effect_operation
- polaris.cells.runtime.task_runtime.internal.task_board
tags: []
owned_paths:
- polaris/cells/runtime/task_runtime/**
public_contracts:
  modules:
  - polaris.cells.runtime.task_runtime.public.contracts
  commands:
  - CreateRuntimeTaskCommandV1
  - UpdateRuntimeTaskCommandV1
  - ReopenRuntimeTaskCommandV1
  - BindRuntimeTaskToFactoryRunCommandV1
  - FenceExpiredFactoryRunSessionsCommandV1
  - PrepareOwnerReworkExecutionCommandV1
  - OpenTaskRuntimeExecutionAttemptAuthorityCommandV1
  - HeartbeatTaskRuntimeExecutionAttemptCommandV1
  - SettleTaskRuntimeExecutionAttemptCommandV1
  - EnrollDirectedEffectParentRegistryStreamCommandV1
  - EnrollDirectedEffectOperationStreamCommandV1
  - AdmitDirectedEffectParentCommandV1
  - AdmitDirectedEffectOperationCommandV1
  - ClaimDirectedEffectCommandV1
  - AbortDirectedEffectOperationCommandV1
  queries:
  - ListRuntimeTasksQueryV1
  - GetRuntimeTaskQueryV1
  - ValidateTaskRuntimeExecutionAttemptQueryV1
  - GetDirectedEffectParentRegistryQueryV1
  - GetDirectedEffectOperationQueryV1
  - GetDirectedEffectParentReadinessQueryV1
  events:
  - RuntimeTaskLifecycleEventV1
  - TaskRuntimeExecutionFactV1
  results:
  - RuntimeTaskResultV1
  - RuntimeTaskFactoryRunBindingResultV1
  - ExpiredFactoryRunSessionFenceResultV1
  - OwnerReworkExecutionPreparationResultV1
  - TaskRuntimeExecutionAttemptValidationVerdictV1
  - TaskRuntimeExecutionAttemptAuthorityOpenVerdictV1
  - TaskRuntimeExecutionAttemptHeartbeatVerdictV1
  - TaskRuntimeExecutionAttemptSettlementVerdictV1
  - DirectedEffectStreamEnrollmentResultV1
  - DirectedEffectOperationResultV1
  - DirectedEffectParentRegistryResultV1
  - DirectedEffectParentReadinessStateCountV1
  - DirectedEffectParentReadinessProjectionV1
  - DirectedEffectParentReadinessResultV1
  - ObservableTaskRowsProjectionV1
  errors:
  - RuntimeTaskRuntimeError
depends_on:
- events.fact_stream
subgraphs:
- execution_governance_pipeline
state_owners:
- runtime/tasks/*
- runtime/tasks/sessions/*
effects_allowed:
- fs.read:runtime/tasks/*
- fs.write:runtime/tasks/*
- fs.write:runtime/events/taskboard.terminal.events.jsonl
- fs.read:runtime/tasks/sessions/*
- fs.write:runtime/tasks/sessions/*
- fs.write:runtime/events/task_runtime.execution.jsonl
- ws.outbound:runtime/*
verification:
  tests:
  - polaris/cells/runtime/task_runtime/tests/test_service.py
  - polaris/cells/runtime/task_runtime/tests/test_directed_effect_operation.py
  - polaris/cells/runtime/task_runtime/tests/test_directed_effect_operation_concurrency.py
  - polaris/cells/runtime/task_runtime/tests/test_directed_effect_operation_guarded_fence.py
  - polaris/cells/runtime/task_runtime/tests/test_execution_attempt_settlement.py
  - polaris/tests/test_runtime_projection_snapshot_tasks.py
  gaps:
  - DEO-2, DEO-3, and DEO-4 remain unschedulable; DEO-3 still owns receipt
    closure, recovery, and outcome-bound terminal admission.
  smoke_commands: []
generated_artifacts:
  - generated/context.pack.json
