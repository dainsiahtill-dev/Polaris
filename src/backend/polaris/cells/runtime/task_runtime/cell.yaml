verification:
  tests:
  - polaris/cells/runtime/task_runtime/tests/test_service.py
  - polaris/cells/runtime/task_runtime/tests/test_directed_effect_operation.py
  - polaris/cells/runtime/task_runtime/tests/test_directed_effect_operation_concurrency.py
  - polaris/cells/runtime/task_runtime/tests/test_directed_effect_operation_guarded_fence.py
  - polaris/cells/runtime/task_runtime/tests/test_execution_attempt_settlement.py
  - polaris/tests/test_runtime_projection_snapshot_tasks.py
  - polaris/tests/architecture/test_deo_2d_zero_unbound_mutation_surfaces.py
  gaps:
  - DEO-2A, DEO-2B, DEO-2C, and DEO-2D are closed and complete. Repository
    inventory proves one physical mutation consumer and zero unbound mutation
    surfaces; TaskRuntime remains the sole durable directed-effect authority.
  - DEO-3 durable receipt settlement and DEO-4 legacy removal are closed and complete under
    docs/superpowers/plans/2026-07-20-deo-3-durable-receipt-settlement.md.
    The DEO-4 architecture fence preserves TaskRuntime as the sole durable
    authority and the canonical mutation port as the sole physical consumer.
    R36 cross-event-loop asyncio.Lock ownership and R37 degraded-projection
    fail-fast are closed. The requalified TaskRuntime + Factory fact chain is
    2126 passed with 12 warnings and architecture is 1411 passed with 8 skipped;
    the R38 isolated L1-04 run exposed and closed an undersized bench timeout
    contract (540s total -> 188s CE physical cap). The full acceptance contract
    is restored to 5400s plus a 6000s outer guard. The one fresh isolated L1-04
    R39 authorization is consumed; Bench remains frozen pending its full audit.
  smoke_commands: []
generated_artifacts:
  - generated/context.pack.json
