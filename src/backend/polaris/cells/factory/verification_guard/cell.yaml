# Cell definition for VerificationGuard.
#
# This cell implements "Verification Before Completion" pattern,
# ensuring that no completion claim is accepted without fresh verification evidence.

id: factory.verification_guard
title: Verification Guard
kind: capability
visibility: public
stateful: false
owner: factory
purpose: >
  Verifies individual claims and projects owner-bound residual diagnostics for
  an exact CE completion contract. Production completion diagnostics accept no
  caller evidence or repair claims; a bootstrap adapter joins owner
  prerequisites but emits completion evidence only from an exact typed,
  current-run per-obligation receipt. TaskRuntime/TaskBoundary/gate summaries
  never substitute for that receipt.
  
  Core principle: "No fresh verification evidence, no completion claim."
  
current_modules:
  - polaris.cells.factory.verification_guard.public.contracts
  - polaris.cells.factory.verification_guard.public.service
  - polaris.cells.factory.verification_guard.public.bootstrap
  - polaris.cells.factory.verification_guard.internal.project_completion_authority
  - polaris.cells.factory.verification_guard.internal.project_completion_diagnostics
  - polaris.cells.factory.verification_guard.internal.project_physical_evidence
  - polaris.cells.factory.verification_guard.internal.verification_engine
  - polaris.cells.factory.verification_guard.internal.safe_executor
tags:
  - verification
  - safety
  - quality-gate
owned_paths:
  - polaris/cells/factory/verification_guard/**
public_contracts:
  modules:
    - polaris.cells.factory.verification_guard.public.contracts
    - polaris.cells.factory.verification_guard.public.service
  commands:
    - VerifyCompletionCommandV1
    - RunProjectCompletionEvidenceCommandV1
  queries:
    - QueryProjectCompletionDiagnosticsV1
  events:
    - VerificationCompletedEventV1
  results:
    - VerifyCompletionResultV1
    - VerificationReport
    - ProjectCompletionDiagnosticsV1
    - RunProjectCompletionEvidenceResultV1
  errors:
    - VerificationGuardErrorV1
    - ProjectCompletionOwnerObservationV1Error
depends_on: []
subgraphs: []
state_owners: []
effects_allowed:
  - fs.read:workspace/**
  - process.spawn:verification/*
verification:
  tests:
    - polaris/cells/factory/verification_guard/tests/test_verification_guard.py
    - polaris/cells/factory/verification_guard/tests/test_project_completion_diagnostics.py
    - polaris/cells/factory/verification_guard/tests/test_project_physical_evidence.py
    - polaris/tests/unit/bootstrap/test_project_completion_diagnostics_owner.py
  gaps:
    - Integration with TurnTransactionController pending
    - Metrics and telemetry collection not implemented
  smoke_commands:
    - python -m pytest polaris/cells/factory/verification_guard/tests/ -v
generated_artifacts: []
