notes:
- EngineeringRunService and engineering/sessions.sqlite3 are the only new-run execution/state owners. Direct Director
  is default; explicit collaborative PM/CE/Director and read-only consult reuse this owner.
- Legacy public DTO names and dependencies below describe retained historical readers/utilities, not permission
  to create legacy runs or invoke old kernel/session/task-market/Factory admission.
- Host PermissionScope, KFS and OS/process sandbox enforce real effects. No new-run PM contract, CE blueprint/hash/portfolio,
  semantic patch, JobToken/DEO/Run Ledger admission or automatic deterministic-repair fallback.
- Historical runtime/roles state is read-only; existing frozen legacy owners are not migrated or resumed by the
  engineering owner. Engineering events publish committed snapshots through event.engineering on runtime.v2.
- Host command artifacts reuse the existing observation JSON; UUID scratch under canonical runtime/command-output is an execution resource, never another fact store.
- A current observation shares one actual KFS input capture within that query only; later queries and cold readers reobserve. HTTP read projection and JSON encoding use the existing bounded KernelOne IO pool.
- The public engineering resource query reads the same canonical SQLite read-only. Terminal/drain/quiescence facts can authorize existing Supervisor settlement, never fresh acceptance; unknown or active work remains fenced.
- Explicit host command_cache persists only exact runtime/command-cache/data. Read-only roles, helpers and Verifier cap at RO; existing current/QA/artifact input manifests bind actual cache bytes and topology. Component qualified; fresh native benefit unverified; no native-delivery claim.
