id: roles.runtime
title: Roles Runtime
kind: capability
visibility: public
stateful: true
owner: orchestration
purpose: 'Composite runtime boundary for shared role kernel and role-session lifecycle;
  PM/Director/QA/ChiefEngineer behavior is delegated to dedicated business cells.

  '
current_modules:
- polaris.cells.roles.runtime.public.contracts
- polaris.cells.roles.runtime.public.service
tags:
- composite
owned_paths:
- polaris/cells/roles/runtime/public/**
- polaris/cells/roles/runtime/internal/**
- polaris/delivery/http/routers/role_chat.py
- polaris/delivery/http/routers/role_session.py
public_contracts:
  modules:
    - polaris.cells.roles.runtime.public.contracts
  commands:
    - InstantiateRoleRuntimeObjectCommandV1
    - ExecuteRoleTaskMarketLifecycleCommandV1
    - ExecuteRoleCapabilityInvocationCommandV1
    - AssembleRoleRuntimeChainCommandV1
    - RoleStateCommitRequest
    - RehydrateRoleHandoffCommandV1
    - ExecuteRoleTaskCommandV1
    - ExecuteRoleSessionCommandV1
    - AggregateChatCompletionsCommandV1
  queries:
    - GetRoleRuntimeStatusQueryV1
    - BuildAggregateRolePlanQueryV1
    - AuditAggregateRuntimeIntegrationsQueryV1
  events:
    - RoleTaskStartedEventV1
    - RoleTaskCompletedEventV1
  results:
    - RoleRuntimeObjectResultV1
    - RoleTaskMarketLifecycleResultV1
    - RoleCapabilityInvocationResultV1
    - RoleRuntimeChainAssemblyResultV1
    - RoleStateCommitReceipt
    - RoleHandoffRehydrationResultV1
    - RoleExecutionResultV1
    - AggregateRolePlanResultV1
    - AggregateRoleLobeV1
    - AggregateCognitiveLedgerEntryV1
    - AggregateTakeoverDirectiveV1
    - AggregateRuntimeIntegrationV1
    - AggregateRuntimeEntrypointCheckV1
    - AggregateRuntimeAuditResultV1
    - AggregateChatCompletionsResultV1
    - AggregateChatChoiceV1
    - AggregateChatMessageV1
  errors:
    - RoleRuntimeErrorV1
depends_on:
- chief_engineer.blueprint
- code_intelligence.engine
- context.engine
- events.fact_stream
- director.execution
- factory.cognitive_runtime
- factory.verification_guard
- finops.budget_guard
- llm.control_plane
- policy.permission
- policy.workspace_guard
- qa.audit_verdict
- roles.engine
- roles.kernel
- roles.profile
- roles.session
- runtime.task_market
- runtime.task_runtime
- runtime.projection
- runtime.execution_broker
- runtime.state_owner
- archive.run_archive
- audit.diagnosis
- cognitive.knowledge_distiller
subgraphs:
- execution_governance_pipeline
state_owners:
- runtime/roles/*
effects_allowed:
- fs.read:runtime/**
- fs.write:runtime/roles/*
- fs.write:runtime/tasks/*
- fs.write:runtime/state/*
- fs.write:runtime/events/*
- fs.write:runtime/strategy_runs/*
- fs.write:runtime/cognitive_runtime/*
- ws.outbound:runtime/*
- process.spawn:roles/*
- process.spawn:director/*
- bus.publish:agent_messages/*
- bus.consume:agent_messages/*
- task_market.publish:*
- task_market.read
- task_market.claim
- task_market.lease
- task_market.ack
- task_market.fail
- task_market.requeue
- task_market.dead_letter
- runtime_projection.read
- blueprint.generate:*
- blueprint.memo.record
- process.spawn:qa/pytest
- qa.failure_signal.parse
- qa.verdict.issue
- llm.invoke:vision
- budget.reserve:context
- mutation.guard:workspace
- architect.validate_cell_boundary
- code_intelligence.read
- change_set.validate
- runtime_receipt.record
- handoff.export
- handoff.rehydrate
verification:
  tests:
  - tests/test_roles_kernel.py
  - tests/test_runtime_role_binding.py
  - tests/test_roles_state_ownership.py
  - tests/test_roles_runtime_bus.py
  - polaris/cells/roles/runtime/public/tests/test_role_runtime_object_contracts.py
  - polaris/cells/roles/runtime/public/tests/test_directed_effect_attempt_validation.py
  - polaris/cells/roles/runtime/public/tests/test_directed_effect_port_wiring.py
  - polaris/cells/roles/runtime/tests/test_host_session_continuity.py
  gaps:
  - Role kernel is converged; business-role cell extraction still has remaining call-site
    rewiring.
  - 'KernelOne Bus integration uses InMemoryAgentBusPort (in-process only); full cross-process
    NATS topic routing is not yet wired. Tracked gap: bus_port requires KernelOne
    MessageBus adapter for durable delivery.

    '
  - "Role runtime execution is single-path: RoleRuntimeService.execute_role_task(),\
    \ execute_role_session(), and execute_role() all route through RoleExecutionKernel\
    \ (CHAT | WORKFLOW mode). Phase 4 standalone/TUI execution modules have been\
    \ removed; architecture regression coverage now lives in workflow_runtime/tests/test_isolation.py.\n"
  smoke_commands: []
generated_artifacts: []
