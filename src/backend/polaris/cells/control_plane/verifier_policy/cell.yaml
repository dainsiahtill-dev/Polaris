id: control_plane.verifier_policy
title: Control Plane Verifier Policy
kind: capability
visibility: public
stateful: true
owner: control-plane
purpose: >
  Own platform-level optional verification policy for browser, visual,
  multimodal LLM judge, and user-defined script evidence. Internal stress
  harnesses may consume this policy; formal product surfaces must use this
  platform namespace.
current_modules:
  - polaris.cells.control_plane.verifier_policy.public.contracts
  - polaris.cells.control_plane.verifier_policy.public.service
owned_paths:
  - polaris/cells/control_plane/verifier_policy/**
public_contracts:
  modules:
    - polaris.cells.control_plane.verifier_policy.public.contracts
    - polaris.cells.control_plane.verifier_policy.public.service
  commands:
    - UpdateVerifierPolicyCommandV1
  queries:
    - ReadVerifierPolicyQueryV1
    - EvaluateVerifierCommandPolicyQueryV1
  events: []
  results:
    - VerifierPolicyResultV1
    - VerifierCommandPolicyDecisionV1
  errors:
    - ControlPlaneVerifierPolicyV1Error
depends_on: []
subgraphs:
  - execution_governance_pipeline
state_owners:
  - workspace/.polaris/verifier_policy.json
effects_allowed:
  - fs.read:workspace/.polaris/verifier_policy.json
  - fs.write:workspace/.polaris/verifier_policy.json
verification:
  tests:
  - polaris/cells/control_plane/verifier_policy/tests/test_public_service.py
  - polaris/tests/unit/delivery/http/routers/test_control_plane_router.py
  gaps:
  - This Cell evaluates command proposals but never mints spawn capability; runtime.execution_broker must re-evaluate the
    exact query while consuming its own one-use fenced launch lease.
  smoke_commands: []
  test_effects_allowed:
  - path: polaris/cells/control_plane/verifier_policy/tests/test_direct_node_test_runner.py
    effects_allowed:
    - process.spawn:node/direct_test_runner
    reason: Real Node runner verifies physical success failure and zero-test rejection in isolated fixture files.
  - path: polaris/cells/control_plane/verifier_policy/tests/test_node_direct_command_profiles.py
    effects_allowed:
    - process.spawn:node/direct_command_profiles
    reason: Real direct Node test commands preserve nonzero and zero-test verdicts for accepted command profiles.
