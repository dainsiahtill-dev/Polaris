id: kernelone.core
title: KernelOne Core
kind: capability
visibility: public
stateful: false
owner: kernelone
purpose: 'Core kernel capabilities for Context OS, Workflow Engine, and shared
  kernel utilities. Provides the foundational OS-level capabilities used by
  business cells through explicit contracts. This cell must not depend on any
  application or domain cell.'
current_modules:
- polaris.kernelone.context.truth_log_service
- polaris.kernelone.context.working_state_manager
- polaris.kernelone.context.receipt_store
- polaris.kernelone.context.projection_engine
- polaris.kernelone.context.control_plane_noise
- polaris.kernelone.context.budget_gate
- polaris.kernelone.context.compaction
- polaris.kernelone.context.session_continuity
- polaris.kernelone.context.working_set
- polaris.kernelone.context.context_os.models
- polaris.kernelone.context.context_os.models_v2
- polaris.kernelone.context.context_os.content_store
- polaris.kernelone.context.context_os.receipt_store
- polaris.kernelone.context.context_os.runtime
- polaris.kernelone.context.context_os.storage
- polaris.kernelone.context.context_os.snapshot
- polaris.kernelone.context.context_os.budget_optimizer
- polaris.kernelone.context.context_os.classifier
- polaris.kernelone.context.context_os.contracts
- polaris.kernelone.context.context_os.policies
- polaris.kernelone.context.context_os.ports
- polaris.kernelone.workflow.engine
tags: []
owned_paths:
- polaris/kernelone/context/**
- polaris/kernelone/workflow/engine.py
public_contracts:
  modules:
  - polaris.kernelone.context.context_os
  - polaris.kernelone.context.context_os.contracts
  - polaris.kernelone.workflow
  - polaris.kernelone.context.context_os.summarizers.contracts
  - polaris.kernelone.context.context_os.summarizers.slm_config
  - polaris.kernelone.context.context_os.summarizers.slm
  commands: []
  queries:
  - ProjectionRequest
  events: []
  results:
  - ProjectionResult
  - ProjectionReport
  - ReceiptRef
  - ContextWindowPolicy
  errors: []
depends_on: []
subgraphs: []
state_owners: []
effects_allowed:
- fs.read:workspace/**
- fs.read:runtime/**
- fs.write:runtime/**
verification:
  tests:
  - polaris/kernelone/context/tests/**
  - polaris/kernelone/context/context_os/tests/**
  - polaris/kernelone/workflow/tests/**
  - polaris/kernelone/context/context_os/summarizers/tests/test_slm_summarizer.py
  - polaris/kernelone/context/context_os/summarizers/tests/test_summarizers.py
  - polaris/tests/unit/bootstrap/test_slm_binding_assembly.py
  gaps:
  - Workflow engine contracts not yet fully defined.
  smoke_commands: []
  test_dependencies:
    - path: polaris/kernelone/context/context_os/summarizers/tests/test_slm_summarizer.py
      depends_on:
      - roles.kernel
    - path: polaris/kernelone/context/context_os/summarizers/tests/test_summarizers.py
      depends_on:
      - roles.kernel
  test_effects_allowed:
    - path: polaris/kernelone/context/tests/test_engine_providers.py
      effects_allowed:
      - fs.write:private_kernelone_provider_fixture
      reason: Writes synthetic contract.json and events.jsonl provider fixtures inside a disposable project root to exercise the provider protocol; no host authority or target repair.
    - path: polaris/kernelone/context/context_os/tests/test_emergency_compaction_metrics_boundary.py
      effects_allowed:
      - process.spawn:python/contextos_legacy_alias_cold_import
      reason: Bounded isolated Python cold import observes historical ContextOS public aliases without loading Cell modules; no provider, target repair or production permission grant.
generated_artifacts:
- generated/context.pack.json
