id: resident.autonomy
title: Resident Autonomy
kind: capability
visibility: public
stateful: true
owner: resident
purpose: 'Provide long-running resident autonomy capability including goal governance,
  decision traceability, evidence assembly, and self-improvement loops.

  '
current_modules:
- polaris.cells.resident.autonomy.public.contracts
- polaris.cells.resident.autonomy.public.service
