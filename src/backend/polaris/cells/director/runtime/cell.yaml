id: director.runtime
title: Director Runtime
kind: workflow
visibility: public
stateful: false
owner: engineering
purpose: 'Code/patch application, file application, existence gate, and repair loop
  for Director tasks. Owns PatchApplyEngine, FileApplyService, ExistenceGate, RepairService,
  and the KernelOne tool chain execution capability.

  '
current_modules:
- polaris.cells.director.runtime.public.contracts
- polaris.cells.director.runtime.public.service
- polaris.cells.director.runtime.public.directed_effect_contracts
- polaris.cells.director.runtime.public.directed_effect_policy_contracts
- polaris.cells.director.runtime.public.directed_effect_service
tags: []
owned_paths:
- polaris/cells/director/runtime/**
- polaris/kernelone/tools/**
public_contracts:
  modules:
  - polaris.cells.director.runtime.public.contracts
  - polaris.cells.director.runtime.public.service
  - polaris.cells.director.runtime.public.directed_effect_contracts
  - polaris.cells.director.runtime.public.directed_effect_policy_contracts
  - polaris.cells.director.runtime.public.directed_effect_service
