id: events.fact_stream
title: Events Fact Stream
kind: capability
visibility: public
stateful: true
owner: observability
purpose: 'Provide append-only runtime fact stream ingestion, Nat-JetStream publication,
  and query infrastructure for PM, Director, QA and realtime projection consumers.

  '
current_modules:
- polaris.cells.events.fact_stream.public.contracts
tags: []
owned_paths:
- polaris/kernelone/events/**
- polaris/infrastructure/log_pipeline/**
- polaris/infrastructure/messaging/nats/**
public_contracts:
  modules:
  - polaris.cells.events.fact_stream.public.contracts
  commands:
  - AppendFactEventCommandV1
  queries:
  - QueryFactEventsV1
  events:
  - FactEventAppendedV1
  results:
  - FactStreamQueryResultV1
  errors:
  - FactStreamErrorV1
depends_on:
- policy.workspace_guard
- audit.evidence
- runtime.projection
subgraphs:
- execution_governance_pipeline
- storage_archive_pipeline
state_owners:
- runtime/events/*
effects_allowed:
- fs.read:runtime/events/*
- fs.write:runtime/events/*
- ws.outbound:runtime/*
- process.spawn:*
- nats.publish:hp.runtime.>
- nats.consume:hp.runtime.>
verification:
  tests:
  - tests/test_realtime_single_rail_static_guard.py
  - delivery/tests/test_ws_stream_delivery.py
  - tests/test_runtime_ws_migration.py
  gaps:
  - Legacy process-local realtime infrastructure still exists in isolated modules
    until a follow-up deletion plan retires remaining internal tests.
  smoke_commands: []
generated_artifacts:
- generated/verify.pack.json
