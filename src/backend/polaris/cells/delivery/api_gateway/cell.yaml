id: delivery.api_gateway
title: API Gateway
kind: capability
visibility: public
stateful: false
owner: delivery
purpose: 'Canonical delivery entry for HTTP/WebSocket protocol translation and route
  dispatch. Must remain stateless and delegate business writes downstream.

  '
current_modules:
- polaris.cells.delivery.api_gateway.public.contracts
tags: []
owned_paths:
- polaris/delivery/http/app_factory.py
- polaris/delivery/http/dependencies.py
- polaris/delivery/http/error_handlers.py
- polaris/delivery/http/middleware/**
- polaris/delivery/http/routers/__init__.py
- polaris/delivery/http/routers/_shared.py
- polaris/delivery/http/routers/jetstream_utils.py
- polaris/delivery/http/v2/__init__.py
- polaris/delivery/http/routers/permissions.py
- polaris/tests/integration/delivery/routers/test_permission_tool_policy_composition.py
- polaris/tests/unit/delivery/http/routers/test_permissions_v2.py
public_contracts:
  modules:
  - polaris.cells.delivery.api_gateway.public.contracts
  commands:
  - ApiCommandV1
  queries:
  - ApiQueryV1
  events:
  - ApiResponseEventV1
  results:
  - ApiResponseV1
  errors:
  - ApiGatewayErrorV1
depends_on:
- runtime.projection
- policy.workspace_guard
- policy.permission
- roles.kernel
- roles.profile
subgraphs:
- storage_archive_pipeline
state_owners: []
effects_allowed:
- http.inbound:*
- ws.inbound:*
- fs.read:runtime/*
- fs.read:workspace/history/*
verification:
  tests:
  - tests/architecture/test_polaris_layout.py
  gaps:
  - Router-level capability routing is still in migration.
  smoke_commands: []
  test_dependencies:
  - path: polaris/tests/integration/delivery/routers/test_permission_tool_policy_composition.py
    depends_on:
    - policy.permission
  - path: polaris/tests/unit/delivery/http/routers/test_permissions_v2.py
    depends_on:
    - roles.kernel
    - runtime.state_owner
    - storage.layout
generated_artifacts:
- generated/context.pack.json
