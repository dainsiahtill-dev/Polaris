[pytest]
norecursedirs =
    GitPolaris.tmp_pytest*
    tmp_pytest*
    .tmp_pytest*
    .pytest_tmp*
    pytest-cache-files-*
    .git
    .venv
    venv
    __pycache__
    scripts
    # Exclude worktrees (these are isolated build directories)
    .claude/worktrees/*
    # Exclude agent_stress tests - infrastructure-only, require special test package setup
    tests/agent_stress
    # Exclude benchmark fixture workspaces (these are sandbox tests, not polaris tests)
    **/fixtures/agentic_benchmark/workspaces/*/tests
    **/fixtures/tool_calling_matrix/workspaces/*/tests

# Import mode to avoid module name conflicts (e.g., test_composer.py exists in multiple locations)
# NOTE: import_mode must be set via command line, not pytest.ini

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    asyncio: marks async tests handled by the configured async test runner
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    contract: marks tests as contract tests
    # Platform module solidification gates (see docs/governance/PLATFORM_MODULE_SOLIDIFICATION.md)
    module_event_wait: sealed M01 event-wait / runtime observation
    module_physical_attempt: hardening M02 physical attempt authority
    module_tool_batch_deo: sealed M03 tool batch DEO serial mutation
    module_final_request_context: sealed M04 final request current_user_final
    module_stage_lease: hardening M05 stage lease heartbeat
    module_director_fanout: hardening M06 director multi-task fanout
    module_factory_chain: hardening M07 factory stage chain
    module_run_ledger: hardening M08 run ledger tool lifecycle
    module_four_pillars: open M09 four pillars bench gates
    module_materialization_semantic_quality: hardening M10 materialization semantic quality

# Coverage configuration (requires pytest-cov)
# Run with: pytest --cov=polaris --cov-report=term-missing
addopts =
    -v
    --tb=short
    --strict-markers
    --import-mode=importlib

# Filter warnings
filterwarnings =
    ignore:.*polaris.cells.roles.runtime.internal is deprecated.*:DeprecationWarning
    ignore::DeprecationWarning:polaris.kernelone.llm.tools
    ignore:.*polaris.kernelone.llm.tools is deprecated.*:DeprecationWarning
    ignore::DeprecationWarning:polaris.kernelone.llm.toolkit.definitions
    ignore:.*polaris.kernelone.llm.toolkit.definitions is deprecated.*:DeprecationWarning
    ignore:.*polaris.cells.director.execution.internal.*:DeprecationWarning
    ignore:.*polaris.infrastructure.compat.io_utils is deprecated.*:DeprecationWarning
