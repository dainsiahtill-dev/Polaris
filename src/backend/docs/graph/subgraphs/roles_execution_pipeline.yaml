version: 1
id: roles_execution_pipeline
title: Roles Engineering Execution Pipeline
purpose: Single engineering Agent owner from HTTP/CLI admission through native tool execution, optional read-only
  role collaboration and workspace-scoped session recovery; legacy lifecycle readers are historical.
entry_cells:
- delivery.api_gateway
- delivery.cli
cells:
- roles.runtime
- events.fact_stream
- context.engine
- llm.control_plane
- policy.permission
- policy.workspace_guard
exit_cells:
- roles.runtime
relations:
- from: delivery.api_gateway
  to: roles.runtime
  type: commands
  contract: RoleRunCommand
  note: EngineeringRunService start/cancel/resume; discuss is read-only and creates no run.
- from: delivery.cli
  to: roles.runtime
  type: commands
  contract: RoleRunCommand
  note: Same engineering owner; explicit legacy write admission is retired.
- from: roles.runtime
  to: events.fact_stream
  type: emits
  contract: event.engineering
  note: Committed engineering events on existing Nats-JetStream runtime.v2; transport does not own execution facts.
critical_contracts:
- RoleRunCommand
- PermissionScope
- RunLimits
- ToolObservation
- RoleRunResult
state_boundaries:
- owner: roles.runtime
  state: runtime/engineering/sessions.sqlite3
  note: Sole new-run fact store under <workspace>/.polaris/runtime; no old task/ledger/session mirrors.
- owner: roles.runtime
  state: runtime/engineering/workspace.lock
  note: One workspace writer; release only after known process drain.
- owner: roles.runtime
  state: runtime/roles/*
  note: Historical owned namespace only; no new-run writes or replay.
verify_targets:
  tests:
  - polaris/cells/roles/runtime/tests/test_engineering_loop.py
  - polaris/cells/roles/runtime/tests/test_engineering_roles.py
  - polaris/cells/roles/runtime/tests/test_engineering_service.py
  - polaris/cells/roles/runtime/tests/test_engineering_qa_handoff.py
  - polaris/cells/roles/runtime/tests/test_engineering_output_declarations.py
  - polaris/cells/roles/runtime/tests/test_engineering_provider_retry_delegation.py
  - polaris/cells/roles/runtime/tests/test_engineering_verification.py
  - polaris/cells/roles/runtime/tests/test_engineering_verification_selection.py
  - polaris/cells/roles/runtime/tests/test_engineering_recovery.py
  - polaris/cells/roles/runtime/tests/test_engineering_context_audit.py
  - polaris/cells/roles/runtime/tests/test_engineering_event_selection.py
  - polaris/cells/roles/runtime/tests/test_engineering_budget_visibility.py
  - polaris/cells/roles/runtime/tests/test_engineering_visual_projection.py
  - polaris/cells/roles/runtime/tests/test_engineering_events.py
  - polaris/tests/architecture/test_engineering_no_legacy_admission.py
  contracts:
  - RoleRunCommand
  - PermissionScope
  - RunLimits
  - ToolObservation
  - RoleRunResult
migration_notes:
- New runs default to one Director engineering loop; explicit collaborative PM/Chief Engineer/Director and one-level
  read-only consult reuse the same owner. Uncalled roles remain not_called.
- KernelOne technical provider/native codec, ToolSpec normalization, KFS, sandbox/process drain and budget reuse
  remain. Host PermissionScope grants are immutable by model text, including explicit empty permissions.
- Legacy role host/session/kernel/engine/adapters, TaskMarket, PM contract/CE portfolio/semantic patch and JobToken/DEO/Run
  Ledger admission topology is historical only. New writes and automatic legacy fallback are retired; retained readers/utilities
  are not evidence all historical source was deleted.
- Old in-flight runs remain on original frozen owners; never migrate old IDs or replay unknown effects into engineering.
  Current-source checks and required independent QA determine acceptance, not role completion text.
- ContextOS audits actual final provider request and same-workspace snapshots; runtime.v2 is sole realtime rail.
  Missing physical HTTP/billing evidence remains UNKNOWN.
- Graph declaration/focused tests do not prove final release or all workloads; actual KernelOne ALL/catalog and
  fresh formal results must be reported separately.
