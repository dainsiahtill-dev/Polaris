version: 1
id: code_intelligence_pipeline
title: Code Intelligence Pipeline
purpose: >
  Code indexing, semantic analysis, and context compilation flow from the code
  intelligence engine through workspace integrity to context engine consumption
  for Director and ChiefEngineer execution paths.

entry_cells:
  - director.execution
  - chief_engineer.blueprint
  - roles.runtime
  - workspace.integrity

cells:
  - code_intelligence.engine
  - roles.runtime
  - workspace.integrity
  - context.engine
  - kernelone.core
  - policy.workspace_guard

exit_cells:
  - code_intelligence.engine
  - context.engine

relations:
  - from: code_intelligence.engine
    to: workspace.integrity
    type: depends_on
    contract: workspace.integrity
  - from: code_intelligence.engine
    to: kernelone.core
    type: depends_on
    contract: kernelone.core
  - from: code_intelligence.engine
    to: policy.workspace_guard
    type: queries
    contract: WorkspaceWriteGuardQueryV1
  - from: context.engine
    to: code_intelligence.engine
    type: queries
    contract: repo_symbols_index
  - from: workspace.integrity
    to: code_intelligence.engine
    type: calls
    contract: repo_read_slice
  - from: chief_engineer.blueprint
    to: code_intelligence.engine
    type: depends_on
    contract: code_intelligence.engine
  - from: roles.runtime
    to: code_intelligence.engine
    type: queries
    contract: VerifyAstDependencyQueryV1

critical_contracts:
  - VerifyAstDependencyQueryV1
  - AstDependencyVerificationResultV1
  - repo_symbols_index
  - repo_read_slice
  - repo_read_around
  - repo_read_head
  - repo_read_tail
  - repo_rg
  - WorkspaceWriteGuardQueryV1

state_boundaries:
  - owner: workspace.integrity
    state: workspace/meta/integrity/*

verify_targets:
  tests:
    - tests/test_hyper_opt.py
    - polaris/cells/code_intelligence/engine/public/tests/test_contracts.py
    - polaris/cells/roles/runtime/public/tests/test_role_runtime_object_contracts.py
  contracts:
    - VerifyAstDependencyQueryV1
    - AstDependencyVerificationResultV1
    - repo_symbols_index
    - repo_read_slice

migration_notes:
  - Public AST verification contract is available for CE role runtime invocation.
  - Full indexing migration from infrastructure adapters remains pending.
  - Code intelligence indexing strategy still depends on infrastructure adapter maturity.
