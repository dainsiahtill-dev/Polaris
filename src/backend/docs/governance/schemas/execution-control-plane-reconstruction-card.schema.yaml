$schema: "https://json-schema.org/draft/2020-12/schema"
title: Execution Control Plane Reconstruction Verification Card
description: >
  Verification-card schema for Polaris execution-control-plane reconstruction.
  The card records the evidence required before a base Agent may claim the
  execution architecture is reliable.
type: object
additionalProperties: false
required:
  - schema_version
  - schema_ref
  - card_id
  - bug_summary
  - classification
  - objective
  - bug_path
  - assumptions
  - pre_mortem
  - fact_chain_required_for_signoff
  - negative_controls
  - verification_plan
  - related_assets
  - sign_off

properties:
  schema_version:
    type: string
    const: polaris.execution_control_plane_reconstruction_card.v1
  schema_ref:
    type: string
    minLength: 1
  card_id:
    type: string
    minLength: 1
  bug_summary:
    type: string
    minLength: 1
  classification:
    type: string
    const: structural
  objective:
    type: object
    additionalProperties: false
    required:
      - acceptance_bar
      - non_acceptance_examples
      - required_prompt
      - required_skeptical_report_schema
    properties:
      acceptance_bar:
        type: string
        const: fresh_isolated_completed_verified
      non_acceptance_examples:
        $ref: "#/$defs/string_array"
      required_prompt:
        type: string
        minLength: 1
      required_skeptical_report_schema:
        type: string
        minLength: 1
  bug_path:
    type: object
    additionalProperties: false
    required:
      - file
      - method
      - symptom
    properties:
      file:
        type: string
        minLength: 1
      method:
        type: string
        minLength: 1
      symptom:
        type: string
        minLength: 1
  assumptions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - statement
        - status
        - evidence
      properties:
        id:
          type: string
          minLength: 1
        statement:
          type: string
          minLength: 1
        status:
          $ref: "#/$defs/assumption_status"
        evidence:
          type: string
  pre_mortem:
    type: object
    additionalProperties: false
    required:
      - failure_point
      - risk_zone
    properties:
      failure_point:
        type: string
        minLength: 1
      risk_zone:
        $ref: "#/$defs/string_array"
  fact_chain_required_for_signoff:
    type: object
    additionalProperties: false
    required:
      - final_provider_request
      - provider_response
      - tool_lifecycle_receipt
      - effect_receipts
      - task_boundary_verdict
      - task_runtime_observable_projection
      - run_ledger_projection
      - qa_verdict
      - factory_bench_report
    properties:
      final_provider_request:
        $ref: "#/$defs/evidence_ref_node"
      provider_response:
        $ref: "#/$defs/evidence_ref_node"
      tool_lifecycle_receipt:
        type: object
        additionalProperties: false
        required:
          - required
          - evidence_ref
          - native_tool_calls_count
          - decoded_tool_calls_count
          - dispatched_tool_calls_count
        properties:
          required:
            const: true
          evidence_ref:
            type: string
          native_tool_calls_count:
            $ref: "#/$defs/nullable_integer"
          decoded_tool_calls_count:
            $ref: "#/$defs/nullable_integer"
          dispatched_tool_calls_count:
            $ref: "#/$defs/nullable_integer"
      effect_receipts:
        type: object
        additionalProperties: false
        required:
          - required
          - evidence_refs
        properties:
          required:
            const: true
          evidence_refs:
            $ref: "#/$defs/string_array"
      task_boundary_verdict:
        type: object
        additionalProperties: false
        required:
          - required
          - evidence_ref
          - allowed_terminal_statuses
        properties:
          required:
            const: true
          evidence_ref:
            type: string
          allowed_terminal_statuses:
            type: array
            minItems: 1
            items:
              type: string
      task_runtime_observable_projection:
        $ref: "#/$defs/projection_node"
      run_ledger_projection:
        $ref: "#/$defs/projection_node"
      qa_verdict:
        type: object
        additionalProperties: false
        required:
          - required
          - evidence_ref
          - failure_class
          - responsible_layer
        properties:
          required:
            const: true
          evidence_ref:
            type: string
          failure_class:
            type: string
          responsible_layer:
            type: string
      factory_bench_report:
        type: object
        additionalProperties: false
        required:
          - required
          - evidence_ref
          - requested_project_id
          - canonical_project_id
          - instance_id
          - workspace
          - backend_port
          - frontend_port
        properties:
          required:
            const: true
          evidence_ref:
            type: string
          requested_project_id:
            type: string
          canonical_project_id:
            type: string
          instance_id:
            type: string
          workspace:
            type: string
          backend_port:
            $ref: "#/$defs/nullable_integer"
          frontend_port:
            $ref: "#/$defs/nullable_integer"
  negative_controls:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required:
        - expected
        - evidence
      properties:
        expected:
          type: boolean
        evidence:
          type: string
  verification_plan:
    type: object
    additionalProperties: false
    required:
      - unit_tests
      - integration_tests
      - governance_checks
      - manual_check
    properties:
      unit_tests:
        $ref: "#/$defs/command_checks"
      integration_tests:
        $ref: "#/$defs/command_checks"
      governance_checks:
        $ref: "#/$defs/command_checks"
      manual_check:
        $ref: "#/$defs/string_array"
  related_assets:
    $ref: "#/$defs/string_array"
  sign_off:
    type: object
    additionalProperties: false
    required:
      - completed_by
      - completed_at
      - verified_by
      - verified_at
      - architecture_reliable
      - reliability_claim_rule
    properties:
      completed_by:
        type: string
      completed_at:
        type: string
      verified_by:
        type: string
      verified_at:
        type: string
      architecture_reliable:
        type: boolean
      reliability_claim_rule:
        type: string
        minLength: 1

$defs:
  assumption_status:
    type: string
    enum:
      - unverified
      - verified_true
      - verified_false
      - not_applicable
  command_checks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - command
        - expected
        - status
      properties:
        command:
          type: string
          minLength: 1
        expected:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
  evidence_ref_node:
    type: object
    additionalProperties: false
    required:
      - required
      - evidence_ref
    properties:
      required:
        const: true
      evidence_ref:
        type: string
  nullable_integer:
    type:
      - integer
      - "null"
  projection_node:
    type: object
    additionalProperties: false
    required:
      - required
      - evidence_ref
      - projection_mismatch
    properties:
      required:
        const: true
      evidence_ref:
        type: string
      projection_mismatch:
        type:
          - boolean
          - "null"
  string_array:
    type: array
    items:
      type: string
