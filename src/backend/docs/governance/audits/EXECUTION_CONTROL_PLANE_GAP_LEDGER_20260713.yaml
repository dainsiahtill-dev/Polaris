            - id: DEO-1B-F
              status: completed
              title: exact v1 and v2 parsing into schema-neutral normalized forms
            - id: DEO-1B-G
              status: completed
              title: historical v1 original-receipt replay and schema-neutral idempotency
            - id: DEO-1B-H
              status: completed
              title: changed-semantic conflict and ambiguous-outcome reconciliation
            - id: DEO-1B-I
              status: completed
              title: bounded three-attempt drift-only reprepare evidence
            - id: DEO-1B-J
              status: completed
              title: replay-before-open, post-close denial, and no disk snapshot persistence
            - id: DEO-1B-K
              status: completed
              title: real thread/process parent-admit-versus-public-settle pre-barrier linearization sequence
            - id: DEO-1B-L
              status: completed
              title: active-to-inactive bypass inventory, no-recursive-lock/import fence, TaskRuntime ownership, and Cell/catalog synchronization
            - id: DEO-1B-M
              status: completed
              title: exact seven-field guarded receipt validation, durable-event-first reconciliation, and append_write_failed mapping
        - id: DEO-1C
          status: pending
          title: readiness query and fence
          write_scope:
