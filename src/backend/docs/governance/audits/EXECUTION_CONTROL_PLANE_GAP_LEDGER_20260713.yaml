            - DEO-4 legacy removal
            - KernelOne or FactStream modification
          cross_bucket_p0:
            status: open
            owner_bucket: DEO-3
            finding: >-
              DEO-1B blocks active-to-inactive writes when a registry is OPEN or
              otherwise lacks an eligible outcome-bound close; it does not close
