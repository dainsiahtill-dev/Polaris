              DEO-3 must preserve the existing public settle command as the sole
              terminal entry and order pending terminal intent, guarded parent
              close (registry target, operation-head guard), receipt eligibility
              and outcome-bound proof, then session terminalization and recovery.
            bench_effect: not_schedulable
          pending_small_items:
