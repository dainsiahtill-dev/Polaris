        - id: DEO-1B
          status: closed
          title: TaskRuntime guarded aggregate, enrollment, settlement pre-barrier, and in-memory projection
          write_scope:
            - src/backend/polaris/cells/runtime/task_runtime/public/contracts.py
            - src/backend/polaris/cells/runtime/task_runtime/public/service.py
            - src/backend/polaris/cells/runtime/task_runtime/public/__init__.py
            - src/backend/polaris/cells/runtime/task_runtime/internal/directed_effect_operation.py
            - src/backend/polaris/cells/runtime/task_runtime/internal/service.py
            - src/backend/polaris/cells/runtime/task_runtime/tests/test_service.py
            - directly paired TaskRuntime public/internal/concurrency/architecture tests
            - behavior-stable TaskRuntime cell.yaml, README.agent.md, context packs, and global catalog governance synchronization
          contract: >-
            TaskRuntime exposes explicit registry and operation-stream maintenance
            enrollment commands, both carrying the complete execution_attempt and
            the operation command additionally carrying parent_binding, returning
            non-authoritative receipt observability. Registry enrollment validates
            the attempt before deriving its identity/token. Operation enrollment first
            validates the attempt, derives registry identity from that attempt,
            strict-rebuilds the registry, looks up binding_id, and compares canonical
            workspace/task/attempt plus every supplied/durable binding field before
            any FactStream enrollment call. Business paths never enroll implicitly.
            The sequence is registry enrollment, parent admission, operation
            enrollment with parent binding, then child get/admit/claim/abort. Every child transition performs
            guarded prepare(target operation, guard registry), outside-lock strict
            rebuild/replay/authorization, then guarded commit. Exact replay comes
            before parent OPEN. expected_seq is target-head only; expected_version
            is operation-version only. Only target_snapshot_drift or
            guard_snapshot_drift retry, for at most three total attempts; exhaustion
            is guarded_reprepare_exhausted with attempt, drift, head, identity, and
            binding evidence. Writers emit operation schema v2 without recorded_at;
            exact v1/v2 parsers normalize to one schema-neutral transition and
            replay descriptor. Historical v1 replay returns its original receipt
            before guarded commit; idempotency excludes schema/timestamp/CAS
            volatility; changed semantics conflict and ambiguous outcomes reconcile
            by strict replay without duplication. Parent admission uses one bounded
            local-session -> cooperative-session-file -> FactStream lock order for
            locked validation, strict read/reduction, and registry append only;
            tools, network, TaskBoard, Run Ledger, and projections are outside the
            lock, and locks are not an SSoT. Full GuardedFactAppendedV1 validation
            requires event_id, workspace, stream, storage_path, appended_at,
            appended_seq, and semantic_digest. TaskRuntime must use FactStream's
            public exact-replay receipt and strict facts rather than reproduce the
            private semantic_digest algorithm. Ambiguous failure first resolves an
            exact durable event/receipt, before inactive-attempt handling, and
            append_write_failed remains a typed causal mapping.
            Enrollment is non-authoritative and does not take the session locks;
            parent admission is the sole production parent-registry fact writer.
            TaskRuntimeService owns local-session then cooperative-session-file
            locking, validates the active attempt under those locks, and invokes a
            repository admission method that must not recursively validate,
            reacquire, import, or call back into the service. The local RLock is a
            per-service optimization; the cooperative file lock is the
            cross-instance/process correctness boundary. Every active-to-inactive
            writer runs the same strict registry pre-barrier under that file lock.
            Exact absent/unenrolled or enrolled strict-empty permits the write;
            OPEN returns settlement_parent_close_required with no session/row/fact
            inactive write; CLOSED without DEO-3 outcome proof, corruption, read or
            identity failure, unknown state, and ambiguity fail closed.
            `_persist_snapshot`/`_snapshot_path` disk writes are deleted in favor of
            in-memory rebuild-derived projection only.
          exit_criteria:
            - A: complete validated execution_attempt on both public maintenance commands, attempt-derived registry identity, parent_binding on operation command, typed result, and receipt non-authority
            - B: unenrolled streams and denied paths fail closed before any FactStream enrollment call
            - C: validate attempt, derive registry identity, strict-read, binding_id lookup, and complete canonical durable-binding comparison
            - D: explicit registry-parent-operation-child sequence and no implicit business enrollment
            - E: guarded child prepare/commit with no append_fact_event bypass
            - F: exact v1/v2 parsing into one normalized transition and replay descriptor
            - G: historical v1 original-receipt replay before commit and schema-neutral idempotency
            - H: changed-semantic conflict and ambiguous-outcome strict reconciliation without duplicate append
            - I: bounded three-attempt drift-only reprepare exhaustion evidence
            - J: replay before parent OPEN, no post-close non-replay append, and no disk snapshot write
            - "K: real thread/process parent-admit-versus-public-settle sequence, not AST only: admission first yields OPEN and settlement_parent_close_required with no inactive write, or allowed empty/nonexistent-registry settle first makes admission reject the inactive attempt"
            - "L: hard import/call fence proves parent admission is the sole production registry-fact writer; canonical settle, stale fencing, bulk cancellation suspension, rework failure, dedupe cancellation, role-adapter failure, and reopen suspension all use the pre-barrier; reset rejects active sessions; repository admission does not recursively validate/reacquire/import the service; Cell/catalog synchronization is complete"
          completion_rule: >-
            DEO-1B may transition from pending only after A-L are all green; L is
            a hard gate and cannot be deferred as post-completion cleanup.
          closure_evidence:
            status: closed_2026-07-15
            main_task_runtime_rerun:
              passed: 457
              failed: 0
              warnings:
