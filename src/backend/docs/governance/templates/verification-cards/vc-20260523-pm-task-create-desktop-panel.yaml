pre_mortem:
  - risk: The panel posts an incomplete payload that backend rejects.
    mitigation: Require non-empty subject, send status pending, and split acceptance text into a string array.
  - risk: The created task is acknowledged but not visible to the user.
    mitigation: Project the returned task into backendSelectedTask and select it immediately.
  - risk: The create route becomes another hidden backend action with no audit trail.
    mitigation: Render an explicit `POST /v2/pm/tasks` evidence strip.
