id: vc-20260525-director-blueprint-artifact-handoff-gate
title: Director blueprint artifact handoff gate
date: 2026-05-25
scope:
  - src/backend/polaris/delivery/http/v2/director.py
  - src/backend/polaris/tests/unit/delivery/http/routers/test_v2_director_router.py
  - src/frontend/src/services/pmService.ts
  - src/frontend/src/services/__tests__/pmService.test.ts
  - src/frontend/src/app/components/director/DirectorWorkspace.tsx
  - src/frontend/src/app/components/director/__tests__/DirectorWorkspace.capabilities.test.tsx
change:
  summary: >
    Director readiness diagnostics validate workflow task blueprint references
    against readable Chief Engineer artifacts before allowing execution.
  root_cause: >
    Previous diagnostics trusted blueprint metadata strings as handoff proof,
    so stale or fabricated workflow rows could appear executable without an
    auditable Chief Engineer artifact.
assumptions:
  - Workflow Director rows represent PM/Chief Engineer handoff tasks and must be
    validated against blueprint artifacts.
  - Local Director queue rows may still be manually created tasks and are not
    forced through the PM/Chief Engineer artifact gate.
  - Runtime aggregate blueprints can prove task coverage through task_id,
    pm_task_id, task_update_map, or task_updates.
premortem:
  - The highest-risk mistake is rejecting valid aggregate Chief Engineer
    blueprint files that cover tasks through task_update_map rather than a
    top-level task_id.
  - The second highest-risk mistake is accepting absolute paths outside the
    active workspace/runtime cache.
verification:
