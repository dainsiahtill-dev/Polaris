    - "src/backend/polaris/cells/factory/pipeline/tests/test_factory_workspace_admission.py"
defect:
  symptoms:
    - "restart replay left the durable workspace lease ACTIVE after fencing a live peer"
    - "replay deadline was not rechecked between blocking event, snapshot, role, and lifecycle reads"
    - "failed replay could restore old physical-attempt authority"
  affected_surface: "FactoryRunService restart and stale-owner recovery"
  observed_failures: 8
root_cause: >-
  Admission acquired the lifecycle claim but FactoryRunService did not request
  the new replay_fence transition. Replay also checked its total deadline only
  around outer loops, allowing individual storage reads and lease
  revalidations to cross the budget. Generic rollback then removed the claim
  without preserving the one-way DRAINING fence.
repair_contract:
  restart_replay_increments_fencing_token: true
  restart_replay_state: "draining"
  old_peer_authority_permanently_closed: true
  successful_replay_requires_settlement_evidence_before_release: true
  failed_replay_preserves_draining_fence: true
  deadline_checked_before_and_after_every_blocking_read: true
  replay_head_drift: "fail_closed"
  lease_renewal_during_revalidation: forbidden
  target_project_edits: forbidden
