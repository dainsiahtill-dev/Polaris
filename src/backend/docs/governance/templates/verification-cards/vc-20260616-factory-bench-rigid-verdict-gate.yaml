pre_mortem:
  - risk: Tightening verdict semantics can lower historical scores.
    mitigation: Treat lower scores as correct measurement, and expose per-gate reasons in logs/audit records.
  - risk: A helper-only fix could pass tests but leave main output unchanged.
    mitigation: Main runner calls apply_factory_bench_gates before status logging and aggregate serialization.
  - risk: Reusing all_checks_passed could obscure static vs full-chain failure.
    mitigation: Preserve static_checks_passed separately and add factory_gates.
  - risk: Package-script validation could become a domain-specific scoring rule.
    mitigation: Validate only generic local interpreter entrypoints declared in package.json scripts; do not require tests or inspect business behavior.
