root_cause:
  code: director_pm_dependency_projection_includes_internal_ce_task
  summary: >-
    _director_dependency_schedule projected every unresolved authoritative
    TaskRuntime row for the Factory run as a PM active task. A failed primary
    CE portfolio attempt intentionally remains suspended and resumable while a
    separately claimed schema-repair attempt completes. That internal CE row
    is valid execution evidence but is not a PM dependency vertex, so the
    schedule builder correctly rejected it as unknown. The rejection projector
    then incorrectly rendered every non-executable admission as deadline
    exhaustion, hiding the real cause.
  fix: >-
    Exclude only rows whose provenance proves the same Factory run, the
    chief_engineer_review stage, the chief_engineer role, matching external and
    source task identities, and runtime.task_runtime materialization. Preserve
    all untrusted or unrelated unknown rows so they still invalidate the PM
    schedule fail-closed. Project invalid dependency schedules with a dedicated
    director.dispatch_dependency_schedule_blocker code and the exact blockers;
    preserve the existing deadline signal for genuine budget rejection.
