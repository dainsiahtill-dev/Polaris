bug_summary: >-
  The twentieth authorized fresh isolated L1-04 run proved R23 in a physical
  Chief Engineer schema-repair request: malformed prior bytes were absent,
  bounded failure evidence was present, and the independently claimed repair
  produced an accepted blueprint portfolio. Director was then rejected before
  Provider transport. The public signal claimed that the Factory deadline was
  exhausted, but the typed admission still had 1210 seconds remaining for a
  1155-second request. Its real blocker was
  unknown_active_task_ids:CE-PORTFOLIO-factory_faa2894ebe27. Factory had mixed
  the suspended internal CE primary-attempt TaskRuntime row into the PM-owned
  Director dependency graph.
