card_id: "vc-20260604-cognitive-runtime-contextos-production-activation"
bug_summary: >
  Workflow role adapters could bypass roles.runtime/Context OS, while development
  handoff could fake code changes by writing natural-language intent to a markdown file.

classification: structural

bug_path:
  file: "src/backend/polaris/cells/roles/adapters/internal/director/adapter.py"
  method: "DirectorAdapter._invoke_role_dialogue"
  symptom: "Director code generation used direct dialogue before the canonical role runtime."

assumptions:
  - id: "A1"
    statement: "Director materialization must enter roles.runtime and must not retain a direct dialogue fallback."
    status: verified_true
    evidence: >
      TestDirectorRuntimeFallback.test_role_dialogue_uses_role_runtime_context_os_path_first
      asserts ExecuteRoleSessionCommandV1 role=director, domain=code, stream=False, run_id, task_id,
      and metadata.role_runtime_required=True.

  - id: "A2"
    statement: "Runtime metadata must remain visible in Director adapter results for auditability."
    status: verified_true
    evidence: >
      _normalize_director_role_response preserves metadata, execution_stats, artifacts,
      tool_calls, and tool_results. The runtime-first test asserts role_runtime_entrypoint
      and context_os_expected metadata.

  - id: "A3"
    statement: "Natural-language development handoff must not create placeholder code artifacts."
    status: verified_true
    evidence: >
      DevelopmentWorkflowRuntime._execute_patch now returns
      development_handoff_requires_concrete_patch for plain intent, and
      test_execute_patch_plain_intent_fails_closed asserts no tool call is made.

  - id: "A4"
    statement: "Explicit patch protocols must still execute through existing KernelOne parsing and tool contracts."
    status: verified_true
    evidence: >
      DevelopmentWorkflowRuntime._parse_protocol_file_operations delegates to parse_protocol_output,
      and test_execute_patch_success asserts PATCH_FILE becomes a write_file operation.

  - id: "A5"
    statement: "PM, Architect, Chief Engineer, QA, and Director code-generation bridges must enter RoleRuntimeService without an executable legacy dialogue fallback."
    status: verified_true
    evidence: >
      runtime_dialogue.invoke_role_runtime_first constructs ExecuteRoleSessionCommandV1 and calls
      RoleRuntimeService.execute_role_session. test_workflow_role_adapters_use_runtime_dialogue_helper
      asserts these adapters no longer directly call generate_role_response or invoke_role_runtime_provider,
      while TestRuntimeDialogueHelper verifies runtime-first metadata and fail-closed runtime-boundary behavior.
      TestBlockedEntryPoints.test_runtime_codegen_invokes_director_in_proposal_mode asserts the Director
      code-generation bridge creates an ExecuteRoleSessionCommandV1 with domain=code.

  - id: "A6"
    statement: "Runtime execution failures must surface as failures instead of triggering legacy dialogue or direct-provider fallback."
    status: verified_true
    evidence: >
      TestRuntimeDialogueHelper.test_runtime_execution_failure_is_not_hidden_by_legacy_fallback
      and TestDirectorRuntimeFallback.test_role_dialogue_runtime_execution_failure_does_not_fallback_to_legacy
      assert RuntimeError from RoleRuntimeService execution does not call generate_role_response.
      TestDirectorRuntimeFallback.test_role_dialogue_fails_closed_when_runtime_boundary_unavailable
      asserts boundary construction failure also fails closed.
      TestDirectorRuntimeFallback.test_direct_runtime_provider_bypass_is_removed asserts the old
      direct provider bypass fails closed.

  - id: "A7"
    statement: "Projection-generated target projects must not import Polaris internals, and PM normalization must enter RoleRuntimeService."
    status: verified_true
    evidence: >
      test_projection_lab_pm_normalization_uses_role_runtime asserts projection lab builds a PM
      ExecuteRoleSessionCommandV1 with domain=document and context_os_expected=True. The projection
      lab deterministic test passes verification after json_cli_app_renderer and resource_http_service_renderer
      replace Polaris time imports with target-project standard-library helpers.

  - id: "A8"
    statement: "PM CLI, PM document rendering, non-streaming HTTP chat, and role probe entrypoints must use RoleRuntimeService instead of direct dialogue/provider calls."
    status: verified_true
    evidence: >
      test_generic_backend_uses_role_runtime_command, test_render_llm_authored_docs_uses_architect_role_runtime,
      and test_execute_role_chat_nonstreaming_uses_role_runtime assert ExecuteRoleSessionCommandV1 is built with
      stream=False, role_runtime_required=True, context_os_expected=True, and runtime entrypoint metadata.
      test_production_entrypoints_do_not_call_legacy_llm_boundaries statically blocks these entrypoints from
      calling generate_role_response or invoke_role_runtime_provider directly.

  - id: "A9"
    statement: "Audit LLM local-provider preference must use RoleRuntime provider policy instead of direct provider-runtime invocation."
    status: verified_true
    evidence: >
      task_audit_llm_binding now builds ExecuteRoleSessionCommandV1 via RoleRuntimeService.
      test_make_audit_llm_caller_prefers_local_ollama asserts the first call carries
      blocked_provider_types, test_make_audit_llm_caller_falls_back_to_role_runtime asserts the
      fallback call is unrestricted, and TestProviderTypePolicy asserts AIExecutor rejects
      disallowed provider types before provider invocation. TestAdapterCallsRuntimeBoundary also
      statically blocks audit and PM production entrypoints from reintroducing direct provider/process LLM calls.

  - id: "A10"
    statement: "Required RoleRuntime paths must hard-gate Cognitive Runtime receipt/handoff evidence."
    status: verified_true
    evidence: >
      RoleRuntimeService now returns metadata.cognitive_runtime_evidence on execute_role_session
      and execute_role_task. test_required_cognitive_runtime_evidence_records_receipt_and_handoff,
      test_required_cognitive_runtime_evidence_fails_closed_when_disabled, and
      test_execute_role_session_returns_cognitive_runtime_evidence_metadata cover success,
      fail-closed OFF mode, and returned metadata.

  - id: "A11"
    statement: "Legacy compatibility wrappers must not re-inject direct provider or stale generation shortcuts."
    status: verified_true
    evidence: >
      loop-pm no longer imports invoke_ollama or monkeypatches PM backend provider functions.
      worker_executor legacy _invoke_ollama and _invoke_generation_response now fail closed locally,
      and worker progress markers include a UTF-8 content hash so stale same-size rewrites are not
      treated as completed generation rounds.

  - id: "A12"
    statement: "Frontend runtime projection compatibility must expose source provenance."
    status: verified_true
    evidence: >
      RuntimeProjectionPayload now carries projection_source/provenance. projectionCompat tests assert
      canonical, empty, partial, merged, legacy_flat, and legacy_nested payloads are labeled explicitly,
      including transformed=true and compatibility_reason for legacy conversions.

  - id: "A13"
    statement: "Context override must isolate control-plane fields from prompt-visible data-plane context."
    status: verified_true
    evidence: >
      RoleContextGateway._process_context_override now drops context_os_snapshot, provider policy,
      runtime-required flags, metadata, session/run identifiers, and internal _transaction_kernel_*
      keys before creating a prompt-visible system message.
      test_process_context_override_drops_control_plane_fields asserts these fields do not appear
      while a safe explicit context key remains visible.

  - id: "A14"
    statement: "Cognitive Runtime MAINLINE must affect the current RoleRuntime turn before LLM invocation."
    status: verified_true
    evidence: >
      RoleRuntimeService._prepare_session_request invokes CognitiveMiddleware in MAINLINE before
      kernel.run, injects sanitized cognitive_guidance into context_override, and records
      metadata.cognitive_runtime_preflight. test_prepare_session_request_applies_cognitive_mainline_guidance
      covers current-turn guidance injection, and test_prepare_session_request_fails_closed_when_cognitive_mainline_blocks
      covers pre-LLM blocking.

  - id: "A15"
    statement: "HTTP role, PM, and role-session streaming must enter RoleRuntimeService directly instead of the dialogue compatibility facade."
    status: verified_true
    evidence: >
      role_runtime_chat.execute_role_chat_streaming builds ExecuteRoleSessionCommandV1(stream=True)
      and maps RoleRuntime stream events into the SSE queue format. role_chat.py, pm_chat.py,
      and role_session.py no longer import generate_role_response_streaming. The focused router
      suite and test_execute_role_chat_streaming_uses_role_runtime verify the migrated path.

  - id: "A16"
    statement: "Prompt assembly must fail closed when chunk/Tri-Axis assembly cannot emit a final request receipt."
    status: verified_true
    evidence: >
      PromptBuilder no longer falls back to legacy string joining or template recursion when
      chunk assembly or RoleComposer recipe resolution fails. test_build_system_prompt_fails_closed_when_chunk_assembly_fails
      asserts the error is surfaced.

  - id: "A17"
    statement: "WorkerExecutor must not mark generated artifacts successful from receipts alone."
    status: verified_true
    evidence: >
      WorkerExecutor now requires generated-file receipts to resolve to real workspace files
      and pass scan_workspace_artifact_quality(relative_paths=...). The focused test
      test_code_generation_rejects_deterministic_scaffold_marker asserts a
      Created by Polaris placeholder fails closed.

  - id: "A18"
    statement: "Director file_creation and bootstrap target backfill must not synthesize deterministic placeholder code."
    status: verified_true
    evidence: >
      _execute_file_creation delegates to _execute_code_generation when concrete target files
      exist and fails closed without CodeGenerationEngine. Bootstrap missing target files now
      call runtime codegen instead of _bootstrap_target_file_content. The tests
      test_execute_file_creation_requires_codegen_without_placeholder and
      test_bootstrap_missing_targets_require_codegen_without_placeholder cover both paths.

  - id: "A19"
    statement: "Director tasking code generation must load from the canonical tasking module."
    status: verified_true
    evidence: >
      polaris.cells.director.tasking.internal.code_generation_engine now contains the implementation.
      polaris.cells.director.execution.internal.code_generation_engine is a compatibility re-export,
      and WorkerExecutor no longer imports or falls back to the execution.internal implementation path.

  - id: "A20"
    statement: "Cognitive Runtime MAINLINE tool denials must affect exposed tool schemas and actual tool execution."
    status: verified_true
    evidence: >
      CognitiveMiddleware preserves CognitiveResponse.blocked_tools, RoleRuntimeService writes them
      to metadata.cognitive_tool_policy and the preflight receipt, and RoleExecutionKernel both filters
      blocked native tool schemas and rejects blocked tool execution before executor dispatch. The
      middleware, runtime strategy, and kernel facade tests cover all three boundaries.

  - id: "A21"
    statement: "The llm.dialogue public role facade must not remain an executable old dialogue path."
    status: verified_true
    evidence: >
      LlmDialogueService.invoke_role_dialogue now builds ExecuteRoleSessionCommandV1 and calls
      RoleRuntimeService.execute_role_session with role_runtime_required, cognitive_runtime_required,
      context_os_expected, and fallback_policy=fail_closed. test_invoke_role_dialogue_uses_role_runtime
      asserts the public facade enters RoleRuntime and emits no legacy_fallback_used metadata.

  - id: "A22"
    statement: "Cognitive Runtime MAINLINE strategy guidance must be applied before stream fingerprints are emitted."
    status: verified_true
    evidence: >
      RoleRuntimeService._apply_cognitive_runtime_preflight now derives metadata.cognitive_strategy_override
      from MAINLINE guidance before stream_chat_turn creates StrategyRunContext. create_strategy_run merges
      that override into StrategyRegistry resolution. test_stream_chat_turn_applies_cognitive_strategy_before_fingerprint
      asserts the first fingerprint event exposes cognitive_strategy_override_applied=True.

  - id: "A23"
    statement: "Cognitive Runtime MAINLINE strategy override must be consumed by ContextGateway before LLM prompt assembly."
    status: verified_true
    evidence: >
      TurnEngineContextRequest now carries strategy_override as control-plane data. ToolLoopController extracts
      metadata.cognitive_strategy_override from RoleRuntime requests, and RoleContextGateway consumes it to expand
      StateFirstContextOS.project(recent_window_messages) and emit budget-pressure telemetry before ProjectionEngine
      builds LLM messages. test_build_context_request_passes_cognitive_strategy_override and
      test_cognitive_strategy_override_expands_context_os_window verify the handoff and actual projection argument.

  - id: "A24"
    statement: "ContextGateway decision hints must reduce the native LLM tool surface in both streaming and non-streaming TransactionKernel paths."
    status: verified_true
    evidence: >
      RoleContextGateway now emits context_decision_hints with budget-pressure and read-only mutation suppression.
      RoleExecutionKernel._apply_runtime_tool_policy consumes those hints after profile whitelist construction and before
      TransactionKernel execution. Non-streaming and streaming transaction paths call the same helper, so Context OS can
      remove expensive read_file and mutating/exec tools without granting any new tools. Facade refactor tests verify the
      resulting schema filtering and safe exceptions for compact_context/update_session_state.

  - id: "A25"
    statement: "The narrowed tool surface must be enforced again at ToolBatchExecutor dispatch time."
    status: verified_true
    evidence: >
      TurnTransactionController and StreamOrchestrator now derive allowed_tool_names from the already-narrowed
      tool_definitions and pass them to ToolBatchExecutor.execute_tool_batch. The executor rejects tool invocations
      outside that set before dispatch. test_execute_turn_passes_narrowed_tool_names_to_direct_batch_executor and
      test_execute_turn_stream_passes_narrowed_tool_names_to_direct_batch_executor verify the non-streaming and
      streaming direct TOOL_BATCH paths.

  - id: "A26"
    statement: "Context OS production code must use structured policy subobjects instead of deprecated compatibility accessors."
    status: verified_true
    evidence: >
      Context OS runtime, pipeline, scheduler, helpers, domain adapter, and RoleRuntime persistence now read
      context_window/window_size/artifact/token_budget/attention_runtime/collection_limits subobjects directly.
      A production scan for deprecated accessor forms under context_os and RoleRuntime persistence returns no matches
      outside the compatibility accessor definitions themselves. The Context OS attention/runtime/policy regression
      suite passes; remaining deprecation warnings are emitted only by compatibility-accessor tests.

  - id: "A27"
    statement: "RoleExecutionKernel must not expose an environment-variable escape hatch back to TurnEngine."
    status: verified_true
    evidence: >
      RoleExecutionKernel.run and run_stream now call TransactionKernel paths directly, and
      RoleExecutionKernel._use_transaction_kernel() is a canonical true boundary rather than an environment flag.
      A production scan of kernel/core.py for LEGACY_FALLBACK, USE_TRANSACTION_KERNEL_PRIMARY, and TurnEngine(
      returns no matches. test_transaction_kernel_cannot_be_disabled_by_removed_env_escape_hatches asserts
      the removed environment variables cannot disable TransactionKernel.

  - id: "A28"
    statement: "ExplorationWorkflowRuntime handoff failures must fail closed instead of being reported as successful handoff."
    status: verified_true
    evidence: >
      HandoffHandler now transitions HANDOFF_WORKFLOW to FAILED when workflow_runtime.execute or execute_stream raises
      or returns a failed/cancelled workflow result. Stream child CompletionEvent is consumed as child status and the
      outer TransactionKernel remains the only completion owner.
      test_transaction_kernel_fails_closed_when_workflow_runtime_fails and
      test_transaction_kernel_fails_closed_when_workflow_runtime_returns_failed_result cover non-streaming paths.
      test_stream_handoff_fails_closed_when_workflow_runtime_fails and
      test_stream_handoff_fails_closed_when_workflow_runtime_returns_failed_completion cover streaming paths.

  - id: "A29"
    statement: "The philosophical Cognitive Lifeform metaphor must not remain in production Python code."
    status: verified_true
    evidence: >
      Production Python docstrings, comments, and CLI text now use cognitive capabilities,
      cognitive pipeline, or cognitive middleware as engineering terms. test_terminology_governance.py
      scans src/backend/polaris production Python files, excluding tests and generated assets, and blocks
      Cognitive Lifeform / Cognitive Life Form / 认知生命体 from returning to code comments or user-facing CLI text.

  - id: "A30"
    statement: "Cognitive Runtime must be active by default and must not be bypassed by the session orchestrator path."
    status: verified_true
    evidence: >
      resolve_cognitive_runtime_mode defaults to MAINLINE, cognitive_runtime_enabled=True maps to MAINLINE,
      and KernelOne flag resolution now only reads canonical KERNELONE_* variables. Legacy POLARIS_* compatibility is
      isolated to polaris._env_compat before kernelone imports. RoleRuntimeService.create_transaction_controller is async
      and calls _prepare_session_request(include_session_snapshot=True), so RoleSessionOrchestrator receives a
      preflighted TransactionKernel request. test_default_is_mainline, test_metadata_enabled_true_maps_to_mainline,
      test_legacy_polaris_env_is_normalized_at_boundary, and
      test_create_transaction_controller_applies_cognitive_mainline_preflight verify these boundaries.

  - id: "A31"
    statement: "Speculative/shadow execution must be active by default while write tools remain fail-closed without a registry-backed prepare shadow."
    status: verified_true
    evidence: >
      is_speculative_execution_enabled defaults to True, TurnTransactionController builds StreamShadowEngine by default,
      and StreamShadowEngine refuses write-tool speculation when no registry-backed prepare shadow is available.
      test_speculative_flag_defaults_enabled, test_stream_controller_builds_shadow_engine_by_default,
      test_stream_controller_speculates_when_flag_enabled, test_stream_controller_no_speculation_when_flag_disabled,
      and test_speculate_write_tool_without_registry_fails_closed verify active-by-default behavior and write safety.

  - id: "A32"
    statement: "WorkflowRoleAdapter and WorkflowRoleNode must enter RoleRuntimeService instead of directly constructing RoleExecutionKernel requests."
    status: verified_true
    evidence: >
      WorkflowRoleAdapter now calls runtime_dialogue.invoke_role_runtime_first, which builds
      ExecuteRoleSessionCommandV1 and calls RoleRuntimeService.execute_role_session with
      role_runtime_required=True, cognitive_runtime_required=True, context_os_expected=True, and
      fail_closed metadata. WorkflowRoleNode delegates to WorkflowRoleAdapter instead of exposing
      a kernel property or tool-loop retry path. test_workflow_entrypoints_do_not_bypass_role_runtime
      statically blocks RoleExecutionKernel, RoleTurnRequest, and .kernel.run from these workflow
      entrypoints, while test_workflow_chain and TestWorkflowAdapter capture RoleRuntime commands.

  - id: "A33"
    statement: "The llm.dialogue internal role compatibility facade must not invoke the old cognitive middleware or RoleExecutionKernel path."
    status: verified_true
    evidence: >
      generate_role_response now delegates to _generate_with_role_runtime, which builds
      ExecuteRoleSessionCommandV1 and calls RoleRuntimeService.execute_role_session with
      role_runtime_required=True, cognitive_runtime_required=True, context_os_expected=True,
      and fallback_policy=fail_closed. The legacy _generate_with_kernel symbol remains only
      as a compatibility wrapper to the RoleRuntime path. test_llm_dialogue_internal_role_facade_does_not_bypass_role_runtime
      statically blocks RoleExecutionKernel, RoleTurnRequest, and get_cognitive_middleware from
      the internal role dialogue module, while test_generate_role_response_delegates_retry_policy_to_role_runtime
      captures the generated RoleRuntime command metadata.

  - id: "A34"
    statement: "Delivery console entrypoints must delegate cognitive preflight to RoleRuntimeService instead of invoking CognitiveMiddleware directly."
    status: verified_true
    evidence: >
      RoleConsoleHost.stream_turn no longer imports or calls get_cognitive_middleware, no longer injects
      prompt appendix guidance from the delivery layer, and records delivery_cognitive_preflight=delegated_to_role_runtime
      with role_runtime_required=True, cognitive_runtime_required=True, and context_os_expected=True on
      ExecuteRoleSessionCommandV1. test_delivery_console_host_delegates_cognitive_preflight_to_role_runtime
      statically blocks direct cognitive middleware from console_host.py, and
      test_director_console_host_loads_history_and_persists_stream_turn captures the generated RoleRuntime command metadata.

  - id: "A35"
    statement: "Default PM Workflow production dispatch must run ChiefEngineer blueprinting before Director fan-out."
    status: verified_true
    evidence: >
      PMWorkflow.run now executes the run_chief_engineer_blueprint activity after PM task validation and before
      DirectorWorkflow.run. The activity calls run_chief_engineer_analysis, writes chief_engineer.blueprint.json,
      merges construction_plan, scope_for_apply, missing_targets, constraints, and chief_engineer metadata back into
      PM task contracts, and then hands the enriched TaskContract list to DirectorWorkflow. ChiefEngineerNode also
      applies task_update_map before returning tasks in the RoleNode/coordinator path. test_pm_workflow_chief_engineer.py
      verifies workflow ordering and activity enrichment, while test_pm_chief_engineer_node.py verifies the RoleNode
      path passes construction blueprints to Director tasks.

  - id: "A36"
    statement: "RoleRuntime streaming turns must expose Cognitive Runtime receipt/handoff evidence on complete events."
    status: verified_true
    evidence: >
      RoleRuntimeService.stream_chat_turn now emits Cognitive Runtime shadow artifacts when the stream complete event
      carries a RoleTurnResult. The complete event receives cognitive_runtime_evidence and metadata.cognitive_runtime_evidence,
      the embedded RoleTurnResult.metadata is patched with the same evidence, and execution_stats marks
      cognitive_runtime_evidence_emitted=True. test_stream_chat_turn_applies_cognitive_strategy_before_fingerprint verifies
      both strategy override ordering and streaming evidence exposure.

  - id: "A37"
    statement: "RoleRuntime session persistence must use SessionContinuityEngine policy APIs so Context OS projections survive policy schema evolution."
    status: verified_true
    evidence: >
      persist_session_turn_state no longer reads the removed legacy policy.context_window path. It delegates history-window
      resolution to SessionContinuityEngine.resolve_history_window and then applies the persistence safety cap before projecting
      session continuity and state_first_context_os back into roles.session context_config. test_persist_session_turn_state_uses_session_continuity_engine_policy
      creates a real in-memory role session with malformed prior continuity metadata, persists a streaming turn, and verifies
      that both session_continuity and state_first_context_os are written back instead of failing before Context OS projection.

  - id: "A38"
    statement: "LLM control-plane streaming must finish when provider tasks complete even if compatibility providers do not emit an explicit COMPLETE sentinel."
    status: verified_true
    evidence: >
      LlmControlPlaneService.stream now treats either producer task completion or an explicit COMPLETE sentinel as the completion
      signal, while still requiring the token queue to drain before returning. This prevents real or test compatibility clients
      that return from chat_stream without sending an empty sentinel from hanging indefinitely. test_llm_control_plane_generate_and_stream
      verifies generate plus streaming completion with a provider that emits two tokens and then returns without a sentinel.

  - id: "A39"
    statement: "context_os_expected must be enforced as a RoleRuntime preflight gate, not kept as passive metadata."
    status: verified_true
    evidence: >
      RoleRuntimeService now enforces context_os_expected during task/session request preparation. If the command metadata
      or context requires Context OS and the resolved runtime feature flag disables it, the turn fails closed with
      context_os_expected_but_disabled before reaching the LLM. Successful required paths stamp metadata.context_os_preflight
      with expected=True and enabled=True, and RoleExecutionResult metadata carries the same preflight evidence.
      test_prepare_session_request_fails_closed_when_context_os_expected_but_disabled
      and test_prepare_task_request_records_context_os_preflight_when_expected verify both failure and active evidence paths.

  - id: "A40"
    statement: "Kernel-owned LLMCaller use must be treated as an internal compatibility adapter, not as a cognitive-layer removal or user-visible legacy path."
    status: verified_true
    evidence: >
      RoleExecutionKernel._get_llm_caller now creates LLMCaller with emit_deprecation_warning=False, and LLMInvoker/stream
      preparation helpers also instantiate that facade in silent internal-adapter mode. Direct external LLMCaller construction
      and method calls still warn. test_internal_llm_caller_adapter_is_silent proves the kernel-owned path no longer emits
      user-visible legacy warnings, while test_direct_compatibility_facade_warns_on_construction and
      test_internal_adapter_call_suppresses_deprecated_method_warning prove the public compatibility API and internal adapter
      remain distinguishable.

  - id: "A41"
    statement: "Director runtime codegen proposal-to-apply must use Cognitive Runtime as a real write acceptance gate, not only as HTTP/test-side capability."
    status: verified_true
    evidence: >
      CodeGenerationEngine now validates accepted generated files through CognitiveRuntimePublicService lease_edit_scope,
      validate_change_set, record_runtime_receipt, map_diff_to_cells, and request_projection_compile before returning
      files as accepted. Promotion is also enforced when graph cell mappings exist. FileApplyService receives the round
      allowed scope and blocks fenced-file writes before write, while protocol writes that exceed scope are restored from
      snapshots. CognitiveRuntimeService._load_graph_cells now converts missing target-project graph catalogs into a
      soft graph_catalog_unavailable mapping note instead of crashing production target-project generation. The tests
      test_runtime_codegen_passes_applied_files_through_cognitive_runtime_gate,
      test_runtime_codegen_rejects_when_cognitive_runtime_gate_denies_change,
      test_apply_response_operations_blocks_fenced_file_outside_allowed_scope,
      test_apply_response_operations_rolls_back_patch_outside_allowed_scope, and
      test_public_service_map_diff_treats_missing_target_graph_as_soft_note verify the active path.

  - id: "A42"
    statement: "Director runtime codegen must preserve one cognitive session across RoleRuntime execution and Cognitive Runtime write-gate evidence."
    status: verified_true
    evidence: >
      CodeGenerationEngine resolves a single director-codegen session_id from run_id, task_id, or prompt hash before invoking
      RoleRuntimeService. The same session_id is then passed into CognitiveRuntimePublicService lease_edit_scope,
      record_runtime_receipt, and request_projection_compile. _director_codegen_task_identity defensively ignores non-scalar
      task identity values so Mock or malformed task objects cannot poison session continuity. test_runtime_codegen_invokes_director_in_proposal_mode
      asserts the RoleRuntime command session_id, and test_runtime_codegen_passes_applied_files_through_cognitive_runtime_gate
      asserts the lease, receipt, and projection commands share that same session.

  - id: "A43"
    statement: "Development workflow handoff must fail closed when the DevelopmentWorkflowRuntime fails, matching ExplorationWorkflowRuntime handoff semantics."
    status: verified_true
    evidence: >
      HandoffHandler.handle_development_handoff now treats DevelopmentWorkflowRuntime exceptions, unsupported stream runtimes,
      and failed child stream events as development_execution_error instead of successful handoff_development. The stream
      path records a failed terminal state, emits a final CompletionEvent(status=error), and suppresses the successful
      _development_handoff_executed session patch when the child runtime fails. TurnStateMachine now permits
      HANDOFF_DEVELOPMENT -> FAILED. test_transaction_kernel_fails_closed_when_development_runtime_fails and
      test_stream_development_handoff_fails_closed_when_runtime_fails cover the non-streaming and streaming paths.

  - id: "A44"
    statement: "Governance graph and active blueprints must not describe Cognitive Runtime and speculative execution with superseded shadow-only or default-off production status."
    status: verified_true
    evidence: >
      docs/graph/catalog/cells.yaml and docs/graph/subgraphs/execution_governance_pipeline.yaml now state that
      Director runtime codegen proposal-to-apply uses Cognitive Runtime as a mainline write acceptance gate for
      scope lease, change-set validation, receipts, diff mapping, and projection compile, while explicitly preserving
      the remaining global orchestration-stage convergence gap. The 2026-04 speculative blueprints and ADRs now carry
      2026-06-04 current-status overrides: speculative execution defaults to enabled with explicit rollback flags, and
      write-tool speculation must fail closed without registry-backed prepare shadow. AGENT_COLLABORATION_EDA_TASK_MARKET_BLUEPRINT_2026-04-14
      now distinguishes Director codegen Cognitive Runtime authority from unfinished Task Market durable pull/outbox work.

  - id: "A45"
    statement: "Task Market lifecycle transitions must record Cognitive Runtime receipts so durable PM/ChiefEngineer/Director/QA claim/ack paths carry runtime governance evidence."
    status: verified_true
    evidence: >
      TaskMarketService now records a task_market_lifecycle receipt through factory.cognitive_runtime public contracts for
      publish, claim, ack, fail, requeue, and dead-letter transitions. The receipt evidence is attached to the work-item
      metadata, transition metadata, and outbox payload. Optional receipt failures are recorded as evidence and do not break
      task-market availability, while tasks that explicitly set cognitive_runtime_required or task_market_cognitive_runtime_required
      fail closed before the lifecycle write is committed. runtime.task_market graph/cell metadata now declares the dependency
      on factory.cognitive_runtime and the runtime/cognitive_runtime write effect. test_publish_claim_ack_records_cognitive_runtime_lifecycle_receipts
      and test_required_cognitive_runtime_receipt_failure_blocks_publish verify the active path.

  - id: "A46"
    statement: "Director production turns must give Context OS and speculative execution the real target workspace, not a Polaris process cwd surrogate."
    status: verified_true
    evidence: >
      DirectorAdapter._build_role_runtime_metadata now marks Director code turns with use_repo_intelligence=True,
      context_os_expected=True, cognitive_runtime_required=True, and bounded repo-intelligence budgets so
      RoleRuntime._build_session_request injects repo intelligence for target-project code work by default.
      RoleExecutionKernel._create_transaction_kernel carries RoleTurnRequest.workspace into TransactionConfig.workspace,
      and TurnTransactionController resolves shadow/speculative ToolBatchRuntime workspace from that config before
      falling back to message metadata or ".". test_create_transaction_kernel_carries_request_workspace,
      test_shadow_engine_uses_configured_target_workspace, and
      test_role_runtime_metadata_requires_context_os_and_repo_intelligence verify the path.

  - id: "A47"
    statement: "PM Workflow ChiefEngineer blueprinting must leave Cognitive Runtime evidence before Director receives enriched tasks."
    status: verified_true
    evidence: >
      PMWorkflow.run now calls run_chief_engineer_blueprint with chief_engineer_session_id,
      cognitive_runtime_required=True, and context_os_expected=True before DirectorWorkflow.run. The activity records a
      chief_engineer_blueprint receipt through factory.cognitive_runtime for completed and failed blueprint attempts,
      attaches the receipt to the activity payload, and copies it into each enriched task under
      chief_engineer.cognitive_runtime_receipt. orchestration.workflow_runtime graph/cell metadata now declares
      factory.cognitive_runtime and runtime/cognitive_runtime write effects. test_run_chief_engineer_blueprint_enriches_director_tasks
      verifies the receipt command, session/run ids, Context OS expectation, and task handoff evidence.

  - id: "A48"
    statement: "Runtime QA final gates must leave Cognitive Runtime evidence before PM can report workflow completion."
    status: verified_true
    evidence: >
      workflow_runtime QAWorkflow now calls record_qa_cognitive_receipt after unit and integration QA results,
      and treats the receipt activity as part of the final qa_passed gate. PMWorkflow passes qa_session_id,
      cognitive_runtime_required=True, and context_os_expected=True into QAWorkflowInput. The activity records a
      qa_verification receipt through factory.cognitive_runtime with unit/integration result paths as trace_refs
      and returns the receipt evidence through QAWorkflow.evidence.cognitive_runtime. test_record_qa_cognitive_receipt_records_required_runtime_evidence
      verifies the public Cognitive Runtime command, session/run ids, Context OS expectation, trace refs, and
      qa::verification turn envelope; test_pm_and_qa_workflows_require_cognitive_runtime_for_final_qa_gate verifies the
      PM/QA workflow wiring.

  - id: "A49"
    statement: "PM dispatch/CLI integration QA must not remain a legacy path that can pass without Cognitive Runtime evidence."
    status: verified_true
    evidence: >
      delivery.cli.pm.orchestration_engine imports run_post_dispatch_integration_qa from orchestration.pm_dispatch.public,
      so the dispatch_pipeline QA path is still a real PM/CLI production path. dispatch_pipeline now records a
      Context OS snapshot through factory.cognitive_runtime ResolveContextCommandV1 before recording a qa_verification
      receipt through RecordRuntimeReceiptCommandV1 after result paths are known. The Context OS evidence is embedded in
      the receipt payload and the receipt evidence is stored back into integration_qa.result.json and emitted in QA
      runtime/dialogue events. Required Context OS resolve failure or receipt failure flips the dispatch QA result to a
      failed reason instead of allowing a false pass.
      orchestration.pm_dispatch graph/cell metadata now declares factory.cognitive_runtime and runtime/cognitive_runtime
      write effects. test_run_post_dispatch_integration_qa_records_cognitive_runtime_receipt and
      test_legacy_run_integration_qa_records_context_os_and_cognitive_receipt verify both the active CLI path and the
      compatibility run_integration_qa path. test_run_post_dispatch_integration_qa_fails_closed_when_context_os_resolve_fails
      verifies the public command contracts, trace refs, Context OS snapshot evidence, persisted evidence, and fail-closed behavior.

  - id: "A50"
    statement: "Docs dialogue/suggest must not call provider_runtime as a naked legacy path without Context OS grounding and Cognitive Runtime receipts."
    status: verified_true
    evidence: >
      llm.dialogue now routes docs_suggest and docs_dialogue provider requests through internal.cognitive_evidence.
      Each docs LLM request first resolves Context OS via factory.cognitive_runtime ResolveContextCommandV1,
      appends the rendered Context OS grounding to the provider prompt, and records a RecordRuntimeReceiptCommandV1
      receipt after provider completion or failure. Streaming docs suggestion results and docs dialogue meta expose compact
      cognitive_runtime evidence. llm.dialogue cell and graph metadata now declare factory.cognitive_runtime and
      runtime/cognitive_runtime write effects. test_generate_docs_fields_uses_context_os_prompt_and_records_receipt and
      test_generate_dialogue_turn_uses_context_os_prompt_and_records_receipt verify prompt injection, public command
      contracts, receipt payload evidence, and returned/streamed metadata.

  - id: "A51"
    statement: "Interactive LLM interview/evaluation must not remain a naked provider_runtime path without Context OS grounding and Cognitive Runtime receipts."
    status: verified_true
    evidence: >
      llm.evaluation internal interview now resolves Context OS through factory.cognitive_runtime before invoking
      CellAIExecutor for non-streaming and streaming interview answers, appends the rendered Context OS grounding to
      the interview prompt, and records llm_interview receipts through RecordRuntimeReceiptCommandV1 after provider
      completion or provider error. Returned interview answers and streaming complete events expose compact
      cognitive_runtime evidence. llm.evaluation cell and graph metadata now declare factory.cognitive_runtime and
      runtime/cognitive_runtime write effects. test_generate_interview_answer_uses_context_os_prompt_and_records_receipt
      and test_generate_interview_answer_streaming_emits_cognitive_runtime_evidence verify prompt injection, receipt
      payload evidence, and returned/streamed metadata.

