card_id: "vc-20260604-cognitive-runtime-contextos-production-activation"
bug_summary: >
  Workflow role adapters could bypass roles.runtime/Context OS, while development
  handoff could fake code changes by writing natural-language intent to a markdown file.

classification: structural

bug_path:
  file: "src/backend/polaris/cells/roles/adapters/internal/director/adapter.py"
  method: "DirectorAdapter._invoke_role_dialogue"
  symptom: "Director code generation used direct dialogue before the canonical role runtime."

assumptions:
  - id: "A1"
    statement: "Director materialization must enter roles.runtime and must not retain a direct dialogue fallback."
    status: verified_true
    evidence: >
      TestDirectorRuntimeFallback.test_role_dialogue_uses_role_runtime_context_os_path_first
      asserts ExecuteRoleSessionCommandV1 role=director, domain=code, stream=False, run_id, task_id,
      and metadata.role_runtime_required=True.

  - id: "A2"
    statement: "Runtime metadata must remain visible in Director adapter results for auditability."
    status: verified_true
    evidence: >
      _normalize_director_role_response preserves metadata, execution_stats, artifacts,
      tool_calls, and tool_results. The runtime-first test asserts role_runtime_entrypoint
      and context_os_expected metadata.

  - id: "A3"
    statement: "Natural-language development handoff must not create placeholder code artifacts."
    status: verified_true
    evidence: >
      DevelopmentWorkflowRuntime._execute_patch now returns
      development_handoff_requires_concrete_patch for plain intent, and
      test_execute_patch_plain_intent_fails_closed asserts no tool call is made.

  - id: "A4"
    statement: "Explicit patch protocols must still execute through existing KernelOne parsing and tool contracts."
    status: verified_true
    evidence: >
      DevelopmentWorkflowRuntime._parse_protocol_file_operations delegates to parse_protocol_output,
      and test_execute_patch_success asserts PATCH_FILE becomes a write_file operation.

  - id: "A5"
    statement: "PM, Architect, Chief Engineer, QA, and Director code-generation bridges must enter RoleRuntimeService without an executable legacy dialogue fallback."
    status: verified_true
    evidence: >
      runtime_dialogue.invoke_role_runtime_first constructs ExecuteRoleSessionCommandV1 and calls
      RoleRuntimeService.execute_role_session. test_workflow_role_adapters_use_runtime_dialogue_helper
      asserts these adapters no longer directly call generate_role_response or invoke_role_runtime_provider,
      while TestRuntimeDialogueHelper verifies runtime-first metadata and fail-closed runtime-boundary behavior.
      TestBlockedEntryPoints.test_runtime_codegen_invokes_director_in_proposal_mode asserts the Director
      code-generation bridge creates an ExecuteRoleSessionCommandV1 with domain=code.

  - id: "A6"
    statement: "Runtime execution failures must surface as failures instead of triggering legacy dialogue or direct-provider fallback."
    status: verified_true
    evidence: >
      TestRuntimeDialogueHelper.test_runtime_execution_failure_is_not_hidden_by_legacy_fallback
      and TestDirectorRuntimeFallback.test_role_dialogue_runtime_execution_failure_does_not_fallback_to_legacy
      assert RuntimeError from RoleRuntimeService execution does not call generate_role_response.
      TestDirectorRuntimeFallback.test_role_dialogue_fails_closed_when_runtime_boundary_unavailable
      asserts boundary construction failure also fails closed.
      TestDirectorRuntimeFallback.test_direct_runtime_provider_bypass_is_removed asserts the old
      direct provider bypass fails closed.

  - id: "A7"
    statement: "Projection-generated target projects must not import Polaris internals, and PM normalization must enter RoleRuntimeService."
    status: verified_true
    evidence: >
      test_projection_lab_pm_normalization_uses_role_runtime asserts projection lab builds a PM
      ExecuteRoleSessionCommandV1 with domain=document and context_os_expected=True. The projection
      lab deterministic test passes verification after json_cli_app_renderer and resource_http_service_renderer
      replace Polaris time imports with target-project standard-library helpers.

  - id: "A8"
    statement: "PM CLI, PM document rendering, non-streaming HTTP chat, and role probe entrypoints must use RoleRuntimeService instead of direct dialogue/provider calls."
    status: verified_true
    evidence: >
      test_generic_backend_uses_role_runtime_command, test_render_llm_authored_docs_uses_architect_role_runtime,
      and test_execute_role_chat_nonstreaming_uses_role_runtime assert ExecuteRoleSessionCommandV1 is built with
      stream=False, role_runtime_required=True, context_os_expected=True, and runtime entrypoint metadata.
      test_production_entrypoints_do_not_call_legacy_llm_boundaries statically blocks these entrypoints from
      calling generate_role_response or invoke_role_runtime_provider directly.

  - id: "A9"
    statement: "Audit LLM local-provider preference must use RoleRuntime provider policy instead of direct provider-runtime invocation."
    status: verified_true
    evidence: >
      task_audit_llm_binding now builds ExecuteRoleSessionCommandV1 via RoleRuntimeService.
      test_make_audit_llm_caller_prefers_local_ollama asserts the first call carries
      blocked_provider_types, test_make_audit_llm_caller_falls_back_to_role_runtime asserts the
      fallback call is unrestricted, and TestProviderTypePolicy asserts AIExecutor rejects
      disallowed provider types before provider invocation. TestAdapterCallsRuntimeBoundary also
      statically blocks audit and PM production entrypoints from reintroducing direct provider/process LLM calls.

  - id: "A10"
    statement: "Required RoleRuntime paths must hard-gate Cognitive Runtime receipt/handoff evidence."
    status: verified_true
    evidence: >
      RoleRuntimeService now returns metadata.cognitive_runtime_evidence on execute_role_session
      and execute_role_task. test_required_cognitive_runtime_evidence_records_receipt_and_handoff,
      test_required_cognitive_runtime_evidence_fails_closed_when_disabled, and
      test_execute_role_session_returns_cognitive_runtime_evidence_metadata cover success,
      fail-closed OFF mode, and returned metadata.

  - id: "A11"
    statement: "Legacy compatibility wrappers must not re-inject direct provider or stale generation shortcuts."
    status: verified_true
    evidence: >
      loop-pm no longer imports invoke_ollama or monkeypatches PM backend provider functions.
      worker_executor legacy _invoke_ollama and _invoke_generation_response now fail closed locally,
      and worker progress markers include a UTF-8 content hash so stale same-size rewrites are not
      treated as completed generation rounds.

  - id: "A12"
    statement: "Frontend runtime projection compatibility must expose source provenance."
    status: verified_true
    evidence: >
      RuntimeProjectionPayload now carries projection_source/provenance. projectionCompat tests assert
      canonical, empty, partial, merged, legacy_flat, and legacy_nested payloads are labeled explicitly,
      including transformed=true and compatibility_reason for legacy conversions.

  - id: "A13"
    statement: "Context override must isolate control-plane fields from prompt-visible data-plane context."
    status: verified_true
    evidence: >
      RoleContextGateway._process_context_override now drops context_os_snapshot, provider policy,
      runtime-required flags, metadata, session/run identifiers, and internal _transaction_kernel_*
      keys before creating a prompt-visible system message.
      test_process_context_override_drops_control_plane_fields asserts these fields do not appear
      while a safe explicit context key remains visible.

  - id: "A14"
    statement: "Cognitive Runtime MAINLINE must affect the current RoleRuntime turn before LLM invocation."
    status: verified_true
    evidence: >
      RoleRuntimeService._prepare_session_request invokes CognitiveMiddleware in MAINLINE before
      kernel.run, injects sanitized cognitive_guidance into context_override, and records
      metadata.cognitive_runtime_preflight. test_prepare_session_request_applies_cognitive_mainline_guidance
      covers current-turn guidance injection, and test_prepare_session_request_fails_closed_when_cognitive_mainline_blocks
      covers pre-LLM blocking.

  - id: "A15"
    statement: "HTTP role, PM, and role-session streaming must enter RoleRuntimeService directly instead of the dialogue compatibility facade."
    status: verified_true
    evidence: >
      role_runtime_chat.execute_role_chat_streaming builds ExecuteRoleSessionCommandV1(stream=True)
      and maps RoleRuntime stream events into the SSE queue format. role_chat.py, pm_chat.py,
      and role_session.py no longer import generate_role_response_streaming. The focused router
      suite and test_execute_role_chat_streaming_uses_role_runtime verify the migrated path.

  - id: "A16"
    statement: "Prompt assembly must fail closed when chunk/Tri-Axis assembly cannot emit a final request receipt."
    status: verified_true
    evidence: >
      PromptBuilder no longer falls back to legacy string joining or template recursion when
      chunk assembly or RoleComposer recipe resolution fails. test_build_system_prompt_fails_closed_when_chunk_assembly_fails
      asserts the error is surfaced.

  - id: "A17"
    statement: "WorkerExecutor must not mark generated artifacts successful from receipts alone."
    status: verified_true
    evidence: >
      WorkerExecutor now requires generated-file receipts to resolve to real workspace files
      and pass scan_workspace_artifact_quality(relative_paths=...). The focused test
      test_code_generation_rejects_deterministic_scaffold_marker asserts a
      Created by Polaris placeholder fails closed.

  - id: "A18"
    statement: "Director file_creation and bootstrap target backfill must not synthesize deterministic placeholder code."
    status: verified_true
    evidence: >
      _execute_file_creation delegates to _execute_code_generation when concrete target files
      exist and fails closed without CodeGenerationEngine. Bootstrap missing target files now
      call runtime codegen instead of _bootstrap_target_file_content. The tests
      test_execute_file_creation_requires_codegen_without_placeholder and
      test_bootstrap_missing_targets_require_codegen_without_placeholder cover both paths.

  - id: "A19"
    statement: "Director tasking code generation must load from the canonical tasking module."
    status: verified_true
    evidence: >
      polaris.cells.director.tasking.internal.code_generation_engine now contains the implementation.
      polaris.cells.director.execution.internal.code_generation_engine is a compatibility re-export,
      and WorkerExecutor no longer imports or falls back to the execution.internal implementation path.

  - id: "A20"
    statement: "Cognitive Runtime MAINLINE tool denials must affect exposed tool schemas and actual tool execution."
    status: verified_true
    evidence: >
      CognitiveMiddleware preserves CognitiveResponse.blocked_tools, RoleRuntimeService writes them
      to metadata.cognitive_tool_policy and the preflight receipt, and RoleExecutionKernel both filters
      blocked native tool schemas and rejects blocked tool execution before executor dispatch. The
      middleware, runtime strategy, and kernel facade tests cover all three boundaries.

  - id: "A21"
    statement: "The llm.dialogue public role facade must not remain an executable old dialogue path."
    status: verified_true
    evidence: >
      LlmDialogueService.invoke_role_dialogue now builds ExecuteRoleSessionCommandV1 and calls
      RoleRuntimeService.execute_role_session with role_runtime_required, cognitive_runtime_required,
      context_os_expected, and fallback_policy=fail_closed. test_invoke_role_dialogue_uses_role_runtime
      asserts the public facade enters RoleRuntime and emits no legacy_fallback_used metadata.

  - id: "A22"
    statement: "Cognitive Runtime MAINLINE strategy guidance must be applied before stream fingerprints are emitted."
    status: verified_true
    evidence: >
      RoleRuntimeService._apply_cognitive_runtime_preflight now derives metadata.cognitive_strategy_override
      from MAINLINE guidance before stream_chat_turn creates StrategyRunContext. create_strategy_run merges
      that override into StrategyRegistry resolution. test_stream_chat_turn_applies_cognitive_strategy_before_fingerprint
      asserts the first fingerprint event exposes cognitive_strategy_override_applied=True.

  - id: "A23"
    statement: "Cognitive Runtime MAINLINE strategy override must be consumed by ContextGateway before LLM prompt assembly."
    status: verified_true
    evidence: >
      TurnEngineContextRequest now carries strategy_override as control-plane data. ToolLoopController extracts
      metadata.cognitive_strategy_override from RoleRuntime requests, and RoleContextGateway consumes it to expand
      StateFirstContextOS.project(recent_window_messages) and emit budget-pressure telemetry before ProjectionEngine
      builds LLM messages. test_build_context_request_passes_cognitive_strategy_override and
      test_cognitive_strategy_override_expands_context_os_window verify the handoff and actual projection argument.

  - id: "A24"
    statement: "ContextGateway decision hints must reduce the native LLM tool surface in both streaming and non-streaming TransactionKernel paths."
    status: verified_true
    evidence: >
      RoleContextGateway now emits context_decision_hints with budget-pressure and read-only mutation suppression.
      RoleExecutionKernel._apply_runtime_tool_policy consumes those hints after profile whitelist construction and before
      TransactionKernel execution. Non-streaming and streaming transaction paths call the same helper, so Context OS can
      remove expensive read_file and mutating/exec tools without granting any new tools. Facade refactor tests verify the
      resulting schema filtering and safe exceptions for compact_context/update_session_state.

  - id: "A25"
    statement: "The narrowed tool surface must be enforced again at ToolBatchExecutor dispatch time."
    status: verified_true
    evidence: >
      TurnTransactionController and StreamOrchestrator now derive allowed_tool_names from the already-narrowed
      tool_definitions and pass them to ToolBatchExecutor.execute_tool_batch. The executor rejects tool invocations
      outside that set before dispatch. test_execute_turn_passes_narrowed_tool_names_to_direct_batch_executor and
      test_execute_turn_stream_passes_narrowed_tool_names_to_direct_batch_executor verify the non-streaming and
      streaming direct TOOL_BATCH paths.

  - id: "A26"
    statement: "Context OS production code must use structured policy subobjects instead of deprecated compatibility accessors."
    status: verified_true
    evidence: >
      Context OS runtime, pipeline, scheduler, helpers, domain adapter, and RoleRuntime persistence now read
      context_window/window_size/artifact/token_budget/attention_runtime/collection_limits subobjects directly.
      A production scan for deprecated accessor forms under context_os and RoleRuntime persistence returns no matches
      outside the compatibility accessor definitions themselves. The Context OS attention/runtime/policy regression
      suite passes; remaining deprecation warnings are emitted only by compatibility-accessor tests.

  - id: "A27"
    statement: "RoleExecutionKernel must not expose an environment-variable escape hatch back to TurnEngine."
    status: verified_true
    evidence: >
      RoleExecutionKernel.run and run_stream now call TransactionKernel paths directly, and
      RoleExecutionKernel._use_transaction_kernel() is a canonical true boundary rather than an environment flag.
      A production scan of kernel/core.py for LEGACY_FALLBACK, USE_TRANSACTION_KERNEL_PRIMARY, and TurnEngine(
      returns no matches. test_transaction_kernel_cannot_be_disabled_by_removed_env_escape_hatches asserts
      the removed environment variables cannot disable TransactionKernel.

  - id: "A28"
    statement: "ExplorationWorkflowRuntime handoff failures must fail closed instead of being reported as successful handoff."
    status: verified_true
    evidence: >
      HandoffHandler now transitions HANDOFF_WORKFLOW to FAILED when workflow_runtime.execute or execute_stream raises
      or returns a failed/cancelled workflow result. Stream child CompletionEvent is consumed as child status and the
      outer TransactionKernel remains the only completion owner.
      test_transaction_kernel_fails_closed_when_workflow_runtime_fails and
      test_transaction_kernel_fails_closed_when_workflow_runtime_returns_failed_result cover non-streaming paths.
      test_stream_handoff_fails_closed_when_workflow_runtime_fails and
      test_stream_handoff_fails_closed_when_workflow_runtime_returns_failed_completion cover streaming paths.

  - id: "A29"
    statement: "The philosophical Cognitive Lifeform metaphor must not remain in production Python code."
    status: verified_true
    evidence: >
      Production Python docstrings, comments, and CLI text now use cognitive capabilities,
      cognitive pipeline, or cognitive middleware as engineering terms. test_terminology_governance.py
      scans src/backend/polaris production Python files, excluding tests and generated assets, and blocks
      Cognitive Lifeform / Cognitive Life Form / 认知生命体 from returning to code comments or user-facing CLI text.

  - id: "A30"
    statement: "Cognitive Runtime must be active by default and must not be bypassed by the session orchestrator path."
    status: verified_true
    evidence: >
      resolve_cognitive_runtime_mode defaults to MAINLINE, cognitive_runtime_enabled=True maps to MAINLINE,
      and KernelOne flag resolution now only reads canonical KERNELONE_* variables. Legacy POLARIS_* compatibility is
      isolated to polaris._env_compat before kernelone imports. RoleRuntimeService.create_transaction_controller is async
      and calls _prepare_session_request(include_session_snapshot=True), so RoleSessionOrchestrator receives a
      preflighted TransactionKernel request. test_default_is_mainline, test_metadata_enabled_true_maps_to_mainline,
      test_legacy_polaris_env_is_normalized_at_boundary, and
      test_create_transaction_controller_applies_cognitive_mainline_preflight verify these boundaries.

  - id: "A31"
    statement: "Speculative/shadow execution must be active by default while write tools remain fail-closed without a registry-backed prepare shadow."
    status: verified_true
    evidence: >
      is_speculative_execution_enabled defaults to True, TurnTransactionController builds StreamShadowEngine by default,
      and StreamShadowEngine refuses write-tool speculation when no registry-backed prepare shadow is available.
      test_speculative_flag_defaults_enabled, test_stream_controller_builds_shadow_engine_by_default,
      test_stream_controller_speculates_when_flag_enabled, test_stream_controller_no_speculation_when_flag_disabled,
      and test_speculate_write_tool_without_registry_fails_closed verify active-by-default behavior and write safety.

pre_mortem:
