root_cause:
  code: committed_effect_receipt_projection_gap
  evidence: >-
    The physical mutation port produced a hash-bound v2 effect receipt and
    TaskRuntime durably committed it. ToolBatchRuntime then copied the receipt
    into each result row but left BatchReceipt.effect_receipts empty and did
    not project effect_receipt_commit beside the direct receipt. Run Ledger's
    validator correctly rejects an uncommitted direct v2 receipt; the valid
    matching commit survives only inside the nested physical result, so the
    direct incomplete view shadows the complete nested pair and creates a
    false MISSING_EFFECT_RECEIPT verdict.
  repair: >-
    Preserve the receipt and TaskRuntime commit as one canonical result-level
    pair, populate BatchReceipt.effect_receipts from authoritative effects,
    and let historical nested pairs be consumed only when the nested receipt
    exactly matches the direct receipt. Preserve the existing multi-view
    projection semantics without synthesizing or weakening receipt validation.
repair_contract:
  synthesize_receipts: forbidden
  task_runtime_commit_required_for_v2: true
  direct_nested_receipt_mismatch: fail_closed
  missing_or_tampered_commit: fail_closed
  run_ledger_gate_relaxation: forbidden
  target_project_edits: forbidden
verification:
  tdd_red: >-
    Three focused assertions failed before the repair: the historical nested
    commit was shadowed, ToolExecutionResult dropped the commit, and the
