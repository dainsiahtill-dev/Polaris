root_cause:
  code: ce_portfolio_output_budget_and_timeout_cause_lost
  summary: >-
    Factory used the deployment-wide CE structured-output ceiling as the exact
    request budget even for a tiny portfolio. The physical gate correctly kept
    the response private until terminalization, but a 128k-scale request could
    not reliably terminalize inside the conserved 125-second lease. The timeout
    then crossed three projections that replaced or duplicated the causal error.
  fix: >-
    Scale only the Factory CE portfolio request from task count, with a 16384
    token floor, 4096 tokens per task, and the existing deployment cap as the
    hard ceiling. Preserve the original per-task CE structured-output policy.
    Project empty TimeoutError as provider_stream_timeout:<seconds>s, suppress
    the duplicate no-materialization error after a real Provider ErrorEvent,
    and retain the first causal error in roles.runtime.
