bug_summary: >-
  The eleventh authorized fresh isolated L1-04 run proved R14: the qualified
  CE stream was no longer rejected by the conservation buffer and its final
  Provider request audit was readable and complete. The request then exhausted
  the 125-second physical lease without a terminal response. A three-task CE
  portfolio had inherited the global 128000-token structured-output ceiling,
  while the Factory deadline proof reserved only 125 seconds for that physical
  attempt. Empty asyncio.TimeoutError text was projected as a generic provider
  failure, StreamOrchestrator emitted a second generic materialization error,
  and roles.runtime retained the last error, destroying the first causal fact.
