bug_summary: >-
  The nineteenth authorized fresh isolated L1-04 run proved the R22 authority
  reuse and reached the bounded Chief Engineer schema-repair Provider request.
  The primary CE completion was a large malformed portfolio. Factory then
  replayed the entire corrupt completion inside the repair instruction. The
  repair model copied the invalid placeholder and appended partial duplicate
  fragments, so the second completion was also not a valid outer CE portfolio.
  The public bench projection reported task_boundary_verdict_missing, but no
  Director attempt occurred; the authoritative failure remained CE output
  validation. R23 replaces corrupt-byte replay with bounded structured failure
  evidence, preserves only the prior-output digest and character count, and
  requires a fresh concise portfolio reconstructed from the already-attached PM
  contracts, target files, scope paths, and authoritative context.
