root_cause:
  code: ce_schema_repair_corrupt_output_replay
  summary: >-
    The repair objective embedded the complete malformed CE completion. That
    turned failure evidence into competing generation content and encouraged
    continuation/copying of invalid placeholders and truncated JSON fragments.
    The repair request had correct role and authority evidence, but its input
    hygiene made schema recovery unreliable.
  fix: >-
    Never replay malformed output bytes into the schema-repair instruction.
    Project a typed failure_feedback object containing the bounded validation
    detail, prior-output SHA-256, character count, and empty evidence refs;
    reconstruct a fresh portfolio from authoritative PM/target/scope evidence.
    Cap the repair output at 8192 tokens and explicitly prohibit placeholders,
    metavariables, comments, and trailing fragments.
