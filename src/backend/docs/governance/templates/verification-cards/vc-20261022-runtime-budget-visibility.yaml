  - Request-only budget observation can remain outside durable conversation history.
  - Four observed r05 bodies lacked usable remaining-time values; other bodies remain unaudited for H2.
pre_mortem:
  - Reusing an old dynamic status might misstate current remaining time after another turn or cold recovery.
  - Mutating original messages could accumulate stale status or alter tool and image history.
  - A fresh run might still fail verification or independent quality despite visible time.
falsifiers:
  - Current request status differs from the original saved deadline and preparation clock.
  - Scope, provider cap, timeout, retry, acceptance or current-image inputs change.
  - Deadline or terminal occurs without the required current-candidate delivery and resource closure.
verification:
  - Meaningful old-code RED and new-code GREEN using the actual engineering loop and journal
  - Original deadline recovery and unknown-effect refusal remain unchanged
  - Actual native body contains current status without losing tool or visual inputs
  - Relevant engineering regression and scoped style/type checks
  - Required KernelOne release and explicit historical catalog-baseline checks
  - One frozen fresh isolated native webpage run followed by independent ROOT quality review
acceptance: Qualify the bounded mechanism, then report the actual native outcome without claiming H2 causal superiority.
remaining_unknown: Full delivery benefit, best role combination, physical HTTP sends, actual bill and arbitrary workload reliability.
