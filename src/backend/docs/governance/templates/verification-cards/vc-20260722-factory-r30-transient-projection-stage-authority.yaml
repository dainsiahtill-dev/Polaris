card_id: vc-20260722-factory-r30-transient-projection-stage-authority
classification: execution_fact_chain
status: closed
bench_status: schedulable_once
bug_summary: >-
  The single authorized R30 isolated L1-04 run completed PM and Chief Engineer,
  produced three accepted blueprints, and then admitted the first Director
  TaskRuntime child. RunCompletionWaiter immediately returned a transient,
  non-authoritative task_runtime_fact_projection_not_ready diagnostic as if it
  were a canonical terminal result. Factory therefore returned from stage logic
  and closed the stage-bound role-evidence authority while the Director child
  was still active and approaching Provider transport. The child then failed
  before physical dispatch with factory_role_evidence_authority_closed, produced
  no source files, and blocked downstream tasks and QA.
