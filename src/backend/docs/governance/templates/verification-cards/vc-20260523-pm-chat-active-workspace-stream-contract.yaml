pre_mortem:
  - risk: Fixing chat but not status would leave PM LLM readiness bound to the wrong workspace.
    mitigation: Use the resolver in chat, stream, and status.
  - risk: The stream test could assert only HTTP 200 and miss broken SSE frames.
    mitigation: Assert content_chunk and complete event frames.
  - risk: Active workspace tests could pass without checking the generated service call.
    mitigation: Assert the mocked LLM/config calls receive workspace_path.
