card_id: "vc-20260523-role-chat-kernel-events-cache-route-tests"
bug_summary: >
  Generic role chat tests still documented fixed production imports as xfail
  bugs and asserted older verbose status errors, so working PM/Chief
  Engineer/Director diagnostics and readiness endpoints failed when the stale
  tests were selected.

classification: pattern

bug_path:
  file: "src/backend/polaris/tests/unit/delivery/http/routers/test_v2_role_router.py"
  method: "generic role LLM/cache route tests"
  symptom: >
    Tests expected 500 responses and ModuleNotFoundError for routes that now
    return 200 through the shared roles-kernel emitter and cache services; the
    same file expected raw status details in top-level error/message fields.

assumptions:
  - id: "A1"
    statement: "The generic role LLM/cache routes are active runtime contracts."
    status: verified_true
    evidence: >
      role_chat.py exposes /v2/role/{role}/llm-events, /v2/role/llm-events,
      and /v2/role/cache-stats with response models.

  - id: "A2"
    statement: "The previous import bug has already been fixed in production code."
    status: verified_true
    evidence: >
      role_chat.py imports get_global_emitter and get_global_llm_cache from
      polaris.cells.roles.kernel.public.service, and focused tests returned
      200 OK before this baseline update.

  - id: "A3"
    statement: "The PM, Chief Engineer, and Director desktops depend on these generic diagnostics as fallback evidence."
    status: verified_true
    evidence: >
      The frontend role workspaces read role-scoped LLM evidence and backend
      diagnostics through shared role-kernel contracts.

pre_mortem:
  likely_wrong_fix: >
    Keeping the xfail markers would preserve false production-bug
    documentation and hide regressions in shared diagnostic routes.
  guardrail: >
    Replace xfail tests with positive route assertions that patch the shared
    emitter/cache and verify route filters and response payloads; align status
    assertions with sanitized top-level errors and structured diagnostics.

