bug_summary: >-
  R26 proved R25 and preserved readable, role-correct PM and Chief Engineer
  final-request evidence. Both physical Kimi Chief Engineer requests nevertheless
  advertised response_format=null and mandatory thinking without a bounded
  reasoning budget. The primary consumed its exact 16384 completion-token cap
  before its fenced JSON object completed; the separately claimed schema repair
  consumed its exact 8192-token cap and exposed only 641 visible characters.
  Factory correctly rejected both malformed outputs, so Director and QA were not
  reached. The fix carries a call-scoped reasoning budget from Factory through
  Role Kernel and KernelOne Engine into the exact Anthropic-compatible provider
  request, and makes streamed JSON audit truthfully report text_json_fallback.
