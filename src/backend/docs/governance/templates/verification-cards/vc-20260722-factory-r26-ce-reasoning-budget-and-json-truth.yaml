root_cause:
  code: ce_reasoning_budget_not_projected_to_physical_request
  summary: >-
    Factory declared a structured Chief Engineer output contract, but no
    call-scoped reasoning budget survived request preparation, Engine option
    merging, and native Anthropic request projection. Kimi's required thinking
    therefore competed without a bounded reservation against the same completion
    budget needed for visible JSON. The stream audit compounded the diagnosis by
    labeling a text JSON fallback contract as plain_text.
  fix: >-
    Factory assigns 4096 reasoning tokens to the primary portfolio and 2048 to
    schema repair. Role Kernel validates that the budget is an integer at least
    1024 and strictly below max_tokens, projects it into request options and the
    final context audit, and reports streamed explicit JSON as text_json_fallback.
    KernelOne Engine propagates the option through invoke and stream paths.
    Anthropic-compatible native and direct-provider projections add budget_tokens
    only when thinking is already enabled or required; standard Anthropic routes
    are not forced into thinking.
