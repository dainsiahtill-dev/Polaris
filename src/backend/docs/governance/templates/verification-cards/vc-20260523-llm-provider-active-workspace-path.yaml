card_id: "vc-20260523-llm-provider-active-workspace-path"
bug_summary: >
  LLM config/runtime and provider action routes can resolve KernelOne cache and
  config paths from stale settings.workspace instead of the active Electron
  workspace_path used by PM, Chief Engineer, and Director desktop surfaces.

classification: pattern

bug_path:
  file: "polaris/delivery/http/routers/llm.py and polaris/delivery/http/routers/providers.py"
  method: "LLM config/runtime-status and provider health/models"
  symptom: >
    Desktop role workspaces can display, save, test, or inspect LLM state for
    the Polaris repo while the UI is operating on a selected target workspace.

assumptions:
  - id: "A1"
    statement: "Desktop PM/Chief Engineer/Director LLM surfaces use these v2 LLM/provider routes."
    status: verified_true
    evidence: >
      Existing desktop role workspace smoke coverage exercises role surfaces,
      and the LLM/provider routes are the canonical backend APIs for config,
      runtime status, provider health, and model listing.

  - id: "A2"
    statement: "settings.workspace_path is the active Electron target workspace when populated."
    status: verified_true
    evidence: >
      Existing PM, Chief Engineer, RoleChat, RoleSession, readiness, and
      runtime active-workspace contracts now prefer workspace_path over
      workspace.

pre_mortem:
  likely_wrong_fix: >
    Updating only readiness or runtime status would still leave provider health
    and model listing resolving provider config from the stale repo workspace.
  guardrail: >
    Reuse the shared delivery active_workspace_value helper and assert
    build_cache_root, load/save config, resolve_artifact_path, and
    resolve_provider_request_context receive workspace_path first.

