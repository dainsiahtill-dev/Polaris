pre_mortem:
  - risk: The diagnostics modal could call health while PM is uninitialized and show a noisy 400.
    mitigation: Load health only after PM management status reports initialized=true.
  - risk: Initialization could happen without visible audit evidence.
    mitigation: Render explicit `POST /pm/v2/pm/init` evidence and reload status after success.
  - risk: The new management route could be confused with the process status route.
    mitigation: Name service wrappers `getPmManagement*` and show the `/pm/v2/pm/*` endpoint in UI.
