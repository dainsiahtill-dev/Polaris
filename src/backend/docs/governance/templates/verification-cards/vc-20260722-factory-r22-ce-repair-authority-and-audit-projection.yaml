root_cause:
  code: ce_schema_repair_duplicate_stage_grant_and_partial_audit_rebind
  summary: >-
    The schema repair correctly used an independent TaskRuntime task, claim,
    session, request freeze, and physical-attempt admission, but it incorrectly
    equated that execution isolation with a second stage-level CE evidence
    authority. Separately, final-request audit rebinding changed only the
    headline ref lists and pass bit, leaving subordinate evidence projections
    derived from the pre-authority heuristic inventory.
  fix: >-
    Mint exactly one CE stage grant and reuse its typed authority binding for
    both the primary request and the one bounded schema-repair child. Preserve
    independent TaskRuntime and final-request identities; do not raise the CE
    grant cap. When the Factory cutoff becomes authoritative, rebuild coverage
    sources and evidence slots from its typed policy facts, recompute the ratio,
    and remove or rebuild only superseded evidence findings in context_quality.
