bug_summary: >-
  The eighteenth authorized fresh isolated L1-04 run reached one real Chief
  Engineer physical Provider request. The Provider returned a semantically
  rich but malformed JSON portfolio, so R21 correctly admitted its single
  bounded schema-repair child. The child then failed before Provider transport:
  it attempted to mint a second Chief Engineer role-evidence grant although the
  constitutional stage policy permits exactly one CE grant. The public bench
  projection consequently reported task_boundary_verdict_missing, but no
  Director attempt had occurred; the authoritative failure was
  factory_role_evidence_stage_grant_cardinality_exceeded. The same run also
  exposed an audit-projection inconsistency: Factory cutoff facts correctly
  replaced heuristic required/included/missing refs, while coverage_sources,
  evidence_slots, coverage_ratio, and context_quality retained the superseded
  heuristic verdict.
