card_id: vc-20260722-factory-r28-provider-stream-terminal-stall
classification: execution_fact_chain
status: closed
bench_status: unblocked
bug_summary: >-
  During R27 the separately claimed Chief Engineer schema-repair request obtained
  HTTP 200 and entered physical streaming, then the provider socket reached
  CLOSE-WAIT while Factory never appended a terminal provider-attempt fact. The
  backend remained CPU-saturated and the chain stayed in chief_engineer_review
  until the authorized instance was stopped. Because an independently proven
  stale cross-instance WebSocket was concurrently loading the same event loop,
  R27 could not distinguish provider-stream EOF handling from starvation. R28
  reproduced the missing terminal deterministically: physical stream consumption
  completed, but an async response/session context whose __aexit__ never returned
  was awaited without any bound, so neither the durable terminal fact nor the
  in-flight release could occur. The gate now bounds cleanup, cancels the stuck
  cleanup task, emits provider_stream_cleanup_timeout as one failed terminal,
  leaks zero buffered output, and never retries that non-network failure.
