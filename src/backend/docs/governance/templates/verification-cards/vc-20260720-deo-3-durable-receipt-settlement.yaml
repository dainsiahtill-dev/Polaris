card_id: vc-20260720-deo-3-durable-receipt-settlement
bug_summary: >-
  Canonical physical effects stop at EFFECT_STARTED with only a non-durable
  acknowledgement; terminal settlement has no durable receipt, finite recovery,
  outcome-bound parent close, or crash-replay chain.
classification: structural
status: closed
bench_status: not_schedulable
bug_path:
  files:
    - polaris/cells/runtime/task_runtime/public/contracts.py
    - polaris/cells/runtime/task_runtime/internal/directed_effect_operation.py
    - polaris/cells/runtime/task_runtime/internal/execution_session.py
    - polaris/cells/runtime/task_runtime/internal/service.py
    - polaris/cells/roles/adapters/internal/director/directed_effect_mutation_port.py
    - polaris/cells/control_plane/run_ledger/public/tool_lifecycle.py
  symptom: >-
    A physical mutation can complete without a TaskRuntime receipt commit, while
    settlement can only block on an OPEN parent and cannot recoverably close it.
assumptions:
  - id: A1
    statement: Guarded single-target FactStream CAS can linearize receipt/child and parent-close operations.
    status: verified_true
  - id: A2
    statement: TaskRuntime session locks can persist one terminal intent before parent close.
    status: verified_true
  - id: A3
    statement: Run Ledger remains a read-only projection and cannot authorize settlement.
    status: verified_true
pre_mortem:
  failure_point: >-
    Treating missing receipt as no effect could duplicate a mutation; closing a
    parent without binding the requested outcome could terminalize the wrong result.
  risk_zone:
    - physical effect to receipt commit crash window
    - receipt/recovery exact replay
    - child transition versus parent close race
    - heartbeat/reclaim versus pending terminal intent
    - missing versus failed Run Ledger evidence
verification_plan:
  unit_tests:
    - strict receipt/recovery/dead-letter contracts and reducer
    - physical receipt commit before adapter success
    - pending terminal intent exact replay and conflict
    - outcome-bound child and parent close
    - crash and cancellation matrix
    - heartbeat and reclaim terminal fence
    - Run Ledger missing versus failed evidence
  static_gates:
    - TaskRuntime-only DEO fact writers
    - no standalone public parent-close command
    - Run Ledger read-only dependency direction
    - Ruff, format, mypy, compileall, YAML, catalog, and diff
