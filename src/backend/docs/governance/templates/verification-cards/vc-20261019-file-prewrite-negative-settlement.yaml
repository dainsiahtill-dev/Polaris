owner: runtime.task_runtime
problem: File prewrite failures were consumed as command failures, and native argument hashes were compared to normalized arguments.
assumptions:
  - A generic failed result, DEAD_LETTER state, error text or unchanged current bytes cannot establish NoEffect.
  - The actual frozen KernelOne prewrite rejection is produced before writing and carries independently computed actual argument and file hashes.
  - Native envelope hashes, normalized argument hashes and prospective operation context hashes are separate namespaces.
  - Resource closure and delivery acceptance remain separate outcomes.
design:
  - Consume the exact KernelOne type only after the bound one-use fence, then validate target, prepared baseline, actual input and context bindings.
  - Persist serialized proof in existing immutable role outcomes and existing recovery and resolution evidence digests.
  - Restore only inside the strict TaskRuntime operation, inventory, parent and terminal owner chain.
  - Validate native_arguments against the native envelope and replay normalization from the retained ToolSpec snapshot.
  - Recompute normalized operation identity against the admitted member; never recapture historical ToolSpecs.
  - Keep positive process exit codes exclusive to process failures and permit no fabricated file exit code.
  - Keep generic file errors, partial I/O, exceptions and unproven no-op assertions in recovery with UNKNOWN closure.
  - Count independently proven terminal negatives separately from reads and positive mutation receipts.
  - A completed owner may retain a fully validated typed file rejection before a later legal mutation; legacy process failures retain failed-owner requirements.
