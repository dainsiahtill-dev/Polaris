  - A JSON dictionary resembling the proof type cannot obtain live producer authority.
  - Historical R04 has no trusted typed prewrite proof and must retain UNKNOWN.
  - NoEffect does not grant writes, count as a mutation, qualify QA or turn failed delivery into success.
