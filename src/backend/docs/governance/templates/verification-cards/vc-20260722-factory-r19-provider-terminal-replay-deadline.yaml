root_cause:
  code: provider_deadline_spanned_terminal_replay_backpressure
  summary: >-
    FinalProviderAttemptGate consumes and buffers the complete physical stream,
    closes the response, and appends the durable Provider terminal fact before
    yielding buffered items outward. invoke_stream_with_retry wrapped that
    outward async iteration in asyncio.timeout. The timeout context therefore
    survived across generator yields and cancelled the downstream role task
    during replay, after the physical Provider attempt had already completed.
  fix: >-
    Apply the shared absolute deadline only while awaiting each physical
    response or custom-handler item inside the gate's consume callback. Never
    keep a Provider timeout context armed across outward yields. A real physical
    response timeout now terminalizes the attempt as failed and releases its
    reservation; caller cancellation remains cancelled. Retry backoff and wire
    attempts still share the same absolute budget, and R18's no-reconnect rule
    remains intact.
