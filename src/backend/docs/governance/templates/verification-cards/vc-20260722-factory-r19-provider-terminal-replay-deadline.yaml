card_id: vc-20260722-factory-r19-provider-terminal-replay-deadline
classification: execution_fact_chain
status: closed
bench_status: unblocked
bug_summary: >-
  The fifteenth authorized fresh isolated L1-04 run proved R18 suppressed the
  duplicate Provider retry: exactly one Chief Engineer physical attempt ran
  and durably terminalized completed after about 168 seconds. Factory then
  replayed the completed buffered stream to the role runtime, but the Provider
  helper's asyncio.timeout context remained armed across its outward yield.
  Slow post-terminal replay/backpressure therefore cancelled the CE consumer
  task about 23 seconds after the Provider terminal fact, suspending
  TaskRuntime even though the physical attempt and Factory workspace lease
  were both healthy.
