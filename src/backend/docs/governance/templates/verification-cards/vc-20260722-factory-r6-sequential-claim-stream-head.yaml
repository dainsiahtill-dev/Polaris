root_cause:
  code: sequential_claim_uses_stale_admission_head
  evidence: >-
    claim_execution_context computed every claim CAS from the immutable
    inventory-admission head plus member index. That formula accounts for one
    claim event per preceding member but not for receipt, abort, or recovery
    transitions appended by those members to the same operation stream. After
    the first operation committed its receipt at sequence 7, the second claim
    retried sequence 7 instead of claiming sequence 8 and failed closed.
  repair: >-
    Before each claim or unused-member abort, strictly rebuild the target operation through the
    public TaskRuntime read port, require the exact admitted identity, state,
    and version, derive expected_seq from the returned current stream head,
    then retain the claim command CAS as the authoritative race guard.
