card_id: "vc-20260523-http-active-workspace-canonical-resolver"
bug_summary: >
  PM, Chief Engineer, Director, RoleChat, and RoleSession HTTP surfaces can
  resolve the active Electron workspace differently, leaving some endpoints to
  read stale LLM readiness evidence or mock placeholder paths.

classification: pattern

bug_path:
  file: "polaris/delivery/http/workspace.py and role HTTP routers"
  method: "active_workspace_value / local _workspace_value helpers"
  symptom: >
    A workspace that already passed PM LLM tests can still appear PM-blocked
    because config and readiness indexes are read from different workspaces.

assumptions:
  - id: "A1"
    statement: "Electron stores the active target workspace on settings.workspace_path when populated."
    status: verified_true
    evidence: >
      Existing PM chat, Chief Engineer, Director, RoleChat, and RoleSession
      regressions all expect workspace_path to override workspace.

  - id: "A2"
    statement: "Tests may pass MagicMock settings where unset attributes should not become paths."
    status: verified_true
    evidence: >
      Prior regressions in llm_status and HTTP route tests use MagicMock
      settings objects; stringifying an unset attribute creates a fake path.

pre_mortem:
  likely_wrong_fix: >
    Updating only one router leaves RoleChat status, RoleSession, or shared
    role readiness gates using stale workspace data.
  guardrail: >
    Move all delivery workspace resolution through polaris.delivery.http.workspace
    and assert the LLM test index is loaded with the same active workspace as
    the LLM config.

