root_cause:
  code: kernel_stream_legacy_timeout_rejected_governed_terminal_replay
  summary: >-
    StreamExecutor started a local wall clock before invoking the Provider and
    checked it only after each upstream event arrived. Factory governance
    consumes the complete physical response and durably terminalizes the
    attempt before replaying buffered events through this executor. A response
    lasting about 300 seconds therefore arrived as already-completed evidence,
    but the executor rejected its first replay event because local elapsed time
    exceeded 300 seconds. The untyped error remained retryable and created a
    duplicate physical request.
  fix: >-
    Transfer timeout ownership only when the bound sidecar exposes both the
    physical stream dispatch capability and the Factory provider-route
    authority binder. Such qualified Factory streams retain their physical
    deadline in the dispatch gate/provider helper and skip only the legacy
    executor wall-clock check during terminal replay. Ungoverned streams and
    arbitrary non-null sidecars retain the historical timeout fail-closed.
