bug_summary: >-
  The sixteenth authorized fresh isolated L1-04 run proved R19: the Chief
  Engineer stream crossed the former post-terminal cancellation window without
  cancellation or TaskRuntime suspension. It then exposed a second deadline
  projection in KernelOne StreamExecutor. Factory had already qualified,
  consumed, and terminalized the physical Provider stream, but the executor
  compared buffered replay against its own 300-second wall clock. It rejected
  the first replayed event as Stream overall timeout after 300.0s and the role
  retry layer issued a second physical Provider request for the same logical
  Chief Engineer call.
