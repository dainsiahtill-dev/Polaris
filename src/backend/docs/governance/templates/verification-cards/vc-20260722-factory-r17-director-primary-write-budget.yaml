root_cause:
  code: director_primary_write_budget_deadline_mismatch
  summary: >-
    KernelOne already defines a 7000-token ceiling for forced-write and
    first-call materialization requests, but the Director adapter applied that
    policy only to explicit retry stages. The primary first_call carried a
    write_code execution profile, target files, and the director.patch_file.v1
    output contract, yet inherited the generic 128000-token execution budget.
    Factory deadline re-clamping worked; request size and remaining physical
    lease did not match.
  fix: >-
    Treat a primary first_call as a bounded materialization call only when it
    has declared target files and an authoritative write_code execution
    profile or director.patch_file.v1 output contract. Reuse the existing
    central forced-write output ceiling and preserve existing retry behavior.
    Review-class first calls remain uncapped by this rule. The final provider
    boundary now records the applied output-budget evidence before transport.
