bug_summary: >-
  The thirteenth authorized fresh isolated L1-04 run proved the complete PM
  and Chief Engineer physical path, accepted three blueprints, and entered
  Director. Director then sent a primary write-code request with the generic
  128000-token execution budget while only about 46 seconds remained on the
  Factory execution deadline. Polaris cancelled the still-active Provider
  request after about 42 seconds, materialized no source file, failed the first
  Director task, and dependency-blocked the remaining two tasks.
