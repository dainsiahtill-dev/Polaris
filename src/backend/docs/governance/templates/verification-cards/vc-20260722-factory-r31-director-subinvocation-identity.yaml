bug_summary: >-
  The single authorized R31 isolated L1-04 run completed PM and Chief Engineer,
  reached Director, wrote five files, and compiled four Go sources. A subsequent
  semantic materialization-quality repair then reused the main Director call's
  TaskRuntime execution scope and fresh local transaction attempt zero. Both
  calls therefore derived the same TransactionKernel invocation/attempt outcome
  key despite carrying different terminal payloads. FactStream correctly
  rejected the repair commit as an idempotency conflict, Task 1 failed, Tasks 2
  and 3 were dependency-blocked, and QA was never reached.
