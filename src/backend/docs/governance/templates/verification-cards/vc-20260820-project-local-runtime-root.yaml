card_id: "vc-20260820-project-local-runtime-root"
bug_summary: >
  Default runtime state is split between target .polaris, workspace/runtime launch claims,
  and an external system-cache namespace, so runtime identity and evidence disagree.

classification: structural

bug_path:
  file: "polaris/kernelone/storage/layout.py"
  method: "_runtime_base_and_mode"
  symptom: "A project-local backend argument is rejected and silently resolved to system cache."

assumptions:
  - id: "A1"
    statement: "Runtime belongs to the target project by default."
    status: verified
    evidence: "Storage graph owns runtime/* and project metadata is already rooted at <workspace>/.polaris."
  - id: "A2"
    statement: "Launcher and Bench currently claim <workspace>/runtime."
    status: verified
    evidence: "Instance service and factory_bench session construct workspace/runtime directly."
  - id: "A3"
    statement: "The resolver rejects paths inside workspace and falls through to system cache."
    status: verified
    evidence: "_runtime_base_and_mode requires explicit root to be outside workspace, then defaults to default_kernelone_cache_base()."
  - id: "A4"
    statement: "Explicit external roots remain a valid deployment option."
    status: verified
    evidence: "Existing shared-cache and RAM-disk tests require workspace-key isolation."
  - id: "A5"
    statement: "Migration must not copy or dual-write live runtime state."
    status: verified
    evidence: "Runtime is mutable KFS-owned state with lock identity and append-only event evidence."
  - id: "A6"
    statement: "A stale Launcher can pass an old external runtime to a child even after the source migration."
    status: verified
    evidence: "Live PID 85203 was spawned with ~/.cache/kernelone/.../runtime while its persisted launch receipt claimed <workspace>/runtime; main PID 16333 reported stale_since_startup=true."
  - id: "A7"
    statement: "Correct child CLI arguments do not by themselves prevent inherited Launcher authority."
    status: verified
    evidence: "Live PID 64914 command line named the target .polaris/runtime while /proc/64914/environ still named the main repository workspace/runtime."

pre_mortem:
  failure_point: >
    Treating a project-local runtime as an external base can append projects/<key>/runtime again;
    treating every in-workspace path as valid can authorize arbitrary runtime locations.
  risk_zone:
    - "polaris/kernelone/storage/layout.py"
    - "polaris/cells/storage/layout/internal/layout_business.py"
    - "polaris/cells/instances/internal/service.py"
    - "scripts/factory_bench/_bench_lib/session.py"

verification_plan:
  unit_tests:
    - file: "polaris/kernelone/storage/tests/test_storage_layout.py"
      description: "Default local root, explicit external root, direct local root, read-only fallback."
      expected: "One authoritative runtime path per write-capable resolution."
      status: new
    - file: "polaris/cells/storage/layout/tests/test_storage_layout_cell.py"
      description: "Public storage contract returns target .polaris/runtime by default."
      expected: "Public result and KernelOne root agree."
      status: new
    - file: "polaris/cells/instances/tests/test_instance_service.py"
      description: "New records, stale local claims, and child Popen environment converge to target .polaris/runtime."
      expected: "Registry, launch argument, and pre-import child environment agree."
      status: new
    - file: "polaris/cells/control_plane/run_ledger/tests/test_project_local_runtime_root.py"
      description: "New ledger writes use canonical runtime while legacy bare-runtime ledgers remain read-only discoverable."
      expected: "No new writer creates <workspace>/runtime."
      status: passed
    - file: "polaris/delivery/cli/tests/test_backend_runtime_root.py"
      description: "Backend independently normalizes legacy workspace-root claims while preserving explicit external opt-in."
      expected: "A stale parent cannot force a split runtime identity into a fresh child."
      status: new
    - file: "scripts/factory_bench/test_run_factory_bench.py"
      description: "Isolated launch receipt uses target .polaris/runtime."
      expected: "Bench does not invent workspace/runtime."
      status: new
  integration_tests:
    - description: "Launch a fresh isolated instance and compare registry, process and storage layout."
      command: "python src/backend/scripts/factory_bench/run_factory_bench.py --project-ids L3-21 --launcher-instance-mode isolated --bench-session-reporting off"
      status: passed
  manual_check:
    - "No writer creates <workspace>/runtime for a new project."
    - "Legacy external runtime remains read-only discoverable."

related_adrs:
  - "ADR-0109"

sign_off:
