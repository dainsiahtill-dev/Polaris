card_id: "vc-20260523-pm-task-detail-backend-hydration"
bug_summary: >
  PM desktop task detail drill-down rendered selected runtime/list/search rows
  but did not hydrate full task contracts from /v2/pm/tasks/{task_id}.

classification: pattern

bug_path:
  file: "src/frontend/src/app/components/pm/PMTaskPanel.tsx"
  method: "selected task detail projection"
  symptom: >
    A selected PM task could show only a summarized projection even when the PM
    management backend had a richer registry detail payload.

assumptions:
  - id: "A1"
    statement: "The backend already exposes a single PM task detail route."
    status: verified_true
    evidence: >
      pm_management.py exposes /v2/pm/tasks/{task_id}; pmService already has
      getPmTask(taskId) from the prior service contract slice.

  - id: "A2"
    statement: "The current PM task panel only hydrates backend rows through search."
    status: verified_true
    evidence: >
      PMTaskPanel imports searchPmTasks and normalizes selected search results,
      but no selected-task useEffect calls getPmTask.

  - id: "A3"
    statement: "Hydration failure must not blank the existing selected task detail."
    status: verified_true
    evidence: >
      PMTaskPanel already has local task projections; the fix must preserve that
      projection and render backend error evidence separately.

pre_mortem:
  likely_wrong_fix: >
    Replacing the selected task with backend detail before the request resolves
    would make the detail panel flicker or disappear on backend errors.
  guardrail: >
    Keep the selected local/search projection visible and merge backend detail
    only after a successful response.

