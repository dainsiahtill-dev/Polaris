id: vc-20261001-verification-group-isolation
classification: structural
owner: factory.pipeline
status: task_one_interface_confirmed_implementation_in_progress
blueprint: ../../../blueprints/POLARIS_VERIFICATION_GROUP_ISOLATION_20261001.md
assumptions:
  - claim: source-file rollback restores complete verification state.
    evidence: False; real rejected tsc candidate left JS/declaration/map outputs.
  - claim: current broker sandbox prevents derived-output pollution.
    evidence: False; live workspace RW bind remains; explicit inputs alone are RO overlays.
  - claim: existing Cargo copy sandbox is reusable mechanism.
    evidence: source read and bwrap binary present; group/toolchain integration still requires tests.
  - claim: current artifact receipt queries survive a failed repair epoch.
    evidence: False; live read-only CE query passes but six TASK1 current receipt queries return None.
pre_mortem:
  - Unknown emitted JS included as fresh source.
  - Copy-per-command discards build output needed by tests.
  - Cancellation disposes copy while descendants survive.
  - Clone pass promoted without matching live candidate source hash.
verification:
  - Real failed compiler emits only inside isolated group.
  - Source authority and path/hash correspondence; drift/root/symlink negative.
  - Shared build/test/start outputs; new candidate clean group.
  - Process-tree timeout/cancel/drain before disposal.
  - Failure receipts remain failed not missing; no fake seals or target cleanup.
  - Historical source baseline is authenticated, byte-current and readonly; current receipt remains invalidated after epoch changes.
  - Missing database/key are not created by a baseline query.
  - Native DEO empty map/sequence kinds survive result projection and retain exact physical hash.
implementation_bucket:
  - focused_internal_native_validation_group
  - owner_tests
constraints:
  - no_Cargo_rewrite
  - input_hashes_are_read_constraints_not_authority
  - observational_drained_bool_never_authorizes_disposal
  - no_temp_finalizer_cleanup_before_physical_terminal_proof
