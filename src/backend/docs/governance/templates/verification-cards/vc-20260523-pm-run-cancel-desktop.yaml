pre_mortem:
  - risk: Runtime could reject cancellation for settled runs.
    mitigation: Route checks terminal status before calling cancel_run.
  - risk: PM cancel response could use a different stage derivation than PM run detail.
    mitigation: Share response construction between get and cancel routes.
  - risk: Run ID encoding could break cancellation links.
    mitigation: Service wrapper encodes run IDs with encodeURIComponent.
