      - src/frontend/src/types/task.ts
    verified: true
pre_mortem:
  - risk: Showing all role workspaces at once would preserve the same clutter under a new skin.
    mitigation: Render one focused role layer at a time and keep all role states visible in the role rail.
  - risk: Adding a Chief Engineer layer could invent backend state that is not present.
    mitigation: Only derive CE state from Factory roles and existing PM task blueprint fields.
  - risk: The floating LLM runtime overlay could still cover the redesigned operations rail.
    mitigation: Add compact Factory overlay behavior and suppress auto-expand in Factory mode.
