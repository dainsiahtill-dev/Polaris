pre_mortem:
- Isolated Python cannot import KFS, so use only public canonical runtime-source API; never expand backend read mounts or copy guard logic.
- Runtime-source includes dormant writes; preserve read-only invocation and OS sandbox rather than treating code as authority.
- URL decoding or symlink handling leaks beyond the declared root or exposes .polaris secrets.
- A virtual origin inadvertently permits real network, service workers or non-read effects.
- The schema producer is updated but normalization, JSON reconstruction or persisted consumers lose web_root.
- Revisit becomes a falsely fresh capture or resource budgets evade original process cancellation/drain.
- A synthetic marker or new source qualification is mislabeled successful native delivery.
falsifiers:
- ESM/style marker still fails under the real contained production capture path.
- Empty/revoked/outside scope gains reads or actual networking.
- Old file/revisit/cancel paths regress.
- Fresh native still cannot reach effective current QA; preserve the result without claiming convergence.
verification:
- Real cold-revisit alias counterexample: normalize saved raw arguments before current scope checks without rewriting facts or refreshing pixels
- Baseline RED then real-browser static ESM/CSS/root GREEN and authority negatives
- ToolSpec JSON/native schema and normalized persisted service/cold consumer path
- Related browser/visual/verification/QA/recovery regressions, scoped style and type
- Independent review, architecture, KernelOne ALL and unchanged-debt catalog incremental
- Fresh frozen original L1-01 native result, ROOT personal quality and resource closure
acceptance: Stop module research after finite scoped counterexamples and adjacent paths pass; integrate and measure fresh native separately.
