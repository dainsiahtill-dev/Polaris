assumptions:
- Native v7 613 demonstrates file-origin ESM/CSS failure; synthetic classic controls isolate root-path resolution.
- A KFS-backed static origin can execute ordinary Web assets without new real-network authority; this must be experimentally proved.
- Avoiding preview regeneration may remove one delivery-loop trigger, but native convergence benefit remains unknown.
