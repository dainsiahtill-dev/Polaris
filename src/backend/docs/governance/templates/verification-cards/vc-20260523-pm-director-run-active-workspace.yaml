card_id: "vc-20260523-pm-director-run-active-workspace"
bug_summary: >
  PM and Director run orchestration routes default workspace to "." and can
  bypass the active Electron workspace_path when a caller omits workspace or
  forwards the request model default.

classification: pattern

bug_path:
  file: "polaris/delivery/http/v2/pm.py and polaris/delivery/http/v2/director.py"
  method: "pm_run_orchestration / director_run_orchestration"
  symptom: >
    Desktop run requests without a concrete workspace can execute PM or
    Director orchestration against the backend process working directory rather
    than the selected target workspace.

assumptions:
  - id: "A1"
    statement: "settings.workspace_path is the active Electron selected workspace when populated."
    status: verified_true
    evidence: >
      Existing active-workspace contracts for PM diagnostics, Chief Engineer,
      role sessions, runtime, LLM/provider routes, and Director projections use
      workspace_path before workspace.

  - id: "A2"
    statement: "PM and Director run request models still default workspace to '.'."
    status: verified_true
    evidence: >
      PMRunOrchestrationRequest.workspace and DirectorRunOrchestrationRequest.workspace
      use Field(default='.') before this fix.

  - id: "A3"
    statement: "Explicit API workspace paths must remain supported."
    status: verified_true
    evidence: >
      Existing router tests post concrete workspace fields through the run
      endpoints; the contract only treats blank or dot values as active-workspace
      fallback requests.

pre_mortem:
  likely_wrong_fix: >
    Replacing every payload workspace with settings.workspace_path would break
    explicit API callers that intentionally target another workspace.
  guardrail: >
    Centralize a requested-or-active resolver and test both default dot fallback
    and explicit non-dot preservation through PM and Director run routes.

