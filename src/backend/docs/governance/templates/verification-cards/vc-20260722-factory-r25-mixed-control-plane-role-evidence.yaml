bug_summary: >-
  The twenty-first authorized fresh isolated L1-04 run proved R24 and reached a
  real Director Provider request. Director materialized go.mod plus four Go
  source files, but Factory rejected the role result with
  factory_role_evidence_dynamic_envelope_invalid. The canonical
  execution.control_plane stream contained a valid tool_call_lifecycle fact,
  a valid task_boundary_verdict fact, and a valid gate_evaluated fact. The
  role-evidence source resolver incorrectly required every record in that
  heterogeneous control-plane stream to be gate_evaluated.
