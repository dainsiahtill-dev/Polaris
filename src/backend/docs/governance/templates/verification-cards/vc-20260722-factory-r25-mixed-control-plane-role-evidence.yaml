root_cause:
  code: factory_role_evidence_assumes_gate_only_control_plane_stream
  summary: >-
    _capture_dynamic_slots intentionally queried the full canonical
    execution.control_plane stream so sequence, digest, and physical source
    head could be audited. _validated_dynamic_event nevertheless rejected any
    envelope whose event_type was not gate_evaluated. Canonical Run Ledger
    producers write multiple event kinds to this same stream, so the first
    successful Director tool lifecycle receipt deterministically poisoned the
    later role-evidence cutoff.
  fix: >-
    Strictly validate every control-plane record for envelope stream, payload
    schema, outer/nested event-type identity, run identity, Run Ledger content
    identity, integrity digest, sequence continuity, size limit, and physical
    stream head. Apply Job Token and Factory-run binding only to
    gate_evaluated facts, and project only those gate facts into
    failure_feedback, workspace_quality, and verifier_receipts slots. Valid
    lifecycle and TaskBoundary facts remain part of the audited stream cut but
    cannot masquerade as gate evidence.
