  - R182 deo_physical_execution_failed attribution clarity

risks:
  - spans M03 + M08; M08 forbidden in m03-r16 attribution
  - active WIP conflict in tool_batch_executor / directed_effect_policy_snapshot
  - model ceiling: L1-01 COMPLETED_VERIFIED also requires building TS (r16 TS1110); control-plane fix alone insufficient
  - bench_gates must remain measure-only; do not mask the failure

stop_conditions_for_further_rounds:
