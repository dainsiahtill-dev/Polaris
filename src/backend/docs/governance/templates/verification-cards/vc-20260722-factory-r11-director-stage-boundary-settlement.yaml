required_invariants:
  - unused admitted Director execution budget is consumed before settlement reserve
  - no new Director round starts while a previous child remains active
  - Factory stage authority is not closed while an admitted child is still executing
  - terminal TaskRuntime or cancellation settlement is required before stage return
  - no detached authority or background child may cross the Factory stage boundary
