bug_summary: >-
  Fresh isolated L1-04 acceptance run 7 reached Director but Factory consumed
  only the five-second settlement reserve after an early inflight lifecycle
  result. Factory then returned from director_dispatch and closed the live
  role-evidence authority while the TaskRuntime child was still active. The
  child consequently failed before Provider transport with
  factory_role_evidence_authority_closed.
