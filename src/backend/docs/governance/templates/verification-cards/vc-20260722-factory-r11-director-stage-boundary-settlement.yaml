fix:
  - propagate one absolute Factory Director execution deadline into the admitted task metadata
  - clamp Director timeout at execution start and again at the role-dialogue boundary
  - recompute the final request timeout after ContextOS projection and before AIRequest freeze
  - reject sub-second or expired deadline remainder before any physical Provider request
  - wait the unused execution lease plus settlement reserve before closing stage authority
