card_id: "vc-20260523-role-chat-registered-role-contract"
bug_summary: >
  The V2 role-chat UI and hooks accepted unsupported role values, including
  Scout, while the backend role-chat router only registers PM, Architect, Chief
  Engineer, Director, and QA prompt templates.

classification: pattern

bug_path:
  file: "src/frontend/src/app/components/v2/RoleChatPanel.tsx"
  method: "AVAILABLE_ROLES"
  symptom: >
    The role selector exposed Scout even though /v2/role/{role}/chat validates
    against llm.dialogue registered prompt templates and would reject Scout.

assumptions:
  - id: "A1"
    statement: "Backend role-chat registration is driven by ROLE_PROMPT_TEMPLATES."
    status: verified_true
    evidence: >
      llm.dialogue.get_registered_roles returns ROLE_PROMPT_TEMPLATES keys from
      roles.kernel prompt templates.

  - id: "A2"
    statement: "Scout is a broader conversation/session role, not a registered role-chat template."
    status: verified_true
    evidence: >
      conversationApi DialogueRole includes scout, while roles.kernel
      ROLE_PROMPT_TEMPLATES currently contains pm, architect, chief_engineer,
      director, and qa.

  - id: "A3"
    statement: "Chief Engineer must remain selectable for PM/CE/Director desktop parity."
    status: verified_true
    evidence: >
      ChiefEngineerWorkspace renders dialogueRole=\"chief_engineer\" and
      role-router tests cover /v2/role/chief_engineer/chat/status.

pre_mortem:
  likely_wrong_fix: >
    Adding Scout to the frontend role-chat type would make TypeScript pass while
    preserving a runtime backend rejection.
  guardrail: >
    Introduce a dedicated RoleChatRole union and use it for role-chat service,
    hooks, and the V2 role selector.

verification_plan:
  - command: "npm run test -- api.roleChatService RoleChatPanel roleContracts llmService"
    expected: "Focused role-chat frontend service, panel, and type tests pass."
  - command: "npm run typecheck"
    expected: "TypeScript rejects unsupported role-chat values and accepts Chief Engineer."
  - command: "npm run lint"
    expected: "ESLint passes."

verification_results:
