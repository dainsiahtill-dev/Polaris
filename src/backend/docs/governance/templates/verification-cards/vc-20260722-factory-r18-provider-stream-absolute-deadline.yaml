root_cause:
  code: provider_stream_deadline_reset_across_consumption_and_reconnect
  summary: >-
    aiohttp ClientTimeout was not a sufficient boundary for the complete SSE
    iterator lifecycle. Provider wire retries each received a new transport
    timeout, while Role StreamEngine treated provider_stream_timeout as a
    generic retryable timeout and minted a second logical reconnect budget.
    One declared request timeout therefore multiplied across layers.
  fix: >-
    Establish one monotonic absolute deadline before Provider wire retries,
    pass only the remaining budget to each wire attempt, and wrap the complete
    response iterator or custom handler in asyncio.timeout. Retry backoff also
    consumes that same budget. Timeout and cancellation close the response and
    generator and terminalize the physical attempt. At the role layer,
    provider_stream_timeout is terminal because its absolute request budget is
    already consumed; transient network and 429 reconnect behavior remains
    unchanged.
