card_id: vc-20260722-factory-r18-provider-stream-absolute-deadline
classification: execution_fact_chain
status: closed
bench_status: unblocked
bug_summary: >-
  The fourteenth authorized fresh isolated L1-04 run reached a qualified
  Chief Engineer physical Provider stream with a readable final-request
  snapshot and valid role/context coverage. The first wire attempt then
  consumed the declared 193-second timeout without producing a terminal
  response. The Provider helper did not enforce its timeout across response
  body consumption, and the role stream classified the resulting
  provider_stream_timeout as reconnectable. It replayed the same semantic
  request under a fresh timeout, extending one logical call to about 493
  seconds and exhausting the Factory run without reaching Director.
