card_id: vc-20261109-engineering-bootstrap-type-boundaries
bug_summary: 'Engineering and container bootstrap inject a generation adapter into the provider registry port, causing
  the same public contract mismatch in both startup paths.

  '
classification: pattern
bug_path:
  file: polaris/bootstrap/engineering_runtime.py
  method: _prepare_model_runtime
  symptom: Strict mypy rejects ProviderAdapter as IProviderRegistryPort; runtime protocol checks fail because the
    injected generation adapter has no registry lookup or configuration methods. The same defect occurs in polaris/bootstrap/assembly.py::_inject_provider_manager_port.
assumptions:
- id: A1
  statement: The generation adapter and provider registry implement different public responsibilities.
  status: verified_true
  evidence: 'ProviderAdapter exposes generate/generate_stream; IProviderRegistryPort requires registry methods.
    Both startup-path regressions failed isinstance(IProviderRegistryPort) before fixes.

    '
- id: A2
  statement: The existing provider_manager is the correct registry owner for both startup paths.
  status: verified_true
  evidence: 'Strict structural-conformance check passed. Runtime tests assert manager identity and list/class/config
    methods while ServiceLocator retains ProviderAdapter backed by the same manager.

    '
- id: A3
  statement: A public Literal must retain strict validation of arbitrary runtime cache-mode values.
  status: verified_true
  evidence: 'Exact str check and allowed values remain unchanged. Ten invalid values, including a str subclass,
    are rejected; all three Literal values are accepted; existing cache-authority tests pass.

    '
- id: A4
  statement: A representation-only storage adapter can satisfy K1 without changing path ownership or values.
  status: verified_true
  evidence: 'RED confirmed the registered callback returned _PolarisStorageRootsImpl. GREEN confirms one original
    resolver call, equality of all 16 fields, canonical workspace/runtime/config values, and frozen K1 StorageRoots.
    No coercion or recomputation is used.

    '
- id: A5
  statement: The storage adaptation does not make cold read-only queries invoke a writer or create absent paths.
  status: verified_true
  evidence: 'The new registered-storage test observes no additional resolver call and identical filesystem state
    around resolve_storage_roots_read_only for an absent workspace; public storage-policy tests pass.

    '
pre_mortem:
  failure_point: 'Retrospective risk analysis, written after implementation: Confusing the two provider ports could
    replace generation behavior or hide missing methods behind a cast. Storage adaptation could accidentally recompute
    paths, invoke the writer twice or introduce fallback. A superficial typing fix could weaken runtime permission
    validation.'
  risk_zone:
  - engineering and container registry injection
  - ServiceLocator generation adapter identity
  - PermissionScope exact runtime cache-mode validation
  - storage Cell values and K1 frozen DTO boundary
  - cold read-only path resolution
verification_plan:
  unit_tests:
  - file: polaris/tests/test_engineering_runtime_type_boundaries.py
    description: Both provider ports, invalid cache values, storage DTO identity/value preservation and read-only
      behavior.
    expected: Correct shared registry identity; unchanged generation adapter; invalid modes rejected; exact immutable
      storage projection.
    status: new
  - file: polaris/tests/test_provider_bootstrap.py
    description: Container bootstrap registers a callback returning actual K1 StorageRoots with canonical project
      paths.
    expected: Registered callback satisfies the public result contract rather than relying on callback-object identity.
    status: existing_fix
  integration_tests:
  - description: Bootstrap, cache authority and public Cell/K1 storage boundaries.
    command: rtk proxy env PYTHONPATH=src/backend .venv/bin/python -m pytest src/backend/polaris/tests/test_engineering_runtime_type_boundaries.py
      src/backend/polaris/cells/roles/runtime/tests/test_engineering_command_cache_authority.py src/backend/polaris/tests/test_provider_bootstrap.py
      src/backend/polaris/cells/storage/layout/tests/test_storage_layout_cell.py src/backend/polaris/kernelone/storage/tests/test_project_storage_root_policy.py
      src/backend/polaris/kernelone/storage/tests/test_layout_no_cell_import.py -q -rs
    status: existing_pass
