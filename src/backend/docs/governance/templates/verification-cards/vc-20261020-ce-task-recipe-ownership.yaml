limits:
  - Synthetic trusted test issuer with real signatures is not a replay of the original Factory PM chain.
  - Factory command capture is not a final physical provider request or native acceptance.
  - Original R12 source, targets, facts, runtime and seals remain immutable; no target command, ALL, native run or main restart.
  - No downstream task guard, Director, token, permission, snapshot capture or StageResult persistence mechanism changes.
  - Initial and repair ExecuteRoleTaskCommand captures use explicit characterization PM/cutoff and canned provider ports; neither is a physical provider request or fresh native delivery proof.
