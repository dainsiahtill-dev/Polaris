problem:
  - Strict cold reading original R02 exposed incomplete native lifecycle identity migration.
  - Some lifecycle tokens carry task-scoped project identity; supplied Factory tokens retain parent authority run beside child execution run.
hypotheses:
  - Captured typed TaskRuntime task aliases and unique Factory ancestry can relate these existing namespaces without rewriting facts or tokens.
  - Every explicit event, token and metadata identity must remain consistent with that ancestry.
mechanism:
  - Only tool_call_lifecycle with an exact captured native task owner receives the additional namespace interpretation.
  - Compact legacy lineage cannot introduce lifecycle alias or parent-token authority.
  - Supplied Factory token run must equal captured parent and its project must equal captured catalog project.
  - Event and fact envelope keep the child execution run; all other explicit run and task identities remain exact.
  - Explicit foreign event or metadata project cannot be masked by token field precedence.
  - Existing task-boundary compatibility and rejection checks remain unchanged.
  - No live TaskBoard fallback, token mutation, fact rewrite, execution permission or success grant.
verification:
