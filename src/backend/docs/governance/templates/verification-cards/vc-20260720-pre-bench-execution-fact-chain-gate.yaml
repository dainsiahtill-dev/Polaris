    failures_closed:
      - code: sequential_claim_uses_stale_admission_head
        root_cause: >-
          Claim and abort CAS sequences were derived from the immutable
          inventory-admission head plus member index even though earlier
          members append claim, receipt, abort, or recovery transitions to the
          same operation stream.
        fix: >-
          Strictly rebuild the exact admitted operation through TaskRuntime's
          public read port before every claim or abort, derive the next sequence
          from the current stream head, and keep command CAS as the final race
          and authority guard.
      - code: committed_effect_receipt_projection_gap
        root_cause: >-
          The physical v2 receipt and TaskRuntime commit existed, but the
          result-level projection dropped the sibling commit and an incomplete
          direct view shadowed the valid nested pair in Run Ledger.
        fix: >-
          Preserve exact receipt-plus-commit pairs across ToolExecutionResult,
          BatchReceipt, raw result, and Run Ledger; accept historical nested
          commits only when their receipt exactly matches the direct receipt.
      - code: final_request_tool_registry_provenance_missing
        root_cause: >-
          The final request auditor trusted optional caller context keys for
          ToolSpecRegistry provenance. No production producer populated them,
          so a valid registry-derived write_file schema was reported with an
          empty source and false alias coverage; B3.5 correctly rejected it.
        fix: >-
          Reconstruct provenance from the exact final Provider tool schemas,
          capture each effective registry spec, verify argument-alias property
          coverage, hash the actual surface, and refuse any source claim for
          unknown or incomplete schemas. Qualification still independently
          validates full schema shape, scoped enums, hash, source and aliases.
      - code: pm_route_probe_transaction_identity_unbound
        root_cause: >-
          The real PM route-audit probe carried only correlation fields, so
          TransactionKernel correctly rejected it before Provider construction;
          run/task/session fallback is forbidden.
        fix: >-
          Generate a stable run-scoped turn_request_id and explicitly project
          accepted first-class execution identities from adapter context into
          RoleRuntime request metadata.
      - code: director_internal_external_task_id_projection_missing
        root_cause: >-
          The guarded Director role command used TaskRuntime's private integer
          row id while its exact authority bound the canonical PM/CE external
          task id required by RoleRuntime.
        fix: >-
          Normalize only an exact canonical internal-row id into its bound
          external task id. Preserve all other caller ids so genuine drift is
          still rejected fail-closed.
      - code: factory_non_effect_repair_evidence_misclassified
        root_cause: >-
          The materialization public boundary treated a repair-kernel denial
          carrying source_tool/repair_kernel metadata as an actual tool effect.
          Factory therefore counted thirteen authority-free diagnostics as
          effect results and could rerun validation against an unchanged
          workspace.
        fix: >-
          Keep dispatchable deferred requests, physical mutation results,
          hashes and receipts as effect payloads; classify missing-evidence
          callback denials without those fields as non-effect evidence. Factory
          tests now assert no mutation without a canonical TaskRuntime attempt.
      - code: run_ledger_negative_fixture_version_omitted
        root_cause: >-
          Two negative Run Ledger fixtures omitted the now-required TaskRuntime
          commit version and therefore accumulated an unrelated
          invalid_task_runtime_version failure.
        fix: >-
          Bind both fixtures to canonical version 3 so each regression isolates
          only its intended receipt identity/hash mismatch.
      - code: physical_wire_max_tokens_drift
        root_cause: >-
          The provider-native authority copied the pre-clamp semantic output
          budget instead of the Engine's final model/window-clamped invoke
          budget, while the actual provider correctly consumed the latter.
        fix: >-
          Project the final Engine max_tokens only when it is a positive,
          non-expanding reduction of the frozen request. Invalid values and
          attempted expansions remain fail-closed across Anthropic, OpenAI chat
          and OpenAI responses protocols.
      - code: final_request_role_included_refs_drift
        root_cause: >-
          Generic ContextOS observation refs were projected into the exact
          Factory qualifying included_refs list, even when the cutoff-bound
          role evidence slot was absent_at_request_time.
        fix: >-
          Bind the frozen audit through the live Factory dispatch sidecar;
          preserve observed_included_refs separately and recompute required,
          included, missing and pass from the exact role policy facts and tool
          coverage. Rebinding is idempotent so later tampering is never healed.
      - code: factory_workspace_stale_owner_fence_failed
        root_cause: >-
          Factory owner lookup coupled stable session_id plus attempt identity
          to volatile lease_expires_at and therefore rejected a legitimate
          lagging TaskBoard/fact projection as a foreign session.
        fix: >-
          Resolve Factory ownership only from explicit session metadata or an
          exact session_id plus attempt task-row binding; never infer it from
          the role child run_id and never require volatile lease equality.
      - code: context_roundtrip_duplicate_runtime_root
        root_cause: >-
          The e2e assertion wrapped an already resolved project runtime root in
          StorageLayout and inspected a duplicated projects/runtime path.
        fix: >-
          Assert the UTF-8 JSON payload at resolve_storage_roots(workspace)
          runtime_root/contexts/<shard>/<hash>, matching producer and reader.
      - code: factory_director_child_stage_boundary_settlement
        root_cause: >-
          An early inflight Director lifecycle result left most of the admitted
          execution budget unused, but Factory waited only its five-second
          settlement reserve and closed role-evidence authority while the
          TaskRuntime child was reaching Provider transport.
        fix: >-
          Carry one absolute execution deadline into Director metadata, clamp
          it at execution, role-dialogue, and final semantic-request boundaries,
          reject expired/sub-second leases before transport, and wait the unused
          execution lease plus settlement reserve before stage return.
      - code: ce_schema_repair_duplicate_stage_grant
        root_cause: >-
          The independently claimed CE schema-repair child tried to mint a
          second stage role-evidence grant. The CE stage grant cap is exactly
          one, so the authority correctly rejected the repair before transport.
        fix: >-
          Reuse the one typed CE authority binding across primary and repair
          final requests while preserving independent TaskRuntime task, claim,
          session, request-freeze, and physical-attempt identities.
      - code: factory_cutoff_audit_subprojection_drift
        root_cause: >-
          Factory cutoff rebinding replaced required/included/missing refs and
          the pass bit, but retained heuristic coverage sources, evidence slots,
          ratio, and context-quality findings.
        fix: >-
          Rebuild every subordinate evidence projection from the typed cutoff
          policy facts, recompute the ratio, and remove or reconstruct only the
          superseded evidence findings.
      - code: ce_streaming_json_contract_not_projected_to_provider
        root_cause: >-
          Factory declared the Chief Engineer portfolio JSON contract through
          prompt text and context flags only. The exact streamed primary and
          repair Provider requests therefore had no tools, tool_choice, or
          response_format, and both long responses failed the required-key
          parser despite sufficient role context.
        fix: >-
          Introduce a caller-owned RoleStructuredOutputContractV1, project it
          once through roles.runtime, expose exactly one strict reserved result
          tool to the Provider, validate the submitted object against the
          caller schema, and normalize it to canonical JSON before
          TransactionKernel tool decoding. The result transport is explicitly
          non-executable and cannot create Tool Lifecycle or effect-receipt
          facts.
      - code: ce_advisory_scope_transport_overconstraint
        root_cause: >-
          R113 physically reached DeepSeek twice with qualified final requests
          and valid construction/risk content, but both HTTP 200 submissions
          omitted only scope_for_apply. Factory incorrectly made this
          non-authoritative advice a Provider-transport required field, so
          stream validation discarded the portfolio before Director.
        fix: >-
          Keep scope_for_apply declared and prompted but optional at transport
          and semantic validation boundaries. Preserve construction_plan,
          risk_flags, task ids, interface contracts, and present-value type
          checks; never synthesize CE scope. Emit an explicit warning proving
          PM target/scope authority remains unchanged and expansion remains
          forbidden.
