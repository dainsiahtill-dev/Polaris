card_id: vc-20260720-pre-bench-execution-fact-chain-gate
classification: structural
status: active
bench_status: r119_audit_closed_authorized_one_fresh_isolated_l1_04
authorization: >-
  R119 independent review AUDIT_CLOSED (2026-08-01). Exactly one fresh isolated
  single-project factory_bench is authorized for project_id L1-04 with
  --launcher-instance-mode isolated --bench-session-reporting off; no 49977/5173;
  no concurrent multi-project; do not fabricate COMPLETED_VERIFIED.
bug_summary: >-
  DEO-1A through DEO-4 and B3.4-B3.6 are closed. The first authorized fresh
  isolated L1-04 run exposed final_request_role_included_refs_drift before CE
  transport; that defect is closed. The authorized same-project retry then
  reached the exact physical-wire gate and exposed physical_wire_max_tokens_drift:
  the frozen request retained 128000 requested tokens while the Engine correctly
  clamped the actual provider config to 16384, but the native route projector
  still used the pre-clamp value. The projector fix is implemented. The final
  broad-gate pass also closed stale Run Ledger fixtures and a Factory repair
  evidence regression that counted authority-free callback diagnostics as
  physical effects. Acceptance run 3 then proved CE context quality but found
  two pre-Provider identity projections: Director used the private TaskRuntime
  row id instead of the canonical external task id, and the PM route probe did
  not carry a first-class transaction turn identity. Both are closed without
  weakening either fail-closed boundary. Exactly one fresh isolated L1-04
  acceptance run was then consumed. Run 4 proved both identity fixes and the
  PM/CE route audit, reached Director, and exposed an empty ToolSpecRegistry
  provenance projection in the exact final request audit. B3.5 correctly
  rejected that request before Provider transport with
  tool_registry_source_mismatch. The producer now reconstructs authoritative
  registry provenance from the exact final Provider tool surface and refuses
  provenance for unknown or incomplete schemas. Run 5 then reached physical
  Director writes and exposed two downstream fact-chain defects: a committed
  TaskRuntime receipt was shadowed by an incomplete result projection, and
  sequential claim/abort CAS values were guessed from the immutable admission
  head after earlier receipt transitions had advanced the shared operation
  stream. Both defects are closed without synthesizing receipts or weakening
  TaskRuntime authority. Focused, Cell-full, Factory, Run Ledger, integration,
  and architecture gates are green. Run 6 then exposed the stale 240-second CE
  portfolio timeout and a causal attribution gap. Broad validation also
  exposed and closed missing physical-attempt stage-claim revalidation,
  restart replay fencing/deadline gaps, and an Artifact Store/Projection/QA
  public import cycle. Factory 1287, Delivery 375, and Artifact Store 4 tests
  are green. Acceptance run 7 consumed that authorization and exposed an
  execution-boundary defect: Factory returned from Director dispatch while the
  TaskRuntime child remained active, then closed the stage role-evidence
  authority before the child reached Provider transport. R11 is now closed:
  Factory carries one absolute execution deadline, Director re-clamps at the
  execution, role-dialogue, and final-request boundaries, and Factory spends
  the unused execution lease before its settlement reserve. Acceptance run 8
  consumed that authorization and reached a real Chief Engineer physical
  Provider request, but the request timed out after 191 seconds before any
  Director dispatch or target-project effect. R12 is closed: roles.runtime now
  honors streamed task commands, Factory CE portfolio calls use the audited
  stream path, task timeout authority reaches provider context, and
  incomplete/error streams fail closed. Run 9 then proved the streamed response
  path but exposed terminal stream metadata loss; R13 now preserves the exact
  final-request audit and snapshot reference. Run 10 proved R13 and exposed a
  fixed 4096-event conservation buffer below the qualified 16384-token physical
  output budget. R14 now scales the event-count budget from the exact qualified
  wire request while retaining the 8 MiB byte cap, a 65536-event hard cap, and
  terminal-before-release zero-leak semantics. Run 11 proved the buffer fix and
  complete CE final-request context, then exposed a 128000-token portfolio
  request competing for a 125-second physical lease plus loss of the first
  timeout cause across stream projections. R15 now scales only Factory CE
  portfolio output to task count under the existing deployment cap, emits a
  typed provider_stream_timeout, suppresses the duplicate materialization
  error, and preserves the first causal error. Run 12 proved the physical CE
  request and coherent 16384-token response, then exposed a streamed terminal
  fact-chain break: terminal Provider metadata and its context snapshot were
  discarded during RawLLMResponse materialization, the stream projected two
  terminal completions, and the CE portfolio lacked an explicit analyze-only
  delivery contract. R16 now conserves terminal metadata through Run Ledger,
  restores the CE analyze-only marker without changing existing materialize or
  propose behavior, and emits one authoritative terminal completion. Broad
  gates and a recaptured stable source snapshot are green. Run 13 proved R16,
  accepted the complete Chief Engineer blueprint portfolio, and reached a real
  Director Provider request. It then exposed a primary write-code request that
  inherited the generic 128000-token execution budget despite only about 46
  seconds remaining on the Factory deadline. R17 now applies the existing
  central 7000-token materialization ceiling to authoritative first-call
  write_code contracts while leaving review calls unchanged. Full Director,
  roles/adapters, Factory, budget-policy, static, and structural gates are
  green. Run 14 then reached another fully audited Chief Engineer Provider
  stream and exposed a cross-layer deadline reset: response-body consumption
  outlived the declared 193-second Provider timeout, then Role StreamEngine
  replayed the already-timed-out request under a fresh timeout budget. R18 now
  applies one monotonic absolute deadline across Provider wire retries,
  response consumption, custom handlers, retry backoff, and resource cleanup;
  the role layer treats the consumed provider_stream_timeout as terminal while
  preserving transient network and 429 reconnects. Run 15 proved R18 admitted
  exactly one physical request and that the Provider durably completed, then
  exposed a subtler deadline leak: the timeout context remained armed across
  Factory's post-terminal buffered replay and cancelled the CE consumer task.
  R19 now applies the deadline only while awaiting physical stream data, never
  across outward yields. Run 16 proved that repair, crossed the former
  cancellation window, and exposed a second post-terminal deadline projection:
  KernelOne StreamExecutor rejected Factory's already-completed buffered replay
  against its legacy 300-second wall clock, then the role layer issued a second
  physical request. R20 transfers deadline ownership only for a sidecar with
  both physical stream dispatch and Factory route-authority capabilities;
  arbitrary sidecars and ungoverned streams retain the old fail-closed timeout.
  Run 17 proved R20 with one completed physical stream and exposed a streamed
  output-validation parity gap: malformed CE JSON was projected as successful
  before Factory rejected it. R21 now validates streamed output before
  TaskBoundary, preserves the typed validation failure through roles.runtime,
  and permits exactly one separately claimed, deadline-readmitted CE schema
  repair that preserves the complete physical output and PM authority. Role
  Kernel 4159, Role Runtime 697, Factory Pipeline 1221, and Factory
  characterization 251 tests are green. Exactly one fresh isolated L1-04
  acceptance run was consumed. Run 18 proved the R21 validation/repair path but
  exposed a CE authority-cardinality error before the repair Provider request:
  the repair child attempted to mint a second stage grant although the fixed CE
  cap is one. R22 now reuses the single CE authority across independently
  claimed primary and repair TaskRuntime attempts. The same run exposed stale
  subordinate ContextOS coverage projections after Factory cutoff authority
  replaced heuristic refs; R22A now rebuilds sources, slots, ratio, and context
  quality from the typed cutoff facts. Roles Kernel 4159 and Factory Pipeline
  1221 tests are green. Acceptance run 19 proved the R22 authority reuse and
  reached the separately claimed CE schema-repair Provider request, then
  exposed corrupt-output replay inside the repair instruction. R23 now
  projects bounded structured failure evidence plus only the corrupt output
  digest/size, reconstructs a fresh portfolio from authoritative PM and target
  evidence, and caps repair output at 8192 tokens. Factory Pipeline 1222 tests
  are green. Run 20 proved the R23 repair request hygiene and produced an
  accepted CE portfolio, then exposed a Director dependency projection error:
  the suspended internal CE primary-attempt TaskRuntime row was mixed into the
  PM task DAG and rejected as an unknown active task. The public signal
  mislabeled that typed schedule rejection as deadline exhaustion despite 1210
  seconds remaining for a 1155-second request. R24 now excludes only
  provenance-complete internal CE rows, preserves unknown untrusted rows as
  fail-closed blockers, and reports invalid dependency schedules with their
  real code and blocker evidence. Factory Pipeline 1225 tests are green. The
  post-R24 source snapshot was stable across two independent captures. Run 21
  proved R24, reached a real Director Provider request, and materialized five
  project files. It then exposed a role-evidence source resolver that treated
  the heterogeneous execution.control_plane stream as gate-only and rejected
  valid tool_call_lifecycle and task_boundary_verdict facts. R25 now preserves
  strict whole-stream integrity and source-head validation while projecting
  only gate_evaluated facts into dynamic role-evidence slots. The exact R25
  physical stream replays successfully and Factory Pipeline 1227 tests are
  green. Run 22 (R26) proved R25 and kept every PM/CE final-request evidence
  slot readable and role-correct, but exposed a bounded-output contract break.
  The CE caller requested JSON while both exact physical Kimi requests were
  projected as plain_text with response_format=null and mandatory unbounded
  thinking. The primary consumed exactly 16384 completion tokens before its
  JSON was truncated; the separately claimed repair consumed exactly 8192
  completion tokens, produced only 641 visible characters, and was also
  truncated. Director and QA were therefore never reached. Bench is frozen
  until reasoning budget is carried into the exact physical request, audited,
  and the JSON-output reservation is regression-proven. R26 is now closed: the
  primary portfolio and schema-repair calls carry distinct bounded reasoning
  budgets through Factory, Role Kernel, KernelOne Engine, and the exact
  Anthropic-compatible provider request. Streamed explicit JSON contracts are
  audited as text_json_fallback instead of plain_text, invalid budgets fail
  closed, and standard non-thinking Anthropic routes remain unchanged. Focused
  tests, split Cell suites, static gates, and post-edit CodeGraph review are
  green. The one authorized R27 run was consumed and proved both reasoning
  budgets reached the physical wire. It also exposed cross-instance WebSocket
  contamination: an older R24 page reused the shared local token and connected
  to R27 on a recycled port with a foreign workspace, saturating the WS queue and
  backend CPU. R27 closes that isolation defect with Supervisor-generated
  per-instance tokens plus authoritative workspace rejection. The same run left
  the CE repair non-terminal after the Provider socket reached CLOSE-WAIT, but
  concurrent WS starvation prevents clean attribution. Bench is frozen for R28
  deterministic EOF/cleanup/terminal-fact reproduction; no retry is authorized.
  R28 is now closed. A deterministic half-closed session reproduced the exact
  missing-terminal shape: stream consumption finished, but the response/session
  context cleanup was awaited without a bound before the durable terminal append.
  The gate now bounds cleanup, cancels the stuck cleanup task, emits one typed
  provider_stream_cleanup_timeout failed terminal, releases the physical attempt,
  leaks zero buffered output, and does not retry the non-network failure. Roles
  Kernel 2746, Provider 106, Factory Pipeline 1227, and Engine/Anthropic 324 tests
  are green. The post-R28 source snapshot is identical across two captures.
  The single authorized R29 run was consumed. It proved PM and Chief Engineer,
  reached Director, materialized five Go project files, and passed a real Go
  compile check. It then exposed a private-row/external-task identity mismatch
  when Director projected the deterministic verify command into a deferred
  directed effect. The first task failed with
  deo_deferred_command_request_invalid and downstream tasks were blocked. The
  same run also exposed a queued settlement waiting-barrier idempotency payload
  drift that produced a hot replay-conflict loop. Both R29 roots are now closed:
  the deferred command boundary normalizes only the exact bound private row id
  to its external task id, and settlement reuses an open-barrier pending fact
  while allocating retry identities per claim. Roles Adapter 1263, settlement
  consumer/runtime 82, and Factory Pipeline 1229 tests are green; static and
  post-edit structural review are green. A twice-identical post-R29 source
  snapshot authorized exactly one fresh isolated L1-04 R30 run. R30 exposed
  transient non-authoritative TaskRuntime readiness being returned as terminal;
  that root is closed and its single R31 authorization was consumed. R31 proved
  PM, Chief Engineer, Director physical writes, and a real Go compile, then
  exposed and closed a Director child-invocation identity collision. The single
  authorized R32 run was consumed. R32 proved a complete Chief Engineer physical
  Provider lifecycle but exposed two downstream roots: Factory replay compared
  the pre-evidence semantic candidate hash to the final qualified semantic
  request hash, and the CE role run did not terminalize after the physical
  terminal fact. R32 then closed dual-semantic replay, R33 closed terminal
  WebSocket policy-rejection reconnect storms, and R34 compacted the exact
  post-terminal Provider replay from 10,088 tiny journal events to bounded
  ordered batches without changing Provider or tool facts. The closing
  pre-bench architecture run exposed R35: Director rewrote a TaskRuntime-owned
  runtime_execution projection for child role calls. R35 now treats that
  projection as read-only and carries parent/child identity only through
  director.role_subinvocation.v1. R100 then proved the primary Director batch
  could settle its receipts but the same TaskRuntime attempt's real repair
  batch was rejected with deo_parent_admission_failed/parent_open_conflict.
  The roles.kernel caller had hard-coded parent version 0/sequence 1 for every
  batch while TaskRuntime intentionally kept the receipt-complete predecessor
  OPEN until terminal settlement. R100 is closed without parent reuse or fake
  settlement: TaskRuntime now atomically closes only a ready,
  receipt-complete predecessor, writes strict V4 child and V3 parent rollover
  facts, derives the successor CAS/sequence under the execution-attempt locks,
  and admits the next batch. Same-batch replay is idempotent; unresolved,
  failed, dead-lettered, terminally closed, or identity-drifted predecessors
  remain fail-closed. Crash recovery is proven both between child closes and
  after the durable parent close, and settlement/admission races linearize
  without split writes. The complete current-source fact-chain, Cell,
  integration, architecture, static, and post-edit CodeGraph/Caveman review
  gates are green. R101 then consumed one run with a 540-second smoke timeout
  instead of the repository's mandatory 5400-second completion-verification
  timeout. The deadline policy correctly blocked before CE Provider transport:
  the runner exposed only 513 seconds, while the observed three-wave schedule
  required 310 seconds of downstream reserve plus a 205-second CE generation
  floor before any PM wall time. R101 is therefore retained as valid
  fail-closed deadline evidence but is invalid as runnable/COMPLETED_VERIFIED
  acceptance evidence. The current AGENTS.md, CLAUDE.md, and runner default all
  require 5400 seconds for completion verification; deadline-policy 16/16 and
  two identical current-source snapshots are green, authorizing exactly one
  fresh isolated L1-05 R102 with the 5400-second Factory lease and 6000-second
  outer watchdog. R102 consumed that authorization and proved the 5400-second
  deadline contract, PM route, readable final-request snapshots, and two
  physical Chief Engineer calls. It then exposed R102A: the CE caller declared
  a JSON contract only through prompt/context flags, while all four exact CE
  request snapshots carried tools=[], tool_choice=null, and
  response_format=null. The primary and independently claimed schema-repair
  calls therefore produced long unconstrained text that did not contain the
  required construction_plan/scope_for_apply/risk_flags object. R102A is now
  closed with a caller-owned typed structured-output contract projected once
  through roles.runtime, a single strict provider result-tool schema, local
  Draft 2020-12 payload validation, and stream/non-stream normalization before
  TransactionKernel tool decoding. The reserved result tool has no execution,
  authorization, Tool Lifecycle, effect-receipt, or mutation-port authority.
  Primary and repair calls share the exact dynamic portfolio schema. Roles
  Kernel/Runtime/Factory 6138 and architecture 1411 tests are green; static,
  CodeGraph, and Caveman review found no boundary violation. R103 consumed its
  single authorization and reached the frozen Chief Engineer semantic request,
  then B3.5 correctly rejected it before Provider transport with
  tool_registry_schema_missing: the new reserved result protocol was being
  classified as an executable ToolSpecRegistry tool. R103A closes that
  provenance-classification defect without registering or authorizing the
  protocol tool. Prepared requests now carry the exact caller-owned transport
  plan into final-request audit; audit projects a separately hashed
  provider_protocol_schema_coverage record; B3.5 accepts only one exact strict
  result schema with the exact forced tool_choice and zero execution/effect
  authority. Same-name schema drift, mixed protocol/executable surfaces, and
  unknown executable tools remain fail-closed. Roles Kernel/Runtime/Factory
  6142 and architecture 1411 tests are green. R104 consumed its one-shot
  authorization and proved the complete PM and Chief Engineer semantic and
  physical Provider requests were role-correct, readable, coverage-complete,
  and carried the strict non-executable submit_structured_role_output protocol.
  The Provider returned one native result-protocol call without tool errors,
  but the caller-owned schema permitted unknown
  construction_plan.project_interface_contract fields that the downstream
  Chief Engineer parser correctly rejects fail-closed. R104A closes the
  producer/consumer schema drift at its source: the Provider schema now permits
  only provider_declarations and consumer_declarations in that interface
  wrapper; the parser remains strict and no execution/tool authority is added.
  R105 consumed the resulting one-shot authorization and proved complete,
  role-correct, coverage-complete final Provider requests for PM, Chief
  Engineer, and three Director calls. Director committed seven declared Rust
  files through one all-success DEO parent, but the first failed quality gate
  cascade-blocked the remaining tasks. The TaskRuntime failure event contained
  both the terminal DEO proof and the materialized adapter result while omitting
  dependency-satisfaction evidence. R105A closes that projection TOCTOU:
  settlement no longer evaluates the stale phase-A Task snapshot before the
  adapter result becomes visible; it derives the narrow, hash-bound dependency
  proof from the existing projection-lock TaskBoard snapshot. The parent
  remains failed, and all missing, failed, dead-lettered, out-of-scope, or
  identity-drifted evidence remains fail-closed. R106 then consumed the
  resulting authorization and proved 11 readable, role-correct,
  coverage-complete final Provider requests across PM, Chief Engineer, and
  Director. Director again committed seven declared Rust files through a
  terminal all-success DEO proof, but exposed two deeper projection defects.
  First, the authoritative adapter_result arrived in the settlement command
  metadata and therefore was still absent from the pre-update TaskBoard row
  inspected by R105A. Settlement now evaluates the exact merged metadata that
  it atomically persists, while retaining every existing DEO identity, receipt,
  hash, path, and regular-file fail-closed check. Second, the complete
  multi-megabyte task_row_snapshot correctly belonged in the durable
  task_runtime.execution fact but was copied verbatim into the realtime Factory
  envelope, exceeding the NATS 1 MiB payload ceiling. Realtime now carries only
  a typed durable-fact reference projection; the durable fact remains complete
  and authoritative. Focused red/green tests, TaskRuntime, WorkflowRuntime,
  TaskRuntime architecture fences, static gates, and all 1419 architecture
  cases are green. R107 consumed the next authorization and failed before
  Director: its complete Chief Engineer final request was readable,
  role-correct, coverage-complete, and forced the strict non-executable result
  protocol, but the Provider omitted the required root scope_for_apply field.
  The physical stream yielded that invalid tool call before protocol validation;
  downstream validation then raised outside the LLM lifecycle, leaving only a
  start event and bypassing the existing one-shot CE schema repair. R107A now
  validates the reserved result call at the Provider stream boundary before
  consumer delivery, so invalid payloads produce a canonical terminal
  call_error with Provider identity. Factory classifies only explicit
  result-protocol payload violations as output-validation failures eligible for
  its existing independent, bounded schema repair. Provider, routing, deadline,
  circuit, and semantic-design failures remain fatal. Roles Kernel and Factory
  Pipeline 5447, focused 406, and relevant architecture 23 tests are green.
bug_path:
  file: src/backend/polaris/cells/runtime/task_runtime/internal/service.py
  method: >-
    TaskRuntimeService._failed_materialization_dependency_satisfaction and
    TaskRuntimeService._publish_factory_execution_event
  symptom: >-
    R106 settlement carried the materialized adapter_result only in command
    metadata, so the dependency proof still missed it before the TaskBoard
    update. The same durable execution fact then copied a 3.9 MiB
    task_row_snapshot into a 4.16 MiB realtime envelope, which NATS correctly
    rejected against its 1 MiB ceiling.
r107_bug_path:
  files:
    - src/backend/polaris/cells/roles/kernel/internal/llm_caller/stream_engine.py
    - src/backend/polaris/cells/roles/kernel/internal/structured_output_transport.py
    - src/backend/polaris/cells/factory/pipeline/internal/factory_stage_executor.py
  symptom: >-
    The forced CE result tool omitted scope_for_apply. Validation raised in the
    downstream TransactionKernel projector after the Provider stream yielded
    the call, so chief_engineer.llm.events contained llm_call_start only and
    Factory did not consume its governed schema-repair attempt.
r108_closure:
  source_run:
    project_id: L1-05
    bench_run_id: 7a634330b08a
    factory_run_id: factory_08103e3277f9
  closed_roots:
    - task_runtime_dependency_projection_split_brain
    - workflow_runtime_structured_failure_evidence_loss
    - terminal_task_runtime_projection_destroyed_before_audit
    - quality_rework_evidence_destroyed_before_orchestration_decision
    - terminal_snapshot_lost_across_reset_release_crash_window
  authority_invariants:
    - >-
      A failed parent releases dependency capability only with a TaskRuntime-owned,
      hash-bound failed-materialization receipt; its terminal status stays failed.
    - >-
      Terminal drain freezes and validates the exact run/workspace-bound
      TaskRuntime authority projection before reset.
    - >-
      Lifecycle rollback reloads the latest persisted Factory run and cannot
      overwrite a frozen terminal snapshot with a stale pre-operation object.
    - >-
      A terminal-drain retry reuses the valid frozen snapshot and keeps the Run
      Ledger barrier required even after live TaskRuntime rows have been reset.
  machine_record: scratchpad/r108-evidence/defect-record-r108.json
r110_closure:
  source_run:
    project_id: L1-05
    bench_run_id: 6770b42ca4e7
    factory_run_id: factory_9efb8d1cee31
  consumed_authorization: exactly_one_fresh_isolated_l1_05_r110
  result: failed_at_chief_engineer_structured_result_protocol_conflict
  exact_error_code: chief_engineer.llm_review_failed
  exact_error: model returned thinking-only response; awaiting user clarification
  root_cause: >-
    The final Chief Engineer Provider request exposed only the reserved,
    non-executable submit_structured_role_output result protocol, but
    build_decision_messages still injected generic Director execution,
    mutation, verification, and single-batch task-contract instructions because
    PM target files were present. Both physical CE attempts had complete,
    role-correct context and a forced strict result tool, yet the contradictory
    prompt told the model both to return a typed result and to inspect/write
    project files with tools that were not physically available.
  fix: >-
    Treat the exact singleton structured-result Provider surface as a typed
    non-mutation turn. Project one explicit structured-result constraint and the
    exact physical schema, then skip every generic execution, mutation,
    verification, and task-contract template. Mixed structured-result plus
    executable surfaces do not receive this exemption.
  final_request_snapshot_refs:
    chief_engineer_semantic:
      - 32e04e7e9e595c6607ae0d80
      - a06800d6bf27a0c600112486
    chief_engineer_physical:
      - 62335dbd7917fc240da8a3d2
      - d6ed1775d0695396559eabdd
    pm_semantic:
      - ebdc927c713fdee216ceae7f
    pm_physical:
      - bf7e589e6e15d0dddf2ee79e
  context_audit:
    role_identity: pass
    pm_contract: pass
    target_files: pass
    required_result_tool: pass
    final_request_token_estimate: 5122
    context_window_tokens: 1000000
    max_output_tokens: 16384
    root_cause_is_context_capacity: false
  provider_calls:
    pm: 1
    chief_engineer: 2
    director: 0
    qa: 0
  instance_stopped_via_launcher: true
assumptions:
  - id: A1
    statement: >-
      I assume the R100 failure was a platform parent-lifecycle defect, not a
      weak-model or missing-context failure.
    status: verified_true
    evidence: >-
      R100 Factory run factory_cdb8b392ded9 preserved six valid repair
      write_file calls while TaskRuntime returned parent_open_conflict before
      dispatch.
  - id: A2
    statement: >-
      I assume a predecessor parent is eligible for rollover only after its
      immutable inventory is ready and every admitted effect has a successful
      receipt or an authoritative unstarted abort.
    status: verified_true
    evidence: >-
      TaskRuntime reducer and public tests reject unresolved, failed-receipt,
      dead-letter, inventory-not-ready, identity-drift, and terminal-close
      cases fail-closed.
  - id: A3
    statement: >-
      I assume rollover and terminal settlement must share the execution
      attempt's local and cooperative file locks and remain recoverable after
      every durable partial write.
    status: verified_true
    evidence: >-
      Real-thread winner-order tests prove linearization; crash-seam tests prove
      recovery between child closes and after the V3 parent close.
  - id: A4
    statement: >-
      I assume R105 is not a role-context, Provider, or tool-schema defect.
    status: verified_true
    evidence: >-
      Every reached PM, Chief Engineer, and Director semantic/physical snapshot
      is readable, role-correct, coverage-complete, and tool-schema-correct;
      Provider and Director tool calls completed without tool errors.
  - id: A5
    statement: >-
      I assume the projection-lock TaskBoard row is the latest owner-cell fact
      available for fresh settlement projection.
    status: verified_true
    evidence: >-
      TaskBoard.get returns a deep copy under its transaction; settlement reads
      it only after acquiring the local and cooperative projection locks, and
      the same row is already the idempotence authority.
  - id: A6
    statement: >-
      I assume a failed parent may release only dependency capability, never
      completion, when declared materialized paths and all-success DEO evidence
      are hash-bound.
    status: verified_true
    evidence: >-
      Focused fail-closed tests preserve parent FAILED and reject missing,
      failed, dead-lettered, zero-receipt, out-of-scope, and non-write evidence.
  - id: A7
    statement: >-
      I assume the settlement command metadata is part of the exact atomic Task
      projection and must participate in dependency-proof calculation.
    status: verified_true
    evidence: >-
      The R106 command carried adapter_result and terminal DEO evidence while
      the projection-lock row did not; the new red/green test proves merged
      metadata releases only dependency capability and leaves the parent failed.
  - id: A8
    statement: >-
      I assume the full task_row_snapshot is durable-fact evidence and need not
      be duplicated in the lossy realtime notification envelope.
    status: verified_true
    evidence: >-
      Durable task_runtime.execution retains the complete snapshot. Realtime
      publishes its fact id, sequence, and stream under a typed projection, and
      the 2 MiB regression fixture serializes below the 1 MiB NATS ceiling.
  - id: A9
    statement: >-
      I assume a Provider result-protocol schema violation is an invalid output
      eligible for one bounded repair, while transport and design failures are
      not.
    status: verified_true
    evidence: >-
      R107's exact final request was valid and the Provider physically returned
      the forced result call. Red/green and stage integration tests prove the
      invalid call records terminal call_error, then a separate claimed repair
      can succeed; circuit, Provider, deadline, and semantic failures remain
      excluded by the narrow admission predicate.
pre_mortem:
  failure_point: >-
    The highest-risk failure is either using an unlocked post-settlement row,
    allowing a forged adapter_result to bypass DEO proof, or changing idempotent
    replay to recompute a proof instead of consuming its stored hash-bound
    receipt.
  risk_zone:
    - polaris.cells.runtime.task_runtime.internal.service
    - polaris.cells.runtime.task_runtime.internal.task_board
    - polaris.cells.orchestration.workflow_runtime.internal.director_result_artifacts
verification_plan:
  unit_tests:
    - file: polaris/cells/runtime/task_runtime/tests/test_execution_attempt_settlement.py
      description: >-
        Publish adapter_result after the phase-A Task read but before projection,
        then settle against one real committed DEO receipt.
      expected: >-
        Parent stays FAILED; the projection stores a hash-bound dependency
        receipt and releases only the directly blocked child.
      status: new
    - file: polaris/cells/runtime/task_runtime/public/tests/test_directed_effect_operation.py
      description: >-
        Verify eligible rollover, idempotent replay, fail-closed predecessor
        cases, and both durable crash windows.
      expected: >-
        Exactly one successor parent is admitted with a dynamically derived
        sequence; no unresolved or failed predecessor can roll over.
      status: new
    - file: polaris/cells/runtime/task_runtime/tests/test_directed_effect_operation_concurrency.py
      description: >-
        Race parent-batch rollover against terminal settlement under the real
        TaskRuntime locks.
      expected: >-
        Either rollover wins and settlement remains blocked by the successor,
        or settlement wins and admission is rejected; never split writes.
      status: new
    - file: polaris/cells/roles/kernel/tests/test_directed_effect_lifecycle.py
      description: >-
        Exercise two real receipt-backed tool batches through roles.kernel and
        TaskRuntime.
      expected: >-
        Batch two receives parent sequence 2 and current registry heads rather
        than hard-coded version 0/sequence 1.
      status: new
