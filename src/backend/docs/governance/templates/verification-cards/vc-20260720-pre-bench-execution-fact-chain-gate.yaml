card_id: vc-20260720-pre-bench-execution-fact-chain-gate
classification: structural
status: active
bench_status: not_schedulable
bug_summary: >-
  DEO-1A through DEO-4 and B3.4-B3.6 are closed. The first authorized fresh
  isolated L1-04 run exposed final_request_role_included_refs_drift before CE
  transport; that defect is closed. The authorized same-project retry then
  reached the exact physical-wire gate and exposed physical_wire_max_tokens_drift:
  the frozen request retained 128000 requested tokens while the Engine correctly
  clamped the actual provider config to 16384, but the native route projector
  still used the pre-clamp value. The projector fix is implemented. The final
  broad-gate pass also closed stale Run Ledger fixtures and a Factory repair
  evidence regression that counted authority-free callback diagnostics as
  physical effects. Acceptance run 3 then proved CE context quality but found
  two pre-Provider identity projections: Director used the private TaskRuntime
  row id instead of the canonical external task id, and the PM route probe did
  not carry a first-class transaction turn identity. Both are closed without
  weakening either fail-closed boundary. Exactly one fresh isolated L1-04
  acceptance run was then consumed. Run 4 proved both identity fixes and the
  PM/CE route audit, reached Director, and exposed an empty ToolSpecRegistry
  provenance projection in the exact final request audit. B3.5 correctly
  rejected that request before Provider transport with
  tool_registry_source_mismatch. The producer now reconstructs authoritative
  registry provenance from the exact final Provider tool surface and refuses
  provenance for unknown or incomplete schemas. Run 5 then reached physical
  Director writes and exposed two downstream fact-chain defects: a committed
  TaskRuntime receipt was shadowed by an incomplete result projection, and
  sequential claim/abort CAS values were guessed from the immutable admission
  head after earlier receipt transitions had advanced the shared operation
  stream. Both defects are closed without synthesizing receipts or weakening
  TaskRuntime authority. Focused, Cell-full, Factory, Run Ledger, integration,
  and architecture gates are green. Run 6 then exposed the stale 240-second CE
  portfolio timeout and a causal attribution gap. Broad validation also
  exposed and closed missing physical-attempt stage-claim revalidation,
  restart replay fencing/deadline gaps, and an Artifact Store/Projection/QA
  public import cycle. Factory 1287, Delivery 375, and Artifact Store 4 tests
  are green. Acceptance run 7 consumed that authorization and exposed an
  execution-boundary defect: Factory returned from Director dispatch while the
  TaskRuntime child remained active, then closed the stage role-evidence
  authority before the child reached Provider transport. R11 is now closed:
  Factory carries one absolute execution deadline, Director re-clamps at the
  execution, role-dialogue, and final-request boundaries, and Factory spends
  the unused execution lease before its settlement reserve. Acceptance run 8
  consumed that authorization and reached a real Chief Engineer physical
  Provider request, but the request timed out after 191 seconds before any
  Director dispatch or target-project effect. R12 is closed: roles.runtime now
  honors streamed task commands, Factory CE portfolio calls use the audited
  stream path, task timeout authority reaches provider context, and
  incomplete/error streams fail closed. Run 9 then proved the streamed response
  path but exposed terminal stream metadata loss; R13 now preserves the exact
  final-request audit and snapshot reference. Run 10 proved R13 and exposed a
  fixed 4096-event conservation buffer below the qualified 16384-token physical
  output budget. R14 now scales the event-count budget from the exact qualified
  wire request while retaining the 8 MiB byte cap, a 65536-event hard cap, and
  terminal-before-release zero-leak semantics. Run 11 proved the buffer fix and
  complete CE final-request context, then exposed a 128000-token portfolio
  request competing for a 125-second physical lease plus loss of the first
  timeout cause across stream projections. R15 now scales only Factory CE
  portfolio output to task count under the existing deployment cap, emits a
  typed provider_stream_timeout, suppresses the duplicate materialization
  error, and preserves the first causal error. Run 12 proved the physical CE
  request and coherent 16384-token response, then exposed a streamed terminal
  fact-chain break: terminal Provider metadata and its context snapshot were
  discarded during RawLLMResponse materialization, the stream projected two
  terminal completions, and the CE portfolio lacked an explicit analyze-only
  delivery contract. R16 now conserves terminal metadata through Run Ledger,
  restores the CE analyze-only marker without changing existing materialize or
  propose behavior, and emits one authoritative terminal completion. Broad
  gates and a recaptured stable source snapshot are green. Run 13 proved R16,
  accepted the complete Chief Engineer blueprint portfolio, and reached a real
  Director Provider request. It then exposed a primary write-code request that
  inherited the generic 128000-token execution budget despite only about 46
  seconds remaining on the Factory deadline. R17 now applies the existing
  central 7000-token materialization ceiling to authoritative first-call
  write_code contracts while leaving review calls unchanged. Full Director,
  roles/adapters, Factory, budget-policy, static, and structural gates are
  green. Run 14 then reached another fully audited Chief Engineer Provider
  stream and exposed a cross-layer deadline reset: response-body consumption
  outlived the declared 193-second Provider timeout, then Role StreamEngine
  replayed the already-timed-out request under a fresh timeout budget. R18 now
  applies one monotonic absolute deadline across Provider wire retries,
  response consumption, custom handlers, retry backoff, and resource cleanup;
  the role layer treats the consumed provider_stream_timeout as terminal while
  preserving transient network and 429 reconnects. Run 15 proved R18 admitted
  exactly one physical request and that the Provider durably completed, then
  exposed a subtler deadline leak: the timeout context remained armed across
  Factory's post-terminal buffered replay and cancelled the CE consumer task.
  R19 now applies the deadline only while awaiting physical stream data, never
  across outward yields. Run 16 proved that repair, crossed the former
  cancellation window, and exposed a second post-terminal deadline projection:
  KernelOne StreamExecutor rejected Factory's already-completed buffered replay
  against its legacy 300-second wall clock, then the role layer issued a second
  physical request. R20 transfers deadline ownership only for a sidecar with
  both physical stream dispatch and Factory route-authority capabilities;
  arbitrary sidecars and ungoverned streams retain the old fail-closed timeout.
  Run 17 proved R20 with one completed physical stream and exposed a streamed
  output-validation parity gap: malformed CE JSON was projected as successful
  before Factory rejected it. R21 now validates streamed output before
  TaskBoundary, preserves the typed validation failure through roles.runtime,
  and permits exactly one separately claimed, deadline-readmitted CE schema
  repair that preserves the complete physical output and PM authority. Role
  Kernel 4159, Role Runtime 697, Factory Pipeline 1221, and Factory
  characterization 251 tests are green. Exactly one fresh isolated L1-04
  acceptance run was consumed. Run 18 proved the R21 validation/repair path but
  exposed a CE authority-cardinality error before the repair Provider request:
  the repair child attempted to mint a second stage grant although the fixed CE
  cap is one. R22 now reuses the single CE authority across independently
  claimed primary and repair TaskRuntime attempts. The same run exposed stale
  subordinate ContextOS coverage projections after Factory cutoff authority
  replaced heuristic refs; R22A now rebuilds sources, slots, ratio, and context
  quality from the typed cutoff facts. Roles Kernel 4159 and Factory Pipeline
  1221 tests are green. Acceptance run 19 proved the R22 authority reuse and
  reached the separately claimed CE schema-repair Provider request, then
  exposed corrupt-output replay inside the repair instruction. R23 now
  projects bounded structured failure evidence plus only the corrupt output
  digest/size, reconstructs a fresh portfolio from authoritative PM and target
  evidence, and caps repair output at 8192 tokens. Factory Pipeline 1222 tests
  are green. Run 20 proved the R23 repair request hygiene and produced an
  accepted CE portfolio, then exposed a Director dependency projection error:
  the suspended internal CE primary-attempt TaskRuntime row was mixed into the
  PM task DAG and rejected as an unknown active task. The public signal
  mislabeled that typed schedule rejection as deadline exhaustion despite 1210
  seconds remaining for a 1155-second request. R24 now excludes only
  provenance-complete internal CE rows, preserves unknown untrusted rows as
  fail-closed blockers, and reports invalid dependency schedules with their
  real code and blocker evidence. Factory Pipeline 1225 tests are green. The
  post-R24 source snapshot was stable across two independent captures. Run 21
  proved R24, reached a real Director Provider request, and materialized five
  project files. It then exposed a role-evidence source resolver that treated
  the heterogeneous execution.control_plane stream as gate-only and rejected
  valid tool_call_lifecycle and task_boundary_verdict facts. R25 now preserves
  strict whole-stream integrity and source-head validation while projecting
  only gate_evaluated facts into dynamic role-evidence slots. The exact R25
  physical stream replays successfully and Factory Pipeline 1227 tests are
  green. Run 22 (R26) proved R25 and kept every PM/CE final-request evidence
  slot readable and role-correct, but exposed a bounded-output contract break.
  The CE caller requested JSON while both exact physical Kimi requests were
  projected as plain_text with response_format=null and mandatory unbounded
  thinking. The primary consumed exactly 16384 completion tokens before its
  JSON was truncated; the separately claimed repair consumed exactly 8192
  completion tokens, produced only 641 visible characters, and was also
  truncated. Director and QA were therefore never reached. Bench is frozen
  until reasoning budget is carried into the exact physical request, audited,
  and the JSON-output reservation is regression-proven. R26 is now closed: the
  primary portfolio and schema-repair calls carry distinct bounded reasoning
  budgets through Factory, Role Kernel, KernelOne Engine, and the exact
  Anthropic-compatible provider request. Streamed explicit JSON contracts are
  audited as text_json_fallback instead of plain_text, invalid budgets fail
  closed, and standard non-thinking Anthropic routes remain unchanged. Focused
  tests, split Cell suites, static gates, and post-edit CodeGraph review are
  green. The one authorized R27 run was consumed and proved both reasoning
  budgets reached the physical wire. It also exposed cross-instance WebSocket
  contamination: an older R24 page reused the shared local token and connected
  to R27 on a recycled port with a foreign workspace, saturating the WS queue and
  backend CPU. R27 closes that isolation defect with Supervisor-generated
  per-instance tokens plus authoritative workspace rejection. The same run left
  the CE repair non-terminal after the Provider socket reached CLOSE-WAIT, but
  concurrent WS starvation prevents clean attribution. Bench is frozen for R28
  deterministic EOF/cleanup/terminal-fact reproduction; no retry is authorized.
  R28 is now closed. A deterministic half-closed session reproduced the exact
  missing-terminal shape: stream consumption finished, but the response/session
  context cleanup was awaited without a bound before the durable terminal append.
  The gate now bounds cleanup, cancels the stuck cleanup task, emits one typed
  provider_stream_cleanup_timeout failed terminal, releases the physical attempt,
  leaks zero buffered output, and does not retry the non-network failure. Roles
  Kernel 2746, Provider 106, Factory Pipeline 1227, and Engine/Anthropic 324 tests
  are green. The post-R28 source snapshot is identical across two captures.
  The single authorized R29 run was consumed. It proved PM and Chief Engineer,
  reached Director, materialized five Go project files, and passed a real Go
  compile check. It then exposed a private-row/external-task identity mismatch
  when Director projected the deterministic verify command into a deferred
  directed effect. The first task failed with
  deo_deferred_command_request_invalid and downstream tasks were blocked. The
  same run also exposed a queued settlement waiting-barrier idempotency payload
  drift that produced a hot replay-conflict loop. Both R29 roots are now closed:
  the deferred command boundary normalizes only the exact bound private row id
  to its external task id, and settlement reuses an open-barrier pending fact
  while allocating retry identities per claim. Roles Adapter 1263, settlement
  consumer/runtime 82, and Factory Pipeline 1229 tests are green; static and
  post-edit structural review are green. A twice-identical post-R29 source
  snapshot authorized exactly one fresh isolated L1-04 R30 run. R30 exposed
  transient non-authoritative TaskRuntime readiness being returned as terminal;
  that root is closed and its single R31 authorization was consumed. R31 proved
  PM, Chief Engineer, Director physical writes, and a real Go compile, then
  exposed and closed a Director child-invocation identity collision. The single
  authorized R32 run was consumed. R32 proved a complete Chief Engineer physical
  Provider lifecycle but exposed two downstream roots: Factory replay compared
  the pre-evidence semantic candidate hash to the final qualified semantic
  request hash, and the CE role run did not terminalize after the physical
  terminal fact. R32 then closed dual-semantic replay, R33 closed terminal
  WebSocket policy-rejection reconnect storms, and R34 compacted the exact
  post-terminal Provider replay from 10,088 tiny journal events to bounded
  ordered batches without changing Provider or tool facts. The closing
  pre-bench architecture run exposed R35: Director rewrote a TaskRuntime-owned
  runtime_execution projection for child role calls. R35 now treats that
  projection as read-only and carries parent/child identity only through
  director.role_subinvocation.v1. The complete current-source fact-chain and
  architecture gates are green, authorizing exactly one fresh isolated L1-04.
