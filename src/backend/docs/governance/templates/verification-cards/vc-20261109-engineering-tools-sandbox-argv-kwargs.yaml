card_id: vc-20261109-engineering-tools-sandbox-argv-kwargs
bug_summary: _process passed capture_output_root via a conditional dict unpack, which mypy types as dict[str, Path] and cannot match to the capture_output_root parameter, producing a false arg-type error.
classification: one_off
bug_path:
  file: polaris/cells/roles/runtime/internal/engineering_tools.py
  method: EngineeringCommandRuntime._process
  symptom: mypy Argument 8 incompatible type "**dict[str, Path]"; expected "CommandCacheMount | None"
assumptions:
