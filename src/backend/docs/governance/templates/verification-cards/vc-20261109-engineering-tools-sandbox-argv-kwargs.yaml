    statement: build_workspace_sandbox_argv declares capture_output_root: Path | None = None, so passing it directly is identical to the conditional unpack.
    status: verified
    evidence: kernelone/process/sandbox.py:190 signature; builder branches on capture_output_root is not None
  - id: A2
