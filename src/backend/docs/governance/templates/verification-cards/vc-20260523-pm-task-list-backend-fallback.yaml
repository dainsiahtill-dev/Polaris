card_id: "vc-20260523-pm-task-list-backend-fallback"
bug_summary: >
  PM desktop task board and task metrics used only runtime snapshot task props
  and ignored available backend PM task registry rows from /v2/pm/tasks.

classification: pattern

bug_path:
  file: "src/frontend/src/app/components/pm/PMWorkspace.tsx"
  method: "PM task evidence aggregation"
  symptom: >
    When realtime PM task rows were absent, the PM workspace could show an empty
    task board, zero progress, zero analytics, and zero dialogue task context
    even though /v2/pm/tasks had auditable backend rows.

assumptions:
  - id: "A1"
    statement: "The backend already exposes PM task list/detail routes."
    status: verified_true
    evidence: >
      pm_management.py exposes /v2/pm/tasks and /v2/pm/tasks/{task_id}.

  - id: "A2"
    statement: "The desktop service layer lacked PM task list/detail wrappers."
    status: verified_true
    evidence: >
      pmService had search/history functions, but no listPmTasks or getPmTask
      wrapper before this change.

  - id: "A3"
    statement: "Runtime task rows must remain authoritative when both sources share an id."
    status: verified_true
    evidence: >
      The merge order inserts backend rows first and then runtime rows by task id.

pre_mortem:
  likely_wrong_fix: >
    Replacing runtime snapshot tasks with backend rows would drop volatile live
    execution state from the desktop.
  guardrail: >
    Merge backend rows only as fallback evidence and keep runtime rows as the
    final writer for duplicate task ids.

