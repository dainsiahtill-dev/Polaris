card_id: vc-20260722-factory-r14-stream-buffer-budget
classification: physical_attempt_conservation
status: complete
bench_status: closed
bug_summary: >-
  The tenth authorized fresh isolated L1-04 run proved R13: streamed CE
  terminal metadata reached Factory and the prior final-request audit failure
  disappeared. The real CE Provider stream then failed inside the physical
  attempt conservation gate with factory_provider_stream_buffer_limit_exceeded.
  The fixed 4096-event limit was lower than the exact qualified physical output
  budget of 16384 tokens, so a legitimate long structured stream was rejected
  before its terminal fact could authorize release upstream.
