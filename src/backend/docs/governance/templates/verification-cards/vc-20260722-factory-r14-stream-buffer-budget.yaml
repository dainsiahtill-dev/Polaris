root_cause:
  code: qualified_stream_budget_below_physical_output_budget
  summary: >-
    FinalProviderAttemptGate buffers every raw structured Provider stream item
    until response closure and durable terminal acknowledgement, but capped all
    requests at 4096 events regardless of their already-qualified physical
    max_tokens. Kimi's Anthropic-compatible 16384-token response can emit more
    than 4096 structured deltas without violating its request contract.
  fix: >-
    Derive a bounded event-count budget from the exact qualified physical
    max_tokens/max_output_tokens while retaining the independent 8 MiB byte cap,
    a strict global event hard cap, durable terminal-before-release ordering,
    and zero leakage on every failure path.
