root_cause:
  code: stream_output_validation_parity_and_bounded_repair_gap
  summary: >-
    Non-streaming Role Kernel execution validated role output before returning,
    but StreamEventProjector always emitted a complete RoleTurnResult with
    structured_output=null and appended TaskBoundary first. roles.runtime also
    collapsed typed stream errors to role_runtime_error. Factory consequently
    learned about malformed CE JSON only in a later local check, after the
    execution boundary had already claimed success, and could neither consume a
    typed validation failure nor safely retry within remaining downstream
    budgets.
  fix: >-
    Extract one shared output validator for streaming/non-streaming paths. For
    streams with no higher-priority dropped-dispatch lifecycle failure, validate
    the final physical content before TaskBoundary and project typed
    output_validation_failed plus complete validation evidence. Preserve that
    error code through roles.runtime. Factory consumes only that typed failure,
    suspends the invalid primary TaskRuntime attempt, re-runs deadline admission,
    and issues at most one CE-only JSON repair through a separate TaskRuntime
    claim/lease/final Provider request. The repair prompt preserves the complete
    physical output and PM task/scope authority; no local regex mutation or
    target-project edit is allowed.
