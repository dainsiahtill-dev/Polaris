bug_summary: >-
  The seventeenth authorized fresh isolated L1-04 run proved R20: one qualified
  Chief Engineer Provider stream crossed the old 300-second replay timeout and
  completed without duplicate transport. The physical response contained a
  semantically complete portfolio but invalid JSON (an unquoted placeholder
  fragment plus duplicated trailing content). The streaming Role Kernel did
  not run the same output validation as its non-streaming path and projected a
  successful RoleTurnResult/TaskBoundary before Factory later rejected the
  payload. Factory had no bounded, deadline-aware repair path, so the run ended
  at chief_engineer_review after 586.4 seconds.
