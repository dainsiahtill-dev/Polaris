bug_summary: >-
  The ninth authorized fresh isolated L1-04 run proved R12: the streamed CE
  Provider call completed and produced a blueprint artifact within 183.5
  seconds. roles.runtime accumulated final_request_context_audit and
  context_snapshot_ref from terminal stream event metadata, but discarded that
  metadata when a RoleTurnResult was present. Factory correctly failed closed
  with chief_engineer.final_request_audit_missing before Director transport.
