root_cause:
  code: stream_terminal_metadata_projection_dropped
  summary: >-
    RoleRuntimeService.execute_role_task merged event metadata into
    stream_metadata, but the complete-event branch converted only the nested
    RoleTurnResult through _to_contract_result. The terminal event's audited
    final-request metadata never reached RoleExecutionResultV1.
  fix: >-
    Merge accumulated terminal stream metadata into the contract result after
    canonical RoleTurnResult projection. This preserves structured output,
    status, usage, artifacts, errors and turn history while restoring the exact
    audited context_snapshot_ref and final_request_context_audit. Error and
    incomplete-stream branches remain fail closed; non-stream execution is
    unchanged.
