    expected: "Success: no issues found"
  - command: "pytest src/backend/polaris/tests/integration/delivery/routers/test_role_chat_router.py src/backend/polaris/tests/unit/delivery/http/routers/test_role_chat.py -v"
    expected: "All tests pass"
  - command: "npm test -- AIDialoguePanel.test.tsx useAIDialogue.test.ts ChiefEngineerWorkspace.test.tsx llmService.test.ts"
