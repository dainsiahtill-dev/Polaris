  category: "Director Execution / Bench Session"
  symptom: "Trusted PM contracts and Chief Engineer blueprints could not be reused efficiently; reruns restarted PM/CE and could recreate project directories."
  physical_error: "Factory start_from=director normalized to pm; bench work_dir guard allowed repository-root runs that created root L1-01 before quarantine."
fix:
