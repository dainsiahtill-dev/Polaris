    - "Do not regenerate PM contracts or Chief Engineer blueprints during Director-only resume."
    - "Do not modify generated target project code inside the Polaris repository."
    - "Fail closed when trusted resume evidence is missing."
    - "Restore the pre-Director workspace snapshot before Director-only dispatch."
