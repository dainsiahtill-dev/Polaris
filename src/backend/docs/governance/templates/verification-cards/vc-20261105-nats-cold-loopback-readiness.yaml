card_id: vc-20261105-nats-cold-loopback-readiness
bug_summary: Cold loopback connect timeout exhausts startup budget before canonical shared NATS admission.
classification: pattern
bug_path:
  file: polaris/infrastructure/messaging/nats/server_runtime.py
  method: ensure_local_nats_runtime / _observe_existing_endpoint / _probe_nats_endpoint
  symptom: startup_deadline_exceeded on a free local port
assumptions:
  - id: A1
    statement: The initial readiness probe can consume the entire deadline before coordinator entry.
    status: verified
    evidence: CodeGraph CLI source and three RED native regressions confirmed deadline exhaustion.
  - id: A2
    statement: Timeout is not ownership proof; real exclusive bind availability only permits canonical admission.
    status: verified
    evidence: shared_service_runtime._ensure retains writer, process and store identity fences.
  - id: A3
    statement: Existing slow listeners need the original INFO readiness budget.
    status: verified
    evidence: test_slow_existing_greeting_uses_remaining_startup_budget
pre_mortem:
  failure_point: Treating a silent existing listener as absent, or capping INFO rather than only connect.
  risk_zone:
    - native socket family and exclusive bind
    - autostart credentials and policy
    - shared writer and store incarnation admission
verification_plan:
  unit_tests:
    - file: polaris/tests/test_nats_cold_loopback.py
      description: Native cold startup, occupied socket, slow INFO, policy and incarnation fences.
      expected: Cold bindable endpoint starts through canonical coordinator; all protected paths stay closed.
      status: passed
  integration_tests:
    - description: Existing native shared lifecycle and startup regressions
      command: rtk proxy python -m pytest -q src/backend/polaris/tests/test_managed_nats_startup.py src/backend/polaris/tests/test_shared_nats_lifecycle.py src/backend/polaris/tests/test_nats_cold_loopback.py
      status: passed
  manual_check:
    - Current shared service and production endpoints remain untouched.
