pre_mortem:
  - risk: The UI could make accidental destructive file deletion too easy.
    mitigation: Default delete_file to false and require an explicit checkbox for backing file deletion.
  - risk: The deleted document could remain selected after the backend succeeds.
    mitigation: Clear the selected document, content, versions, diff, and refresh the tree after success.
  - risk: Path encoding could mismatch existing document routes.
    mitigation: Reuse the existing encodeDocumentPath helper in pmDocumentService.
