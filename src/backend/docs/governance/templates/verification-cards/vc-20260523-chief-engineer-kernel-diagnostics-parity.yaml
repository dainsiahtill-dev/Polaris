card_id: "vc-20260523-chief-engineer-kernel-diagnostics-parity"
bug_summary: >
  Chief Engineer desktop lacked PM/Director parity for role-kernel cache,
  token-budget, and role-scoped LLM diagnostics.

classification: pattern

bug_path:
  file: "src/backend/polaris/delivery/http/v2/chief_engineer.py"
  method: "Chief Engineer role-kernel diagnostics routes"
  symptom: >
    PM and Director expose role-scoped kernel diagnostics, but Chief Engineer
    desktop could only read generic role LLM events and had no cache/token
    evidence or cache clear result.

assumptions:
  - id: "A1"
    statement: "PM and Director already expose role-kernel diagnostics routes."
    status: verified_true
    evidence: >
      pm.py and director.py expose /llm-events, /cache-stats, /cache-clear, and
      /token-budget-stats routes with backend tests.

  - id: "A2"
    statement: "Chief Engineer may reuse the shared roles-kernel global cache, event emitter, and token budget."
    status: verified_true
    evidence: >
      The execution_governance_pipeline includes roles.kernel as shared
      execution infrastructure and chief_engineer.blueprint allows
      llm.invoke:chief_engineer/* effects.

  - id: "A3"
    statement: "The desktop should show evidence without inventing fallback data."
    status: verified_true
    evidence: >
      Existing role desktops render backend errors as evidence and avoid
      example data when real backend calls fail.

pre_mortem:
  likely_wrong_fix: >
    Continuing to use only /v2/role/chief_engineer/llm-events would keep cache
    and token-budget diagnostics unavailable from the Chief Engineer role route.
  guardrail: >
    Add Chief Engineer role routes and route the frontend typed role-kernel
    service to /v2/chief-engineer before rendering desktop evidence.

