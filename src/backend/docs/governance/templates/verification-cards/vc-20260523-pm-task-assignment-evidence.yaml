card_id: "vc-20260523-pm-task-assignment-evidence"
bug_summary: >
  PM desktop task detail did not expose assignment history from
  /v2/pm/tasks/{task_id}/assignments even though the backend route exists.

classification: pattern

bug_path:
  file: "src/frontend/src/app/components/pm/PMTaskPanel.tsx"
  method: "selected task assignment evidence"
  symptom: >
    A selected PM task showed contract and task-detail evidence, but omitted
    assignment/worker handoff history recorded by the PM management backend.

assumptions:
  - id: "A1"
    statement: "The backend already exposes a PM task assignment route."
    status: verified_true
    evidence: >
      pm_management.py exposes /v2/pm/tasks/{task_id}/assignments and existing
      PM management v2 tests cover the route.

  - id: "A2"
    statement: "The PM service layer lacks a typed assignment wrapper."
    status: verified_true
    evidence: >
      pmService exposes task list/detail/history/search wrappers but no
      listPmTaskAssignments wrapper.

  - id: "A3"
    statement: "Assignment evidence must not become a writable PM task source."
    status: verified_true
    evidence: >
      The intended panel only reads and renders assignment rows; task state
      remains owned by the existing PM task registry.

pre_mortem:
  likely_wrong_fix: >
    Merging assignment rows into the task list would confuse task contracts with
    assignment events and distort PM task counts.
  guardrail: >
    Keep assignment rows in a separate detail-only evidence section.

verification_plan:
  - command: "npm run test -- PMTaskPanel pmService"
    expected: "PM task panel and PM service tests pass"
  - command: "npm run typecheck"
    expected: "TypeScript typecheck passes"
