root_cause:
  code: isolated_instances_reused_shared_token_and_ws_query_overrode_binding
  summary: >-
    InstanceSupervisor already generated secure per-instance tokens when a
    request omitted token, but Factory Bench always supplied its shared backend
    token. The WebSocket endpoint then accepted an authenticated query workspace
    without comparing it to the process-bound settings workspace. Port reuse let
    a stale page become an authenticated cross-instance observer and self-DoS
    the new backend.
  fix: >-
    Factory Bench no longer supplies the shared token to isolated launch
    requests and requires the Supervisor-returned token for health and all
    project-scoped HTTP/WS operations. /v2/ws/runtime resolves the process-bound
    settings workspace as authority and rejects any explicit foreign workspace
    with close code 1008 before creating subscriptions. The generated token is
    still propagated by InstanceSupervisor into backend, frontend, and registry.
