card_id: vc-20260722-factory-r27-cross-instance-ws-isolation
classification: multi_instance_runtime_isolation
status: closed
bench_status: not_schedulable
bug_summary: >-
  R27 proved that the R26 reasoning budget reached both physical Kimi requests,
  but the run was contaminated by an older R24 browser page reconnecting to the
  reused 49978 port. Factory Bench had copied the shared main token
  polaris-local-dev into every isolated instance, and /v2/ws/runtime preferred
  the query workspace over the backend's bound settings workspace. The R27
  backend therefore accepted the stale page, repeatedly filled its JetStream WS
  queue, logged keepalive failures, and consumed about 93 percent CPU while the
  Chief Engineer repair remained non-terminal.
