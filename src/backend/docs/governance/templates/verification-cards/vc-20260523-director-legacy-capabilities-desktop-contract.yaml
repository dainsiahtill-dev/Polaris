pre_mortem:
  - risk: Fixing only the backend route could leave the desktop panel showing valid maps as offline.
    mitigation: Normalize array and host-scoped map payloads before status/detail rendering.
  - risk: Changing the deprecated route could drift from the canonical v2 route.
    mitigation: Return the same ok/role/capabilities envelope as the v2 route.
  - risk: The existing skipped integration test could keep hiding the regression.
    mitigation: Replace the skip with concrete response assertions.
