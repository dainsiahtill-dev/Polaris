card_id: "vc-20260523-runtime-active-workspace-path"
bug_summary: >
  Runtime desktop support routes can inspect or mutate stale settings.workspace
  instead of the active Electron workspace_path selected for PM and Director
  workflows.

classification: pattern

bug_path:
  file: "polaris/delivery/http/routers/runtime.py and polaris/delivery/http/v2/runtime_diagnostics.py"
  method: "storage layout / clear / migration status / reset tasks / diagnostics"
  symptom: >
    Desktop storage preflight, runtime clear/reset, and diagnostics can report
    or modify runtime state for the Polaris repo while the UI is working on a
    target project workspace.

assumptions:
  - id: "A1"
    statement: "Desktop PM/Director support flows use runtime storage, clear, reset, and diagnostics routes."
    status: verified_true
    evidence: >
      runtimeService.clearDialogue uses /v2/runtime/clear and
      RuntimeDiagnosticsWorkspace fetches /v2/runtime/diagnostics; root
      AGENTS preflight requires /runtime/storage-layout.

  - id: "A2"
    statement: "settings.workspace_path is the active Electron target workspace when populated."
    status: verified_true
    evidence: >
      Existing PM, Chief Engineer, RoleChat, RoleSession, and PM management
      contracts all now prefer workspace_path over workspace.

pre_mortem:
  likely_wrong_fix: >
    Updating only diagnostics would leave reset/clear/storage-layout mutating
    stale runtime state.
  guardrail: >
    Use one shared delivery helper for active workspace resolution and assert
    each runtime helper receives workspace_path when workspace is stale.

