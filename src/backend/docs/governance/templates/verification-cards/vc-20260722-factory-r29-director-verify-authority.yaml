card_id: vc-20260722-factory-r29-director-verify-authority
classification: execution_fact_chain
status: closed
bench_status: authorization_consumed_by_r30
bug_summary: >-
  The single authorized R29 isolated L1-04 run proved PM and Chief Engineer
  final requests, reached Director, materialized five Go project files, and
  passed a real Go compile gate. Director then failed the first PM task because
  the deterministic step verify could not construct a deferred command request:
  the adapter supplied TaskRuntime's private row id "1" while the exact
  execution-attempt authority binds external_task_id "TASK-1". The public
  DeferredDirectorCommandRequestV1 correctly rejects that mixed identity as
  deo_deferred_command_request_invalid. The failed first task then blocked the
  remaining entrypoint/test/documentation tasks, so QA never ran and the run
  could not reach COMPLETED_VERIFIED.
