primary_root_cause:
  code: deferred_command_internal_external_task_identity_mismatch
  owner: roles.adapters.director_runtime_repair_tool_adapter
  exact_boundary: create_deferred_director_command_request
  current_behavior: private_row_id_is_passed_as_external_task_id
  required_behavior: >-
    Accept either the exact bound external_task_id or the exact decimal private
    TaskRuntime row id and normalize only the latter to external_task_id. Reject
    every other caller value fail-closed; never infer from run/session text.
queued_next_root:
  code: settlement_waiting_barrier_idempotency_payload_drift
  owner: factory.pipeline.settlement_consumer
  evidence:
    wake_replay_failures: 609
    idempotency_conflict_occurrences: 1828
    event_key: >-
      factory-settlement:40588cb1856fd801546c4b91993dd4e0958ae4165274796c0c5b5cb8a31fa5d9:pending:waiting_barrier
    symptom: >-
      The same pending waiting_barrier key was replayed with an evolving source
      snapshot payload, creating a hot idempotency-conflict loop and high CPU.
  scheduling: closed_before_r30
resolution:
  primary_root: >-
    The deferred command adapter now accepts only the execution attempt's
    exact external task id or exact decimal private TaskRuntime row id. The
    latter is normalized to the bound external id before the typed request is
    created; every other caller value remains fail-closed.
  settlement_root: >-
    Every wake still re-queries the live Run Ledger barrier. While the barrier
    remains open, an existing waiting_barrier journal fact is reused instead
    of appending evolving payload under a stable idempotency key. Retryable
    apply outcomes now use claim-scoped idempotency identities, while fencing,
    barrier-release, and true payload-drift checks remain fail-closed.
