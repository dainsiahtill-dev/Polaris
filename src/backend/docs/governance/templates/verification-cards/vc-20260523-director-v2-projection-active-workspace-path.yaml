card_id: "vc-20260523-director-v2-projection-active-workspace-path"
bug_summary: >
  Director v2 projection-backed status/task routes and Director service
  dependency binding were not using the shared active desktop workspace
  resolver, leaving PM/Director desktop routes with separate workspace-selection
  implementations.

classification: pattern

bug_path:
  file: "polaris/delivery/http/v2/director.py"
  method: "status / list_tasks projection / task detail projection fallback / get_director_service"
  symptom: >
    Director desktop status, task board, detail fallback, or service rebinding
    can drift from the workspace resolution contract used by PM, Chief Engineer,
    role sessions, runtime, and LLM provider routes.

assumptions:
  - id: "A1"
    statement: "Director desktop status and task panels use v2 Director projection-backed routes."
    status: verified_true
    evidence: >
      pmService.getDirectorStatus calls /v2/director/status?source=auto and
      listDirectorTasks defaults to /v2/director/tasks?source=auto.

  - id: "A2"
    statement: "settings.workspace_path is the active Electron target workspace when populated."
    status: verified_true
    evidence: >
      Existing PM, Chief Engineer, RoleChat, RoleSession, Runtime, and
      LLM/provider active-workspace contracts now prefer workspace_path over
      workspace.

pre_mortem:
  likely_wrong_fix: >
    Updating only task listing would leave status and task detail fallback
    reading a different projection workspace.
  guardrail: >
    Use the shared active_workspace_value helper and assert every projection
    build in Director status/list/detail fallback receives workspace_path when
    workspace is stale, and assert Director dependency rebinding does not use
    the stale workspace.

