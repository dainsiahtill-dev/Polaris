pre_mortem:
  likely_failure_modes:
    - Public contract exported from service but not lazy public package.
    - Virtual lobe language accidentally claiming a current role profile.
    - Graph catalog not updated for new query/result types.
    - Chat-completions wrapper claims multi-lobe execution when only single_turn has run.
    - Delivery route bypasses roles.runtime or silently accepts unknown execution modes.
    - Cognitive ledger falls back to prose-only communication instead of structured handoff keys.
    - Failure signals are accepted but do not map to a lobe takeover directive.
    - Failure evidence is accepted but never checked against the takeover directive evidence keys.
    - Runtime audit marks planned bridge assets as wired without production entrypoints.
    - Runtime audit accepts a missing workspace runtime path as verified.
    - lobe_chain passes prior lobe outputs as chat history instead of structured handoff context.
    - Hippocampus lobe names Akashic memory but never calls the existing MemoryManager.
    - Aggregate execution passes the raw objective as role user_message and bypasses the structured lobe-turn envelope.
    - ContextOS attention/phase/predictive capability is counted as wired without an actual runtime pack.
    - Task Market is listed in lobe plans but no runtime projection is captured during execution.
    - Knowledge Distiller retrieves prior knowledge but never distills lobe results into reusable knowledge.
    - Descriptor/Context/Verify Pack and graph retrieval are counted as wired without context governance pack evidence.
    - Aggregate runtime audit is green but no stateful lobe_chain test proves all 16 technology ids and packs are present in one execution.
    - HTTP route tests only mock the aggregate service and never prove the delivery boundary can reach the stateful lobe_chain runtime path.
    - Aggregate runtime evidence exists only in tests and cannot be exported as a repeatable operator-facing JSON audit package.
