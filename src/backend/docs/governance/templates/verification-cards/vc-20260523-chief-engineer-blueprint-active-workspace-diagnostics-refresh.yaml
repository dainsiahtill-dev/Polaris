card_id: "vc-20260523-chief-engineer-blueprint-active-workspace-diagnostics-refresh"
bug_summary: >
  Chief Engineer blueprint command/status routes lacked active workspace
  regression coverage, and the desktop diagnostics panel could remain stale
  after a successful blueprint generate/status action.

classification: pattern

bug_path:
  file: "polaris/delivery/http/v2/chief_engineer.py and ChiefEngineerWorkspace.tsx"
  method: "generate_chief_engineer_blueprint / get_chief_engineer_blueprint_status / handleGenerateBlueprint / handleCheckBlueprintStatus"
  symptom: >
    Desktop users could see a newly generated or discovered Chief Engineer
    blueprint while the diagnostics panel still reported no blueprint handoff,
    and backend command/query coverage did not guard workspace_path precedence.

assumptions:
  - id: "A1"
    statement: "settings.workspace_path is the active Electron selected workspace when populated."
    status: verified_true
    evidence: >
      PM, Director, runtime, role session/chat, LLM/provider, and existing Chief
      Engineer list/detail contracts all prefer workspace_path before workspace.

  - id: "A2"
    statement: "Generating or finding a blueprint changes the evidence shown by the CE workbench."
    status: verified_true
    evidence: >
      ChiefEngineerWorkspace adds a runtime blueprint summary after
      generateChiefEngineerBlueprint or getChiefEngineerBlueprintStatus returns
      a blueprint_id.

pre_mortem:
  likely_wrong_fix: >
    Updating only the visible blueprint list would leave diagnostics and
    Director handoff readiness stale, while changing backend routes inline would
    preserve another workspace resolver fork.
  guardrail: >
    Reuse the shared active_workspace_value helper in the route and refresh
    diagnostics after successful generate/status actions.

