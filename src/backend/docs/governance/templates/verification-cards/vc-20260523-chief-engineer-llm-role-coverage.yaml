card_id: "vc-20260523-chief-engineer-llm-role-coverage"
bug_summary: >
  Chief Engineer is a desktop role workspace but is missing from several LLM
  default/config/runtime role lists.

classification: pattern

bug_path:
  file: "backend LLM config/runtime status and frontend LLM canonical state"
  method: "hard-coded role arrays"
  symptom: >
    Chief Engineer can be visible in role workspaces and visual graph surfaces
    but absent from default LLM config, runtime status, and frontend canonical
    assignment state.

assumptions:
  - id: "A1"
    statement: "Chief Engineer is a first-class supported role."
    status: verified_true
    evidence: >
      RoleChat tests, role router tests, visual role types, CE workspace, and
      graph assets all reference chief_engineer.

  - id: "A2"
    statement: "Default LLM config should expose every desktop role that needs LLM configuration."
    status: verified_true
    evidence: >
      LLM settings and runtime status are the desktop surfaces used to assign
      providers/models and inspect role runtime readiness.

pre_mortem:
  likely_wrong_fix: >
    Adding Chief Engineer only to the frontend would still leave new/default
    backend configs without a CE role binding.
  guardrail: >
    Update backend defaults, backend runtime status, frontend canonical state,
    and visual validation together with targeted tests.

