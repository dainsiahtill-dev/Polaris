assumption_register:
  - id: "A1"
    claim: "Director mutation and receipt settlement work in r51."
    evidence: >-
      Live receipts have unequal before/after hashes, authoritative durable
      effect receipts, RECEIPT_COMMITTED settlement, and a real go test rerun.
  - id: "A2"
    claim: "The repair model cannot see the failing source line."
    evidence: >-
      The initial target context keeps only the first 4000 characters and the
      bootstrap follow-up keeps only the first configured character budget;
      main_test.go fails at lines 616 and 618 outside both head excerpts.
  - id: "A3"
    claim: "Selecting a bounded diagnostic-line window is sufficient and safer than increasing token budgets."
    evidence: >-
      The verifier names an exact path and line. A centered window preserves
      the fault and nearby syntax while keeping existing output-token headroom.
pre_mortem:
  most_likely_wrong_fix: >-
    Raising global character budgets would waste tokens and still fail when a
    diagnostic lies beyond the new head cutoff.
  path_matching_risk: >-
    Compiler formats differ. Normalize leading ./ and separators, support
    path:line:column and path(line,column), and fall back to current head
    behavior when no exact path match exists.
  regression_risk: >-
    Existing no-diagnostic bootstrap behavior must remain head-first and
    bounded; a diagnostic for another file must not redirect this receipt.
repair_contract:
  verifier_or_target_project_edits: "forbidden"
  authority_or_scope_expansion: "forbidden"
  exact_path_diagnostic_match_required: true
  bounded_context_required: true
  no_diagnostic_fallback_preserved: true
  utf8_required: true
