pre_mortem:
  - risk: Query encoding could break paths with spaces or slash-like version labels.
    mitigation: Reuse encodeDocumentPath for path segments and URLSearchParams for the version query.
  - risk: Users could edit historical content and overwrite current content.
    mitigation: Force preview mode and disable edit while selectedDocumentVersion is set.
  - risk: The UI could hide which version body is being displayed.
    mitigation: Render explicit `/v2/pm/documents/{path}?version=...` evidence above the content.
