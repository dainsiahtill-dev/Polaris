root_cause:
  code: streamed_terminal_metadata_and_delivery_contract_drift
  summary: >-
    StreamEventHandler received the exact terminal Provider metadata but did
    not copy it into the internal materialization event. RawLLMResponse had no
    metadata field, StreamOrchestrator projected only ContextOS audit data, and
    Run Ledger omitted the snapshot reference from completion evidence. The
    stream path also let final-answer handling emit a completion before the
    orchestrator emitted its authoritative terminal completion. Finally, the
    Factory CE portfolio omitted its explicit analyze-only delivery contract,
    so the response was exposed to write/materialization finalization policy.
  fix: >-
    Preserve terminal metadata from the Provider stream through
    StreamEventHandler, RawLLMResponse, StreamOrchestrator, RoleRuntime, and Run
    Ledger completion evidence. Restore an explicit analyze_only marker after
    ContextOS projection for Factory CE while retaining the canonical existing
    materialize marker and no-marker propose behavior. Suppress the inner
    completion callback only on the stream path so exactly one authoritative
    terminal event is emitted; failed finalization remains failed and keeps its
    causal error.
