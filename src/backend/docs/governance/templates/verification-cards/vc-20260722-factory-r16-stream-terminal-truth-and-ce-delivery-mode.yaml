bug_summary: >-
  The twelfth authorized fresh isolated L1-04 run completed a real Chief
  Engineer physical Provider request and returned a coherent three-task Go
  blueprint under the task-scaled 16384-token budget. The streamed terminal
  event retained the exact Provider audit, but roles.kernel discarded its
  metadata while materializing RawLLMResponse, projected a second terminal
  completion, and classified the CE portfolio prompt as a materialization
  request. Factory therefore rejected the successful response as
  chief_engineer.final_request_audit_missing and accepted zero blueprints.
