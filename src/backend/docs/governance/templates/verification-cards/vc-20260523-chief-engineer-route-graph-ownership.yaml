card_id: "vc-20260523-chief-engineer-route-graph-ownership"
bug_summary: >
  The active Chief Engineer v2 desktop route was not declared in the graph
  catalog or cell manifest, and the cell manifest omitted its runtime/blueprints
  state/effect declaration.

classification: structural

bug_path:
  file: "docs/graph/catalog/cells.yaml and polaris/cells/chief_engineer/blueprint/cell.yaml"
  method: "chief_engineer.blueprint ownership declaration"
  symptom: >
    PM and Director desktop v2 routes had explicit graph ownership while the
    Chief Engineer desktop route remained outside the declared cell boundary.

assumptions:
  - id: "A1"
    statement: "polaris/delivery/http/v2/chief_engineer.py is the active Chief Engineer desktop backend route."
    status: verified_true
    evidence: >
      frontend chiefEngineerService calls /v2/chief-engineer/* and the v2 router
      mounts chief_engineer.py; route tests exercise diagnostics, list,
      generate, status, and detail endpoints.

  - id: "A2"
    statement: "Chief Engineer blueprint persistence writes runtime/blueprints/*.json."
    status: verified_true
    evidence: >
      BlueprintPersistence stores blueprints under {workspace}/runtime/blueprints
      and the route returns blueprint_path values in runtime/blueprints.

  - id: "A3"
    statement: "PM and Director v2 desktop routes are graph-owned by their role cells."
    status: verified_true
    evidence: >
      cells.yaml declares polaris/delivery/http/v2/pm.py under
      orchestration.pm_planning and polaris/delivery/http/v2/director.py under
      director.execution.

pre_mortem:
  likely_wrong_fix: >
    Registering the route only in docs/graph/catalog/cells.yaml would leave the
    cell manifest stale and weaken generated context for future agents.
  guardrail: >
    Update both the catalog and cell.yaml, and add a governance regression test
    that asserts the route module/path and runtime/blueprints state/effect are
    declared.

