root_cause:
  code: role_task_stream_flag_ignored
  summary: >-
    ExecuteRoleTaskCommandV1 exposed a stream flag, but
    RoleRuntimeService.execute_role_task always called kernel.run. The real CE
    request therefore used one blocking requests.post with a 191-second
    request timeout instead of the existing audited streaming provider path.
  fix: >-
    Project command timeout into request context; dispatch streamed task
    commands through kernel.run_stream; preserve final RoleTurnResult and
    final-request metadata on complete/error; fail closed on exceptions or a
    stream ending without a terminal event; enable stream only for Factory CE
    portfolio commands.
  forbidden_shortcuts_preserved:
    timeout_increase: false
    deterministic_ce_fallback: false
    target_project_edit: false
