card_id: vc-20260722-factory-r12-ce-physical-timeout
classification: runtime_authority
status: complete
bench_status: closed
bug_summary: >-
  The eighth authorized fresh isolated L1-04 acceptance run reached the real
  Chief Engineer physical Provider request with a fresh isolated backend and a
  valid PM contract. The first CE portfolio request timed out at 191 seconds;
  zero of three blueprints were accepted, Director and QA were not reached, and
  no target-project effect occurred. The exact final request and deadline
  derivation were valid, but roles.runtime ignored
  ExecuteRoleTaskCommandV1.stream and always used the blocking kernel.run path.
  Factory now requests the existing audited stream path for CE portfolio calls,
  task timeout authority is projected into the request context, complete/error
  evidence is preserved, and a stream without a terminal event fails closed.
  No timeout was inflated and no deterministic CE fallback was restored.
