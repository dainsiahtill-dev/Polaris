  - id: "DEBT-20260620-runtime-realtime-single-rail"
    title: "Runtime realtime transport must remain Nats-JetStream single rail"
    classification: structural
    status: retired
    severity: high
    scope_refs:
      - "delivery.api_gateway"
      - "runtime.projection"
      - "events.fact_stream"
      - "polaris/delivery/ws/endpoints/websocket_loop.py"
      - "polaris/infrastructure/log_pipeline/writer.py"
      - "polaris/kernelone/events/file_event_broadcaster.py"
    summary: >
      Product realtime previously had multiple implicit rails: runtime.v2
      JetStream, process-local fanout, signal-hub file watchers, startup
      journal snapshots, and historical SSE language. The runtime delivery
      path is now guarded as Nats-JetStream -> /v2/ws/runtime only.
    root_cause: >
      Realtime semantics were spread across WebSocket delivery, log writing,
      file-edit broadcasting, and workflow/process status writers. This allowed
      polling/watch/fanout mechanisms to survive after runtime.v2 JetStream was
      introduced.
