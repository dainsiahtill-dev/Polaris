  - id: "DEBT-20260325-roles-kernel-turn-stage-contract"
    title: "roles.kernel turn semantic stages remain runtime-enforced"
    classification: structural
    status: monitoring
    severity: high
    scope_refs:
      - "roles.kernel"
      - "polaris/cells/roles/kernel/internal/turn_engine.py"
    summary: >
      roles.kernel now separates raw_content, clean_content, and native_tool_calls
      through AssistantTurnArtifacts, but the parser/transcript contract is still
      enforced by runtime conventions rather than compile-time types.
    root_cause: >
      The original turn engine passed ambiguous strings between parsing, UI output,
      and transcript persistence. That allowed [TOOL_CALL] wrappers to leak into
      session history and broke fallback parsing when sanitized text was reused.
    trigger_conditions:
      - "Changing turn_engine run() or run_stream() content handling"
      - "Changing transcript append behavior or sanitizer logic"
      - "Changing tool-call parsing fallbacks when native_tool_calls are absent"
    mitigations:
      - "AssistantTurnArtifacts makes raw/sanitized/native data explicit"
      - "2026-07-02: AssistantRawContent and AssistantCleanContent typed stages added; parse_execution_tool_calls now requires AssistantRawContent while parse_tool_calls remains a compatibility wrapper"
      - "2026-07-02: IOutputParser service protocol now exposes only parse_execution_tool_calls with AssistantRawContent, keeping the str-based parse_tool_calls wrapper out of dependency-injected execution contracts"
      - "Semantic stage regression tests protect parser and transcript boundaries"
      - "verify.pack.json records current guarantees and residual risks"
    residual_risks:
      - "The concrete OutputParser legacy compatibility parse_tool_calls API still accepts str and wraps it into AssistantRawContent; tests must keep proving execution contracts use typed parse_execution_tool_calls"
      - "Downstream stream consumers can still regress if they reintroduce wrapper-bearing chunk contracts"
    linked_assets:
      adrs:
        - "docs/governance/decisions/adr-0042-turn-engine-triple-responsibility.md"
        - "docs/governance/decisions/adr-0043-structural-bug-governance-loop.md"
      verification_cards:
        - "docs/governance/templates/verification-cards/vc-20260325-turn-engine-tool-loop.yaml"
      verify_packs:
        - "polaris/cells/roles/kernel/generated/verify.pack.json"
      tests:
        - "polaris/cells/roles/kernel/tests/test_turn_engine_semantic_stages.py"
        - "polaris/cells/roles/kernel/tests/test_turn_engine_policy_convergence.py"
        - "polaris/cells/roles/kernel/tests/test_kernel_stream_tool_loop.py"
    next_actions:
      - "Keep compatibility parse_tool_calls out of execution authorization paths"
      - "Extend transcript/write-path audits to host adapters that persist assistant chunks"

  - id: "DEBT-20260325-kernelone-llm-reexport-parity"
    title: "KernelOne llm shared contract re-export chain can drift"
    classification: structural
    status: monitoring
    severity: high
    scope_refs:
      - "polaris/kernelone/llm/shared_contracts.py"
      - "polaris/kernelone/llm/engine/contracts.py"
      - "polaris/kernelone/llm/engine/executor.py"
    summary: >
      StreamEventType lives in shared_contracts and is re-exported through engine
      contracts before executor imports it. The architectural risk is reduced by
      parity tests, but the re-export layer still requires disciplined maintenance.
    root_cause: >
      Consumers relied on a manual re-export chain without an automated parity gate.
      One missing import in executor.py was enough to crash the runtime at import time.
    trigger_conditions:
      - "Editing StreamEventType or other shared llm contracts"
      - "Editing engine/contracts.py re-exports"
      - "Editing executor.py contract imports or stream event handling"
    mitigations:
      - "Architecture tests now assert StreamEventType identity across source and re-export"
      - "Architecture tests parse executor.py to require importing StreamEventType from contracts"
      - "2026-07-02: parity tests now assert every shared_contracts.__all__ object is re-exported identically through engine.contracts and toolkit.contracts"
      - "2026-07-02: KernelOne LLM engine production files are fenced from importing shared_contracts directly"
      - "2026-07-02: roles.kernel production files are fenced from importing shared_contracts directly and consume LLM shared types through engine.contracts"
      - "2026-07-02: all Polaris production files are fenced from importing shared_contracts directly except the explicit engine/toolkit contract re-export modules"
    residual_risks:
      - "The re-export layer still exists, so parity remains a governance concern"
    linked_assets:
      adrs:
        - "docs/governance/decisions/adr-0042-turn-engine-triple-responsibility.md"
        - "docs/governance/decisions/adr-0043-structural-bug-governance-loop.md"
      verification_cards:
        - "docs/governance/templates/verification-cards/vc-20260325-turn-engine-tool-loop.yaml"
      verify_packs:
        - "polaris/cells/roles/kernel/generated/verify.pack.json"
      tests:
        - "tests/architecture/test_kernelone_llm_contract_reexports.py"
    next_actions:
      - "Prefer canonical source imports for new consumers where re-export is not required"
      - "Extend parity coverage when additional shared contracts are added to the engine surface"

  - id: "DEBT-20260620-runtime-realtime-single-rail"
    title: "Runtime realtime transport must remain Nats-JetStream single rail"
    classification: structural
    status: monitoring
    severity: high
    scope_refs:
      - "delivery.api_gateway"
      - "runtime.projection"
      - "events.fact_stream"
      - "polaris/delivery/ws/endpoints/websocket_loop.py"
      - "polaris/infrastructure/log_pipeline/writer.py"
      - "polaris/kernelone/events/file_event_broadcaster.py"
    summary: >
      Product realtime previously had multiple implicit rails: runtime.v2
      JetStream, process-local fanout, signal-hub file watchers, startup
      journal snapshots, and historical SSE language. The runtime delivery
      path is now guarded as Nats-JetStream -> /v2/ws/runtime only.
    root_cause: >
      Realtime semantics were spread across WebSocket delivery, log writing,
      file-edit broadcasting, and workflow/process status writers. This allowed
      polling/watch/fanout mechanisms to survive after runtime.v2 JetStream was
      introduced.
    trigger_conditions:
      - "Editing polaris/delivery/ws/endpoints/websocket_loop.py or websocket_core.py"
      - "Adding frontend realtime hooks or direct WebSocket/EventSource clients"
      - "Changing log writer, workflow status, process status, or file edit event publication"
      - "Adding an HTTP endpoint that refreshes UI state on a timer"
    mitigations:
      - "ADR-0095 records Nats-JetStream as the only product realtime rail"
      - "test_realtime_single_rail_static_guard.py blocks legacy realtime tokens in product paths"
      - "2026-07-02: static guard realigned with current frontend runtime transport hooks and Nats-JetStream Playwright audit spec naming"
      - "WebSocket tests verify runtime.v2 SUBSCRIBE, explicit EVENT query, and no process-local registration"
      - "Status workflow/process and file-edit producers publish runtime.v2 JetStream envelopes"
    residual_risks:
      - "Full Factory L1-L8 and Playwright page-by-page realtime audit still need to be completed"
      - "Legacy process-local modules remain in isolated infrastructure/tests until a follow-up deletion plan retires them"
      - "Provider SSE parsing still exists for upstream LLM APIs and must not be confused with product SSE transport"
    linked_assets:
      adrs:
        - "docs/governance/decisions/adr-0095-runtime-realtime-single-rail-nats-jetstream.md"
      verification_cards:
        - "docs/governance/templates/verification-cards/vc-20260620-runtime-realtime-single-rail.yaml"
      verify_packs:
        - "polaris/cells/events/fact_stream/generated/verify.pack.json"
      tests:
        - "polaris/tests/test_realtime_single_rail_static_guard.py"
        - "polaris/delivery/tests/test_ws_stream_delivery.py"
        - "polaris/tests/test_runtime_ws_migration.py"
        - "polaris/tests/test_websocket_architecture_integration.py"
    next_actions:
      - "Run Factory L1-L8 after focused backend/frontend realtime tests are green"
      - "Run Playwright audit for Home, Factory, PM, ChiefEngineer, Director, and ContextOS realtime updates"
      - "Plan deletion or archival of process-local realtime infrastructure once no internal tests or adapters depend on it"
