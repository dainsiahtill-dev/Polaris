      - "Editing polaris/delivery/ws/endpoints/websocket_loop.py or websocket_core.py"
      - "Adding frontend realtime hooks or direct WebSocket/EventSource clients"
      - "Changing log writer, workflow status, process status, or file edit event publication"
      - "Adding an HTTP endpoint that refreshes UI state on a timer"
    mitigations:
      - "ADR-0095 records Nats-JetStream as the only product realtime rail"
      - "test_realtime_single_rail_static_guard.py blocks legacy realtime tokens in product paths"
      - "2026-07-02: static guard realigned with current frontend runtime transport hooks and Nats-JetStream Playwright audit spec naming"
      - "2026-07-02: product Python sources are structurally guarded from importing infrastructure.realtime.process_local modules"
      - "2026-07-02: event-stream implementation tokens are structurally allowlisted to upstream LLM provider integrations, not product delivery paths"
      - "2026-07-02: process-local realtime fanout/signal-hub modules and their dedicated legacy tests were removed; fact_stream context pack now points at runtime.v2/Nats-JetStream tests"
      - "2026-07-02: static guard asserts process-local realtime Python modules remain absent"
      - "2026-07-02: static guard asserts the Nats-JetStream Playwright audit covers L1-L8 bench markers and main/Factory/PM/ChiefEngineer/Director/ContextOS surfaces"
      - "WebSocket tests verify runtime.v2 SUBSCRIBE, explicit EVENT query, and no process-local registration"
      - "Status workflow/process and file-edit producers publish runtime.v2 JetStream envelopes"
    residual_risks: []
    linked_assets:
