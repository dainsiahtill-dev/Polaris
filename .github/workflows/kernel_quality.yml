name: Kernel Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: ruff check src/backend/polaris scripts

      - name: Run Ruff Format Check
        run: ruff format --check src/backend/polaris scripts

      - name: Run MyPy Audit
        continue-on-error: true
        run: mypy --strict src/backend/polaris --ignore-missing-imports

      - name: Run Kernel Smoke Tests
        run: |
          pytest -q \
            src/backend/polaris/kernelone/audit/tests/test_context_os_prompt.py \
            src/backend/polaris/cells/roles/kernel/tests/test_stream_handler_audit_metadata.py
