[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polaris"
version = "0.1.0"
description = "Polaris Desktop - AI Agent Governance Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Polaris Team" },
]
keywords = ["ai", "agent", "governance", "electron", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0.0",
    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    # HTTP Clients
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    # Database
    "lancedb>=0.5.0",
    "sqlalchemy>=2.0.0",
    # Vector Search
    "tantivy>=0.11.0",
    # LLM Providers
    "ollama>=0.1.0",
    # B3.4 physical-attempt qualification: Codex SDK transport shape and
    # retry semantics are audited against this exact version.
    "openai==2.41.0",
    "anthropic>=0.18.0",
    # Messaging
    "nats-py>=0.1.0",
    # Code Parsing
    "tree-sitter>=0.20.0",
    "tree-sitter-language-pack>=0.1.0",
    # Testing & Browser
    "playwright>=1.40.0",
    # CLI & UI
    "rich>=13.7.0",
    "textual>=0.52.0",
    "textual-dev>=1.0.0",
    # System & Utils
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
    "platformdirs>=4.0.0",
    "tomli>=2; python_version < '3.11'",
    # Governance Schemas
    "jsonschema>=4.26.0",
    "referencing>=0.35.0",
    "blake3>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
    "types-aiofiles>=23.0.0",
]

[project.scripts]
polaris = "polaris.delivery.server:main"
pm = "polaris.delivery.cli.pm.cli:main"
director = "polaris.delivery.cli.director.cli_thin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/polaris"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/backend",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
# Pytest 配置唯一真相（历史上的根 pytest.ini 已并入此处并删除；勿再建 pytest.ini）。
asyncio_mode = "auto"
testpaths = ["src/backend/polaris"]
pythonpath = ["src/backend"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--import-mode=importlib",
    "-v",
    "--tb=short",
]
norecursedirs = [
    "tmp_pytest_agentic_eval_local",
    ".pytest_tmp*",
    "pytest-cache-files-*",
    ".polaris",
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg-info",
    "src/backend/scripts",
    "src/backend/polaris/cells/llm/evaluation/fixtures",
]
markers = [
    "integration: integration/e2e style tests",
    "slow: long-running tests",
]
filterwarnings = [
    # nats-py currently uses asyncio.iscoroutinefunction internally.
    # Keep test output clean until upstream migrates to inspect.iscoroutinefunction.
    "ignore:.*iscoroutinefunction.*:DeprecationWarning:nats\\.aio\\.client",
]

[tool.mypy]
python_version = "3.10"
# Strict mode enforcement (Task #4)
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
# Ignore missing imports for third-party packages
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true
exclude = [
    "^tools\\.py$",
    "^infrastructure/",
    "^scripts/",
    ".*/tests/",
]

# Ruff 配置唯一真相在根目录 ruff.toml（ruff 同目录优先 ruff.toml，pyproject [tool.ruff]
# 历史上被遮蔽成死配置并造成 ANN203 配置漂移事件）。此处不得再出现 [tool.ruff*] 块。
# black 已退役，格式化唯一工具是 ruff format（ruff.toml [format]）。

[tool.coverage.run]
# Squad B Wave 1: explicitly include every polaris top-level subpackage so
# that delivery/ (279 files) is no longer a measurement blind spot. Using the
# package form (rather than a path under src/backend) tells coverage.py to
# walk the import graph and record any imported submodule, even if the
# current test suite never imports it (rendered as 0% rather than absent).
source_pkgs = [
    "polaris",
]
# Keep the legacy `source` for tools that don't honour `source_pkgs`.
source = ["src/backend"]
relative_files = true
omit = [
    # Path-style globs (POSIX) and module-style globs to match both
    # Windows backslash paths and Linux forward slashes.
    "*/tests/*",
    "*\\tests\\*",
    "*/test_*.py",
    "*\\test_*.py",
    "**/conftest.py",
    "**/_archived/**",
    "**/_archived*",
    "src/backend/polaris/cells/llm/evaluation/fixtures/**",
]

[tool.coverage.paths]
# Map both the absolute build path and the relative repo path to the same
# logical source so coverage merges runs from CI vs developer machines.
polaris = [
    "src/backend/polaris",
    "*/src/backend/polaris",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
